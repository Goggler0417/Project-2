function field(name,type,extra={}){return {id:uid(),name,type,required:false,visible:true,searchable:true,sortable:false,inputType:'auto',component:'auto',...extra}}

function makeTab(name,type,baseSchema){return {id:uid(),name,type,icon:type==='bookmark'?'🔖':type==='tag'?'🏷️':type==='profile'?'👤':'📄',layout:'grid',sort:'asc',sortField:'',search:true,filter:{},schema:clone(baseSchema||[]),schemaMode:'independent'}}

function blankDB(){const p=makePage('새 Page');return {schemaVersion:2,appVersion:VERSION,main:{layout:'grid',sort:'asc'},pages:[p],activePageId:p.id};}

function inferComponent(f){if(f.component&&f.component!=='auto')return f.component;const n=String(f.name||'').toLowerCase();if(f.type.startsWith('character'))return 'character';if(f.type==='url')return n.includes('url')?'url':'url';if(f.type==='category'||f.type==='category[]')return 'category';if(f.type.startsWith('tag')){if(/artist/.test(n))return 'artist';if(/series/.test(n))return 'series';return 'tags'}if(/title|제목|이름/.test(n))return 'title';if(/note|memo|메모|설명/.test(n))return 'note';return 'generic'}

function componentField(t,component){

}
function page(){return db.pages.find(p=>p.id===state.pageId)||db.pages[0]}

function openIDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('IndexedDB를 열 수 없습니다.'));})}

function toast(msg){const e=document.createElement('div');e.textContent=msg;e.style='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:2000;background:#111827;color:white;padding:10px 14px;border-radius:9px;box-shadow:0 8px 30px #0004;font-size:13px';document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}

function displayValue(v,type){if(v===undefined||v===null||v==='')return '<span class="subtle">—</span>';if(type.endsWith('[]')&&Array.isArray(v))return v.map(x=>displayValue(x,type.slice(0,-2))).join(' ');if(type==='url')return `<a class="link" href="${esc(v)}" target="_blank" rel="noopener">열기</a>`;if(type==='boolean')return v?'✓':'—';if(type==='duration')return esc(v);if(type==='tag'||type==='profile'||type==='category'||type==='folder'||type==='relation')return `<span class="chip">${esc(resolveRef(v,type))}</span>`;if(type==='color')return `<span class="color-dot" style="background:${esc(v)}"></span>`;return esc(v).replace(/\n/g,'<br>')}

  const folders=page().data.folders||[],fmap=new Map(folders.map(f=>[f.id,f])),allRecords=recordArray(t),loose=arr.filter(r=>!r.folderId||!fmap.has(r.folderId)),entities=loose.map(r=>({type:'record',item:r}));
  for(const f of folders){const allChildren=allRecords.filter(r=>r.folderId===f.id),matching=arr.filter(r=>r.folderId===f.id),folderHit=!q||`${f.name||''} ${f.title||''} ${f.description||''}`.toLowerCase().includes(q);if(!q||folderHit||matching.length)entities.push({type:'folder',item:f,children:(q&&folderHit)?allChildren:matching})}

function bulkEditProfiles(){if(!state.profileSelected.size)return toast('프로필을 선택하세요.');const t=currentTab(),fs=t.schema.filter(f=>f.component!=='profile_tag'&&!f.type?.startsWith('character'));modal('프로필 일괄 수정',`<div class="form"><div class="notice">${state.profileSelected.size}개 프로필 · 체크한 필드만 변경</div>${fs.map(f=>`<label class="check"><input type="checkbox" class="bp-on" data-id="${f.id}"> ${esc(f.name)}</label><input class="bp-val" data-id="${f.id}" placeholder="${esc(f.name)} 새 값">`).join('')}</div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulkProfileEdit()">적용</button>`)}
async function applyBulkProfileEdit(){const changes={};document.querySelectorAll('.bp-on:checked').forEach(c=>changes[c.dataset.id]=document.querySelector(`.bp-val[data-id="${c.dataset.id}"]`)?.value??'');for(const p of page().data.profiles.filter(x=>state.profileSelected.has(x.id))){Object.assign(p.data,changes);const t=currentTab(),nf=t.schema.find(f=>inferComponent(f)==='profile_title')||t.schema[0];if(nf&&changes[nf.id]!==undefined)p.name=String(changes[nf.id]);syncProfileTag(p,t)}await saveDB();closeModal();renderBody()}
async function bulkDeleteProfiles(){if(!state.profileSelected.size)return toast('프로필을 선택하세요.');if(!confirm(`${state.profileSelected.size}개 프로필을 삭제할까요?`))return;const ids=new Set(state.profileSelected);for(const tag of [...page().data.tags])if(tag.profileId&&ids.has(tag.profileId))removeTagReferences(tag.id);page().data.tags=page().data.tags.filter(t=>!ids.has(t.profileId));page().data.profiles=page().data.profiles.filter(p=>!ids.has(p.id));state.profileSelected.clear();await saveDB();renderBody()}
function profileView(t){const p=page(),q=(state.tabSearch[t.id]??t.searchText??'').trim().toLowerCase();state.search=q;const visibleHeads=t.profileVisibleTagHeadIds||[];let arr=p.data.profiles.filter(x=>{const pt=p.data.tags.find(z=>z.profileId===x.id),head=pt?.tagHeadId||'';return (!visibleHeads.length||visibleHeads.includes(head))&&(!q||searchText(x.data).includes(q)||String(x.name||'').toLowerCase().includes(q))});arr.sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ko')*(t.sort==='asc'?1:-1));const cfg=t.profileGroup||{mode:'none',fieldId:'',tagId:''},groups=new Map();const add=(k,x)=>{if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)};if(cfg.mode==='manual'){for(const x of arr){const f=p.data.profileFolders.find(f=>f.id===x.folderId);add(f?.name||'폴더 없음',x)}}else if(cfg.mode==='field'&&cfg.fieldId){const f=t.schema.find(x=>x.id===cfg.fieldId);for(const x of arr){const v=x.data?.[cfg.fieldId];if(Array.isArray(v)&&v.length)v.forEach(id=>add(resolveRef(id,f?.type?.replace('[]','')||'tag'),x));else if(v)add(resolveRef(v,f?.type||'tag'),x);else add('기타',x)}}else if(cfg.mode==='tag'&&cfg.tagId){for(const x of arr)add(profileHasTag(x,cfg.tagId)?(page().data.tags.find(z=>z.id===cfg.tagId)?.name||'해당 태그'):'기타',x)}else groups.set('전체',arr);return `<div class="tab-sticky-tools">${toolbar(t,false)}<div class="actions"><button class="primary" onclick="newProfile()">＋ 프로필</button><button onclick="toggleProfileSelectMode()">${state.profileSelectMode?'선택 종료':'선택'}</button>${state.profileSelectMode?`<button onclick="selectVisibleProfiles(true)">전체 선택</button><button onclick="selectVisibleProfiles(false)">선택 해제</button><button onclick="bulkEditProfiles()">일괄 수정</button><button class="danger" onclick="bulkDeleteProfiles()">일괄 삭제</button><span class="meta">${state.profileSelected.size}개 선택</span>`:''}<button onclick="schemaEditor('${t.id}')">필드 편집</button><button onclick="profileTagHeadSettings('${t.id}')">프로필 태그 머리</button><button onclick="profileTypeSettings('${t.id}')">표시할 프로필 종류</button><button onclick="profileGroupSettings('${t.id}')">그룹/폴더 설정</button>${cfg.mode==='manual'?'<button onclick="profileFolderManager()">폴더 관리</button>':''}</div><div class="profile-group-note">그룹 기준: ${esc(profileGroupLabel(t))}</div></div>${[...groups].map(([g,rows])=>{const key=btoa(unescape(encodeURIComponent(g))).replace(/=/g,'');const open=t.profileFolderOpen?.[key]!==false;return `<details class="profile-folder" ${open?'open':''} ontoggle="saveProfileFolderOpen('${key}',this.open)"><summary><span>📁 ${esc(g)}</span><span class="meta">${rows.length}개</span></summary><div class="profile-folder-body ${t.layout==='grid'?'':'view-list'}">${rows.map(x=>profileCard(x,t)).join('')}</div></details>`}).join('')||'<div class="empty">프로필이 없습니다.</div>'}`}
function profileHasTag(x,id){return Object.values(x.data||{}).some(v=>v===id||(Array.isArray(v)&&v.includes(id)))}
function profileGroupLabel(t){const c=t.profileGroup||{};if(c.mode==='manual')return '수동 폴더';if(c.mode==='field')return '항목: '+(t.schema.find(f=>f.id===c.fieldId)?.name||'선택 안 함');if(c.mode==='tag')return '태그: '+(page().data.tags.find(x=>x.id===c.tagId)?.name||'선택 안 함');return '없음'}

function profileGroupSettings(tabId){const t=page().tabs.find(x=>x.id===tabId),c=t.profileGroup||{};modal('프로필 그룹/폴더 설정',`<div class="form"><label>그룹 방식<select id="pgMode" onchange="document.getElementById('pgFieldWrap').hidden=this.value!=='field';document.getElementById('pgTagWrap').hidden=this.value!=='tag'"><option value="none" ${c.mode==='none'?'selected':''}>그룹 없음</option><option value="field" ${c.mode==='field'?'selected':''}>항목 값을 기준으로 자동 그룹</option><option value="tag" ${c.mode==='tag'?'selected':''}>특정 태그 포함 여부로 그룹</option><option value="manual" ${c.mode==='manual'?'selected':''}>수동 폴더</option></select></label><label id="pgFieldWrap" ${c.mode!=='field'?'hidden':''}>기준 항목<select id="pgField">${t.schema.filter(f=>f.visible!==false).map(f=>`<option value="${f.id}" ${c.fieldId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><label id="pgTagWrap" ${c.mode!=='tag'?'hidden':''}>기준 태그<select id="pgTag">${page().data.tags.map(x=>`<option value="${x.id}" ${c.tagId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="notice">자동 그룹은 현재 프로필 데이터에 따라 즉시 재구성됩니다. 수동 폴더는 프로필 자체의 folderId로 저장되어 새로고침 후에도 유지됩니다.</div></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveProfileGroup('${tabId}')">저장</button>`)}
function saveProfileGroup(tabId){const t=page().tabs.find(x=>x.id===tabId);t.profileGroup={mode:document.getElementById('pgMode').value,fieldId:document.getElementById('pgField')?.value||'',tagId:document.getElementById('pgTag')?.value||''};saveDB().then(()=>{closeModal();renderBody()})}
function profileFolderManager(){const p=page();modal('프로필 수동 폴더',`<div class="form"><button class="primary" onclick="newProfileFolder()">＋ 새 폴더</button><div class="list-box">${p.data.profileFolders.map(f=>`<div class="reg-row"><b>${esc(f.name)}</b><span style="margin-left:auto"></span><button onclick="renameProfileFolder('${f.id}')">수정</button><button class="danger" onclick="deleteProfileFolder('${f.id}')">삭제</button></div>`).join('')}</div><label>프로필<select id="pfProfile">${p.data.profiles.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>배치할 폴더<select id="pfFolder"><option value="">폴더 해제</option>${p.data.profileFolders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label><button onclick="assignProfileFolder()">프로필 배치/해제</button></div>`,`<button onclick="closeModal()">닫기</button>`)}
function newProfileFolder(){const n=prompt('폴더 이름');if(!n?.trim())return;page().data.profileFolders.push({id:uid(),name:n.trim()});saveDB().then(()=>profileFolderManager())}

function profileCard(x,t){const nameField=t.schema.find(f=>inferComponent(f)==='profile_title')||t.schema.find(f=>f.name==='이름')||t.schema[0],genderF=t.schema.find(f=>inferComponent(f)==='gender'),name=x.data?.[nameField?.id]||x.name||'프로필',gender=x.data?.[genderF?.id]||'unknown';return `<article class="profile-card">${state.profileSelectMode?`<input class="profile-select-check" data-id="${x.id}" type="checkbox" ${state.profileSelected.has(x.id)?'checked':''} onchange="toggleProfileSelection('${x.id}',this.checked)">`:''}<div class="profile-card-title gender-${esc(gender)}">${esc(name)}</div>${t.schema.filter(f=>f.visible!==false&&f.id!==nameField?.id&&f.id!==genderF?.id&&inferComponent(f)!=='profile_tag').map(f=>{const v=fieldDisplay(x.data?.[f.id],f);return v?`<div class="profile-card-line"><span class="profile-label">${esc(f.name)}</span><span class="profile-value">${v}</span></div>`:''}).join('')}<div class="profile-card-actions"><button onclick="editProfile('${x.id}')">수정</button><button class="danger" onclick="deleteProfile('${x.id}')">삭제</button></div></article>`}

function openProfileModal(id){const p=page(),t=currentTab()?.type==='profile'?currentTab():p.tabs.find(x=>x.type==='profile'),x=id?p.data.profiles.find(x=>x.id===id):{id:uid(),data:{}};if(!t)return toast('프로필 탭이 없습니다.');modal(id?'프로필 편집':'프로필 등록',profileEditor(t,x),`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveProfile('${t.id}','${x.id}',${!!id})">저장</button>`);initProfileEditor(t,x)}
function profileEditor(t,x){window._profileEntityState={};for(const f of t.schema.filter(f=>f.type?.startsWith('character')))window._profileEntityState[f.id]=clone(x.data?.[f.id]||[]);return `<div class="record-editor profile-editor">${t.schema.filter(f=>f.visible!==false&&inferComponent(f)!=='profile_tag').map(f=>profileField(f,x.data?.[f.id])).join('')}</div>`}
function profileField(f,v){const c=inferComponent(f),i=effectiveInput(f);if(f.type?.startsWith('character'))return profileEntityInput(f);if(c==='profile_title'&&i==='auto')return `<div class="editor-field"><label>${esc(f.name)}</label><input data-gfield="${f.id}" value="${esc(v||'')}"></div>`;if(c==='gender'&&i==='auto'){const opts=f.options||['male','female','both','unknown'];return `<div class="editor-field"><label>${esc(f.name)}</label><div data-gfield="${f.id}" class="generic-choice">${opts.map(o=>`<label><input type="radio" name="gf-${f.id}" value="${esc(o)}" ${(v||opts[0])===o?'checked':''}> ${esc(o)}</label>`).join('')}</div></div>`}return `<div class="editor-field"><label>${esc(f.name)}</label>${fieldInput(f,v)}</div>`}
function profileEntityInput(f){const rows=window._profileEntityState?.[f.id]||[];return `<div class="editor-field entity-input" data-pef="${f.id}"><div class="entity-head"><label>${esc(f.name)}</label></div><div class="pe-rows">${rows.map((c,i)=>profileEntityRow(f,c,i)).join('')}</div><div class="entity-tools"><button type="button" class="primary" onclick="addProfileEntityRow('${f.id}')">＋ 추가</button></div></div>`}
function profileEntitySubfield(f,c,sf){const v=c[sf.key]??'';if(sf.inputType==='gender')return `<label>${esc(sf.name)}<select class="pe-dyn" data-key="${sf.key}"><option value="unknown" ${v==='unknown'?'selected':''}>Unknown</option><option value="female" ${v==='female'?'selected':''}>Female</option><option value="male" ${v==='male'?'selected':''}>Male</option><option value="both" ${v==='both'?'selected':''}>Both</option></select></label>`;if(sf.inputType==='tag_search')return `<label>${esc(sf.name)}<select class="pe-dyn" data-key="${sf.key}" multiple>${page().data.tags.filter(t=>!sf.allowedTagHeadIds?.length||sf.allowedTagHeadIds.includes(t.tagHeadId)).map(t=>`<option value="${t.id}" ${(Array.isArray(v)?v:[]).includes(t.id)?'selected':''}>${esc(fullTagLabel(t.id))}</option>`).join('')}</select></label>`;if(sf.inputType==='long_text')return `<label>${esc(sf.name)}<textarea class="pe-dyn" data-key="${sf.key}">${esc(v||'')}</textarea></label>`;return `<label>${esc(sf.name)}<input class="pe-dyn" data-key="${sf.key}" value="${esc(v||'')}"></label>`}
function profileEntityRow(f,c,i){return `<div class="entity-row"><div class="entity-main">${(f.characterSchema||defaultCharacterSchema()).map(sf=>profileEntitySubfield(f,c,sf)).join('')}<button type="button" onclick="removeProfileEntityRow('${f.id}',${i})">×</button></div></div>`}
function syncProfileEntityField(fid){const root=document.querySelector(`[data-pef="${fid}"]`),f=currentTab().schema.find(x=>x.id===fid);if(!root||!f)return;const schema=f.characterSchema||defaultCharacterSchema();window._profileEntityState[fid]=[...root.querySelectorAll('.entity-row')].map(r=>{const o={};for(const sf of schema){const el=r.querySelector(`.pe-dyn[data-key="${sf.key}"]`);o[sf.key]=sf.inputType==='tag_search'?[...(el?.selectedOptions||[])].map(x=>x.value):(el?.value||'')}return o})}
function addProfileEntityRow(fid){syncProfileEntityField(fid);window._profileEntityState[fid].push({});const f=currentTab().schema.find(x=>x.id===fid),root=document.querySelector(`[data-pef="${fid}"] .pe-rows`);root.innerHTML=window._profileEntityState[fid].map((c,i)=>profileEntityRow(f,c,i)).join('')}
function removeProfileEntityRow(fid,i){syncProfileEntityField(fid);window._profileEntityState[fid].splice(i,1);const f=currentTab().schema.find(x=>x.id===fid),root=document.querySelector(`[data-pef="${fid}"] .pe-rows`);root.innerHTML=window._profileEntityState[fid].map((c,j)=>profileEntityRow(f,c,j)).join('')}
function profileTagChip(fid,id){const x=rc().tagMap.get(id);if(!x)return '';const h=rc().headMap.get(x.tagHeadId),c=h?.color||'#4b5563';return `<span class="tag-chip" data-tag-id="${id}" style="--tag-color:${esc(c)}">${esc(fullTagLabel(id))} <button type="button" onclick="this.parentElement.remove()">×</button></span>`}

function addProfileFieldTag(fid,id){const box=document.querySelector(`.lp-selected[data-for="${fid}"]`);if(!box||box.querySelector(`[data-tag-id="${id}"]`))return;box.insertAdjacentHTML('beforeend',profileTagChip(fid,id));const inp=document.querySelector(`.lp-tag[data-pfield="${fid}"]`);if(inp)inp.value='';document.querySelector(`.lp-suggest[data-for="${fid}"]`)?.classList.remove('open')}
function createProfileFieldTag(fid){const t=currentTab()?.type==='profile'?currentTab():page().tabs.find(x=>x.type==='profile'),f=t.schema.find(x=>x.id===fid),inp=document.querySelector(`.lp-tag[data-pfield="${fid}"]`),name=inp?.value.trim();if(!name)return;const allowed=f.allowedTagHeadIds||[];let tag=page().data.tags.find(x=>x.name.toLowerCase()===name.toLowerCase()&&(!allowed.length||allowed.includes(x.tagHeadId)));if(!tag){tag={id:uid(),name,tagHeadId:allowed[0]||'',color:'#6b7280'};page().data.tags.push(tag)}addProfileFieldTag(fid,tag.id)}

async function saveProfile(tabId,id,editing){const p=page(),t=p.tabs.find(x=>x.id===tabId&&x.type==='profile');if(!t)return toast('프로필 탭을 찾을 수 없습니다.');const data={};for(const f of t.schema){if(f.component==='profile_tag')continue;if(f.type?.startsWith('character')){syncProfileEntityField(f.id);data[f.id]=clone(window._profileEntityState?.[f.id]||[]);continue}const v=readGenericField(f);if(v!==undefined)data[f.id]=v}const nf=t.schema.find(f=>inferComponent(f)==='profile_title')||t.schema[0];if(nf&&(!data[nf.id]||!String(data[nf.id]).trim()))return toast('프로필 이름을 입력하세요.');let x=editing?p.data.profiles.find(x=>x.id===id):{id,data:{}};x.data=data;x.name=String(data[nf.id]).trim();if(!editing)p.data.profiles.push(x);syncProfileTag(x,t);await saveDB();closeModal();renderBody()}
function syncProfileTag(profile,profileTab=currentTab()?.type==='profile'?currentTab():null){const p=page(),existing=p.data.tags.find(t=>t.profileId===profile.id),head=profileTab?.profileTagHeadId||existing?.tagHeadId||'';const name=profile.name;if(existing){existing.name=name;if(head)existing.tagHeadId=head}else p.data.tags.push({id:uid(),name,profileId:profile.id,tagHeadId:head,color:'#7c5cff'})}

function categoryView(t){const p=page();return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newCategory()">＋ 카테고리</button></div><div class="entity-grid">${p.data.categories.map(x=>`<article class="entity-card"><div class="card-actions"><button onclick="editCategory('${x.id}')">✎</button><button class="danger" onclick="deleteCategory('${x.id}')">×</button></div><h3>${esc(x.name)}</h3><div class="subtle">${esc(x.description||'')}</div></article>`).join('')||'<div class="empty">카테고리가 없습니다.</div>'}</div>`}

function initPageTabOrder(){const box=document.getElementById('pageTabOrder');if(!box)return;let item=null,pid=null;const move=e=>{if(!item||e.pointerId!==pid)return;e.preventDefault();const rows=[...box.querySelectorAll('.page-tab-order-row:not(.dragging)')],hit=rows.find(r=>{const b=r.getBoundingClientRect();return e.clientY<b.top+b.height/2});hit?box.insertBefore(item,hit):box.appendChild(item)};const done=e=>{if(!item||e.pointerId!==pid)return;item.classList.remove('dragging');item=null;pid=null;document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',done);document.removeEventListener('pointercancel',done)};box.querySelectorAll('.drag-handle').forEach(h=>h.onpointerdown=e=>{item=h.closest('.page-tab-order-row');pid=e.pointerId;item.classList.add('dragging');document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',done);document.addEventListener('pointercancel',done);e.preventDefault()})}

function openTabModal(id){const p=page(),x=id?p.tabs.find(t=>t.id===id):{id:uid(),name:'새 탭',type:'custom',layout:'grid',sort:'asc',search:true,schema:[]};const types=[['bookmark','북마크'],['tag','태그'],['profile','프로필'],['category','카테고리'],['folder','폴더'],['custom','사용자 정의']];modal(id?'탭 설정':'새 탭',`<div class="form"><label>탭 이름<input id="tabName" value="${esc(x.name)}"></label><label>탭 유형<select id="tabType" ${id?'disabled':''}>${types.map(([v,n])=>`<option value="${v}" ${x.type===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="check"><input id="tabSearch" type="checkbox" ${x.search!==false?'checked':''}> 검색 사용</label><label class="check"><input id="tabGrid" type="checkbox" ${x.layout==='grid'?'checked':''}> 그리드 기본</label><div class="notice">같은 유형의 탭은 여러 개 만들 수 있습니다. 단, 북마크 탭은 Page당 하나만 만들 수 있습니다.</div></div>`,`<button class="danger" onclick="deleteTab('${x.id}')" ${id?'':'style="display:none"'}>탭 삭제</button><button onclick="closeModal()">취소</button><button class="primary" onclick="saveTab('${x.id}',${!!id})">저장</button>`)}
async function saveTab(id,editing){const p=page(),type=document.getElementById('tabType').value,name=document.getElementById('tabName').value.trim()||'새 탭';if(type==='bookmark'&&p.tabs.some(t=>t.type==='bookmark'&&t.id!==id))return toast('한 Page에는 북마크 탭을 하나만 만들 수 있습니다.');let x=editing?p.tabs.find(t=>t.id===id):{id:uid(),name,type,icon:type==='bookmark'?'🔖':type==='tag'?'🏷️':type==='profile'?'👤':type==='category'?'🗂️':type==='folder'?'📁':'📄',layout:'grid',sort:'asc',search:true,schema:[]};x.name=name;x.search=document.getElementById('tabSearch').checked;x.layout=document.getElementById('tabGrid').checked?'grid':'list';if(!editing){const base=type==='bookmark'||type==='profile'||type==='folder'?p.schemas[type]:[];x.schema=clone(base);if(type==='profile')x.profileInputConfig={mode:'mirror',schema:profileInputBaseSchema(x)};p.tabs.push(x);state.tabId=x.id}else{if(['bookmark','profile','folder'].includes(x.type)&&x.schema.length===0)x.schema=clone(p.schemas[x.type])}await saveDB();closeModal();renderBody()}
async function deleteTab(id){const p=page(),x=p.tabs.find(t=>t.id===id);if(!x)return;if(!confirm(`"${x.name}" 탭을 삭제할까요? 실제 Page 데이터는 삭제되지 않습니다.`))return;p.tabs=p.tabs.filter(t=>t.id!==id);state.tabId=p.tabs[0]?.id||null;await saveDB();closeModal();renderBody()}
let schemaDraftTabId=null;
function schemaEditor(tabId){const t=page().tabs.find(x=>x.id===tabId);if(!t)return;schemaDraftTabId=tabId;modal(`${esc(t.name)} · UI / 필드 편집기`,`<div class="ui-editor"><div class="ui-editor-left"><div class="schema-help"><b>실시간 UI 편집기</b> — Profile 입력 구조는 Profile 탭에서만 설계합니다. 다른 탭에서는 Profile 탭이 제공하는 “(탭 이름) 입력 필드”를 입력 방식으로 선택합니다.</div><div id="schemaRows">${t.schema.map(schemaRow).join('')}</div><div class="schema-add-actions"><button onclick="addSchemaRow()">＋ 필드 추가</button>${t.type==='profile'?`<button onclick="profileInputFieldEditor('${t.id}')">프로필 입력 필드 편집</button>`:''}</div></div><div class="ui-editor-right"><div class="preview-title">입력 팝업 미리보기</div><div id="schemaLivePreview"></div></div></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveSchema('${tabId}')">저장</button>`);requestAnimationFrame(()=>{initSchemaDrag();bindSchemaPreview();renderSchemaPreview()})}
const INPUT_CHOICES=[['auto','자동'],['text','텍스트'],['long_text','장문'],['url','URL'],['number','숫자'],['toggle','토글'],['cycle_button','순환 선택 버튼'],['date','날짜'],['datetime','날짜·시간'],['duration','기간'],['tag_search','태그 검색'],['profile_search','프로필 검색'],['category_search','카테고리 검색'],['folder_search','폴더 검색'],['radio','라디오'],['checkbox','체크박스'],['dropdown','드롭다운'],['color','색상'],['rating','평점']];
function inputChoicesForTab(tab){const a=[...INPUT_CHOICES];for(const pt of page().tabs.filter(x=>x.type==='profile'))a.push([`profile_input:${pt.id}`,`${pt.name} 입력 필드`]);return a}
const DISPLAY_CHOICES=[['auto','자동'],['title','제목'],['item','항목'],['memo','메모'],['character','등장인물'],['tag','태그'],['profile','프로필'],['link','링크'],['value','값'],['badge','배지'],['hidden','숨김']];
function schemaRow(f){return `<div class="schema-row schema-editor-row" data-row="${f.id}"><button type="button" class="drag-handle" title="드래그해서 순서 변경">≡</button><input class="sf-name" value="${esc(f.name)}" placeholder="항목 이름"><select class="sf-type">${FIELD_TYPES.map(([v,n])=>`<option value="${v}" ${f.type===v?'selected':''}>${n}</option>`).join('')}</select><select class="sf-input">${inputChoicesForTab(page().tabs.find(x=>x.id===schemaDraftTabId)||currentTab()).map(([v,n])=>`<option value="${v}" ${(f.inputType||'auto')===v?'selected':''}>${esc(n)}</option>`).join('')}</select><select class="sf-display">${DISPLAY_CHOICES.map(([v,n])=>`<option value="${v}" ${(f.displayType||'auto')===v?'selected':''}>${n}</option>`).join('')}</select><input type="hidden" class="sf-component" value="${esc(f.component||'auto')}"><div class="sf-flags"><label class="check small"><input class="sf-req" type="checkbox" ${f.required?'checked':''}> 필수</label><label class="check small"><input class="sf-vis" type="checkbox" ${f.visible!==false?'checked':''}> 표시</label></div><div class="sf-actions"><button type="button" onclick="fieldAdvanced('${f.id}')">설정</button><button type="button" class="danger" onclick="deleteSchemaRow(this)">삭제</button></div></div>`}
function deleteSchemaRow(btn){if(!confirm('이 필드를 삭제할까요? 저장 전까지 실제 데이터에는 반영되지 않습니다.'))return;btn.closest('.schema-row')?.remove();renderSchemaPreview()}

function profileInputBaseSchema(tab){return clone((tab?.schema||[]).filter(f=>inferComponent(f)!=='profile_tag').map(f=>({...f,sourceFieldId:f.id})))}
function profileInputConfig(tab){if(!tab.profileInputConfig)tab.profileInputConfig={mode:'mirror',schema:profileInputBaseSchema(tab)};if(tab.profileInputConfig.mode==='mirror')tab.profileInputConfig.schema=profileInputBaseSchema(tab);return tab.profileInputConfig}
function profileInputFieldEditor(tabId){const t=page().tabs.find(x=>x.id===tabId);if(!t||t.type!=='profile')return;const cfg=clone(profileInputConfig(t));window._profileInputDraft={tabId,mode:cfg.mode||'mirror',schema:cfg.mode==='custom'?(cfg.schema||[]):profileInputBaseSchema(t)};modal(`${esc(t.name)} 입력 필드 편집`,`<div class="form"><div class="notice">이 Profile 탭은 입력 방식 <b>${esc(t.name)} 입력 필드</b>를 자동 제공합니다.</div><div class="preview-choices"><label><input type="radio" name="piMode" value="mirror" ${cfg.mode!=='custom'?'checked':''} onchange="setProfileInputMode('mirror')"> 프로필과 동일</label><label><input type="radio" name="piMode" value="custom" ${cfg.mode==='custom'?'checked':''} onchange="setProfileInputMode('custom')"> 사용자 지정</label></div><div id="profileInputRows">${profileInputRowsHTML(window._profileInputDraft.schema)}</div><div id="profileInputAdd">${cfg.mode==='custom'?'<button type="button" onclick="addProfileInputSubfield()">＋ 입력 필드 추가</button>':''}</div></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveProfileInputField('${tabId}')">저장</button>`)}
function profileInputRowsHTML(fields){const custom=window._profileInputDraft?.mode==='custom';return (fields||[]).map(f=>`<div class="profile-input-field-row" data-pif="${f.id}"><span class="drag-handle">≡</span><input class="pif-name" value="${esc(f.name||'필드')}" ${custom?'':'disabled'}><select class="pif-input" ${custom?'':'disabled'}>${INPUT_CHOICES.map(([v,n])=>`<option value="${v}" ${(f.inputType||'auto')===v?'selected':''}>${esc(n)}</option>`).join('')}</select><select class="pif-display" ${custom?'':'disabled'}>${DISPLAY_CHOICES.map(([v,n])=>`<option value="${v}" ${(f.displayType||'auto')===v?'selected':''}>${esc(n)}</option>`).join('')}</select>${custom?`<button type="button" class="danger" onclick="this.closest('.profile-input-field-row').remove()">삭제</button>`:'<span></span>'}<div class="profile-input-heads">${page().data.tagHeads.map(h=>`<label class="check small"><input class="pif-head" type="checkbox" value="${h.id}" ${(f.allowedTagHeadIds||[]).includes(h.id)?'checked':''} ${custom?'':'disabled'}> <span style="color:${esc(h.color||'#4b5563')}">${esc(h.name)}</span></label>`).join('')}</div></div>`).join('')}
function readProfileInputRows(){return [...document.querySelectorAll('#profileInputRows .profile-input-field-row')].map(r=>{const old=clone(window._profileInputDraft.schema.find(x=>x.id===r.dataset.pif)||field('필드','text'));old.id=r.dataset.pif||uid();old.name=r.querySelector('.pif-name')?.value.trim()||'필드';old.inputType=r.querySelector('.pif-input')?.value||'auto';old.displayType=r.querySelector('.pif-display')?.value||'auto';old.allowedTagHeadIds=[...r.querySelectorAll('.pif-head:checked')].map(x=>x.value);return old})}
function setProfileInputMode(mode){const t=page().tabs.find(x=>x.id===window._profileInputDraft.tabId);if(window._profileInputDraft.mode==='custom')window._profileInputDraft.schema=readProfileInputRows();window._profileInputDraft.mode=mode;if(mode==='mirror')window._profileInputDraft.schema=profileInputBaseSchema(t);else if(!window._profileInputDraft.schema?.length)window._profileInputDraft.schema=profileInputBaseSchema(t);document.getElementById('profileInputRows').innerHTML=profileInputRowsHTML(window._profileInputDraft.schema);document.getElementById('profileInputAdd').innerHTML=mode==='custom'?'<button type="button" onclick="addProfileInputSubfield()">＋ 입력 필드 추가</button>':''}
function addProfileInputSubfield(){window._profileInputDraft.schema=readProfileInputRows();window._profileInputDraft.schema.push(field('새 입력 필드','text'));document.getElementById('profileInputRows').innerHTML=profileInputRowsHTML(window._profileInputDraft.schema)}
async function saveProfileInputField(tabId){const t=page().tabs.find(x=>x.id===tabId),mode=document.querySelector('input[name="piMode"]:checked')?.value||'mirror';t.profileInputConfig={mode,schema:mode==='mirror'?profileInputBaseSchema(t):readProfileInputRows()};await saveDB();closeModal();toast(`${t.name} 입력 필드를 저장했습니다.`)}
function profileInputSchemaByType(inputType){const id=String(inputType||'').startsWith('profile_input:')?String(inputType).slice(14):'';const t=page().tabs.find(x=>x.id===id&&x.type==='profile');if(!t)return null;const cfg=profileInputConfig(t);return {tab:t,schema:cfg.mode==='mirror'?profileInputBaseSchema(t):clone(cfg.schema||[])}}
function fieldAdvanced(id){const row=document.querySelector(`#schemaRows .schema-row[data-row="${id}"]`);if(!row)return;let panel=row.querySelector('.field-advanced-inline');if(panel){panel.remove();return}const t=page().tabs.find(x=>x.id===schemaDraftTabId),old=t?.schema.find(f=>f.id===id)||{},input0=row.querySelector('.sf-input').value,input=input0==='auto'?(row.querySelector('.sf-type').value.startsWith('character')?'character':row.querySelector('.sf-type').value.startsWith('tag')?'tag_search':input0):input0,heads=page().data.tagHeads||[],allowed=(row.dataset.allowedHeads?JSON.parse(row.dataset.allowedHeads):old.allowedTagHeadIds)||[],opts=(row.dataset.options?JSON.parse(row.dataset.options):old.options)||[],genderHeads=(row.dataset.genderHeads?JSON.parse(row.dataset.genderHeads):old.genderTagHeads)||{female:[],male:[],both:[]};panel=document.createElement('div');panel.className='field-advanced-inline';panel.style.cssText='grid-column:2/-1;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fafbfe';panel.innerHTML=`${['tag_search','character'].includes(input)?`<b>검색/등록할 태그 머리</b><div class="list-box adv-head-box">${heads.map(h=>`<label class="check"><input class="adv-head" type="checkbox" value="${h.id}" ${allowed.includes(h.id)?'checked':''}> <span style="color:${esc(h.color||'#4b5563')}">${esc(h.name)}</span></label>`).join('')}</div>`:''}${input==='character'&&t?.type==='profile'?`<div class="character-schema-editor"><div class="character-schema-head"><b>등장인물 내부 필드</b><button type="button" onclick="addCharacterSubfield('${id}')">＋ 내부 필드</button></div><div class="subtle">이 등장인물 입력칸 안에서 사용할 필드를 직접 구성합니다. 태그 입력 필드마다 허용 Tag Head를 따로 지정할 수 있습니다.</div><div class="character-subfields">${characterSubfieldsHTML(id,row.dataset.characterSchema?JSON.parse(row.dataset.characterSchema):(old.characterSchema||defaultCharacterSchema()))}</div></div>`:''}${['radio','checkbox','dropdown','cycle_button','toggle_button'].includes(input)?`<label><b>선택지</b> (한 줄에 하나)<textarea class="adv-options">${esc(opts.join('\n'))}</textarea></label>`:''}${!['tag_search','character'].includes(input)&&!['radio','checkbox','dropdown','cycle_button','toggle_button'].includes(input)?'<span class="subtle">이 입력 방식에는 추가 설정이 없습니다.</span>':''}`;row.appendChild(panel);panel.addEventListener('change',()=>{if(panel.querySelector('.character-subfields'))row.dataset.characterSchema=JSON.stringify(readCharacterSchema(row));captureInlineAdvanced(row)});panel.addEventListener('input',()=>{if(panel.querySelector('.character-subfields'))row.dataset.characterSchema=JSON.stringify(readCharacterSchema(row));captureInlineAdvanced(row)});}

function defaultCharacterSchema(){return[
 {id:uid(),name:'이름 / 프로필',key:'identity',inputType:'identity',allowedTagHeadIds:[]},
 {id:uid(),name:'성별',key:'gender',inputType:'gender',allowedTagHeadIds:[]},
 {id:uid(),name:'작품 내 태그',key:'tags',inputType:'tag_search',allowedTagHeadIds:[]}
]}
function characterSubfieldsHTML(fid,fields){const heads=page().data.tagHeads||[];return fields.map((f,i)=>`<div class="character-subfield" data-csf="${f.id}"><button type="button" class="drag-handle">≡</button><input class="csf-name" value="${esc(f.name||'필드')}" placeholder="필드 이름"><select class="csf-input"><option value="identity" ${f.inputType==='identity'?'selected':''}>이름 / Profile / Tag</option><option value="gender" ${f.inputType==='gender'?'selected':''}>성별</option><option value="tag_search" ${f.inputType==='tag_search'?'selected':''}>태그 검색</option><option value="text" ${f.inputType==='text'?'selected':''}>텍스트</option><option value="long_text" ${f.inputType==='long_text'?'selected':''}>장문</option><option value="dropdown" ${f.inputType==='dropdown'?'selected':''}>드롭다운</option><option value="checkbox" ${f.inputType==='checkbox'?'selected':''}>체크박스</option></select><input class="csf-key" value="${esc(f.key||('field_'+i))}" placeholder="저장 키"><button type="button" class="danger" onclick="deleteCharacterSubfield(this)">삭제</button><div class="character-heads">${heads.map(h=>`<label class="check small"><input type="checkbox" class="csf-head" value="${h.id}" ${(f.allowedTagHeadIds||[]).includes(h.id)?'checked':''}> <span style="color:${esc(h.color||'#4b5563')}">${esc(h.name)}</span></label>`).join('')}</div></div>`).join('')}
function readCharacterSchema(row){return [...row.querySelectorAll('.character-subfield')].map((n,i)=>({id:n.dataset.csf||uid(),name:n.querySelector('.csf-name')?.value.trim()||'필드',key:n.querySelector('.csf-key')?.value.trim()||('field_'+i),inputType:n.querySelector('.csf-input')?.value||'text',allowedTagHeadIds:[...n.querySelectorAll('.csf-head:checked')].map(x=>x.value)}))}
function addCharacterSubfield(fid){const row=document.querySelector(`#schemaRows .schema-row[data-row="${fid}"]`),box=row?.querySelector('.character-subfields');if(!box)return;const a=readCharacterSchema(row);a.push({id:uid(),name:'새 내부 필드',key:'field_'+a.length,inputType:'text',allowedTagHeadIds:[]});row.dataset.characterSchema=JSON.stringify(a);box.innerHTML=characterSubfieldsHTML(fid,a)}
function deleteCharacterSubfield(btn){const row=btn.closest('.schema-row');btn.closest('.character-subfield')?.remove();row.dataset.characterSchema=JSON.stringify(readCharacterSchema(row));renderSchemaPreview()}
function captureInlineAdvanced(row){const heads=[...row.querySelectorAll('.adv-head:checked')].map(x=>x.value);if(row.querySelector('.adv-head-box'))row.dataset.allowedHeads=JSON.stringify(heads);const gh={female:[],male:[],both:[]};row.querySelectorAll('.adv-gender-head:checked').forEach(x=>gh[x.dataset.gender].push(x.value));if(row.querySelector('.adv-gender-head'))row.dataset.genderHeads=JSON.stringify(gh);const ta=row.querySelector('.adv-options');if(ta)row.dataset.options=JSON.stringify(ta.value.split(/\n/).map(x=>x.trim()).filter(Boolean));const io={};row.querySelectorAll('.adv-char-option').forEach(x=>io[x.dataset.key]=x.value);if(Object.keys(io).length)row.dataset.inputOptions=JSON.stringify(io);renderSchemaPreview()}

function saveFieldAdvanced(id){const t=page().tabs.find(x=>x.id===schemaDraftTabId),f=t?.schema.find(x=>x.id===id);if(!f)return closeModal();if(window._advField?.input==='tag_search')f.allowedTagHeadIds=[...document.querySelectorAll('.adv-head:checked')].map(x=>x.value);if(['radio','checkbox','dropdown','cycle_button','toggle_button'].includes(window._advField?.input)){f.options=(document.getElementById('advOptions')?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean)}closeModal();renderSchemaPreview()}
function addSchemaRow(){const root=document.getElementById('schemaRows');root.insertAdjacentHTML('beforeend',schemaRow(field('새 필드','text')));delete root.dataset.dragReady;bindSchemaPreview();initSchemaDrag();renderSchemaPreview()}
function addCharacterSchemaRow(){const root=document.getElementById('schemaRows'),f=field('등장인물','character[]',{inputType:'character',displayType:'character',component:'character',characterSchema:defaultCharacterSchema()});root.insertAdjacentHTML('beforeend',schemaRow(f));const row=root.lastElementChild;row.dataset.characterSchema=JSON.stringify(f.characterSchema);delete root.dataset.dragReady;bindSchemaPreview();initSchemaDrag();renderSchemaPreview();fieldAdvanced(f.id)}

function readSchemaRows(tabId){const t=page().tabs.find(x=>x.id===tabId);return [...document.querySelectorAll('#schemaRows .schema-row')].map(row=>{const old=clone(t.schema.find(f=>f.id===row.dataset.row)||field('새 필드','text'));old.id=row.dataset.row;old.name=row.querySelector('.sf-name').value.trim()||'필드';old.type=row.querySelector('.sf-type').value;old.inputType=row.querySelector('.sf-input').value;old.displayType=row.querySelector('.sf-display').value;old.component=row.querySelector('.sf-component').value;old.required=row.querySelector('.sf-req').checked;old.visible=row.querySelector('.sf-vis').checked;if(row.dataset.allowedHeads)old.allowedTagHeadIds=JSON.parse(row.dataset.allowedHeads);if(row.dataset.options)old.options=JSON.parse(row.dataset.options);if(row.dataset.genderHeads)old.genderTagHeads=JSON.parse(row.dataset.genderHeads);if(row.dataset.inputOptions)old.inputOptions=JSON.parse(row.dataset.inputOptions);if(row.dataset.characterSchema)old.characterSchema=JSON.parse(row.dataset.characterSchema);return old})}
async function saveSchema(tabId){const t=page().tabs.find(x=>x.id===tabId);t.schema=readSchemaRows(tabId);if(!t.schema.length)return toast('최소 한 개의 필드가 필요합니다.');if(!t.schema.find(f=>f.required))t.schema[0].required=true;await saveDB();closeModal();renderBody()}
function bindSchemaPreview(){document.querySelectorAll('#schemaRows input,#schemaRows select').forEach(e=>{e.oninput=renderSchemaPreview;e.onchange=renderSchemaPreview})}
function previewControl(f){const ph=esc(f.name);const inp=f.inputType==='auto'?(f.type==='long_text'?'long_text':f.type==='tag[]'?'tag_search':f.type==='character[]'?'character':f.type):f.inputType;if(inp==='long_text')return `<textarea placeholder="${ph}"></textarea>`;if(inp==='toggle')return `<label class="check"><input type="checkbox"> 사용</label>`;if(inp==='cycle_button'||inp==='toggle_button'){const os=f.options?.length>=2?f.options:['선택 1','선택 2'];return `<button type="button" class="cycle-button-input">${esc(os[0])}</button>`;}if(['radio','checkbox'].includes(inp)){const os=f.options?.length?f.options:['선택 A','선택 B'];return `<div class="preview-choices">${os.map(o=>`<label><input type="${inp}" ${inp==='radio'?`name="pv-${f.id}"`:''}> ${esc(o)}</label>`).join('')}</div>`;}if(inp==='dropdown'){const os=f.options?.length?f.options:['샘플 항목'];return `<select><option value="">${ph} 선택</option>${os.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;}if(String(inp).startsWith('profile_input:')){const info=profileInputSchemaByType(inp);return `<div class="profile-input-instance"><b>${esc(info?.tab?.name||'프로필')} 추가</b><div class="subtle">${(info?.schema||[]).map(x=>esc(x.name)).join(' · ')}</div></div>`}if(['category_search','folder_search','profile_search'].includes(inp))return `<select><option>${ph} 선택</option><option>샘플 항목</option></select>`;if(inp==='tag_search')return `<div><input placeholder="태그 검색"><div class="preview-tags"><span>sample</span><span>example</span></div></div>`;if(inp==='character')return `<div class="preview-character"><input placeholder="프로필/이름"><select><option>성별</option><option>여성</option><option>남성</option></select><input placeholder="태그"></div>`;if(inp==='date'||inp==='datetime'||inp==='number'||inp==='url'||inp==='color')return `<input type="${inp==='datetime'?'datetime-local':inp}" placeholder="${ph}">`;return `<input placeholder="${ph}">`}
function renderSchemaPreview(){const box=document.getElementById('schemaLivePreview');if(!box||!schemaDraftTabId)return;const fs=readSchemaRows(schemaDraftTabId).filter(f=>f.visible!==false&&f.displayType!=='hidden');box.innerHTML=`<div class="preview-modal"><div class="preview-modal-title">기록 등록</div>${fs.map(f=>`<div class="preview-field"><label>${esc(f.name)}${f.required?' *':''}</label>${previewControl(f)}<small>${typeLabel(f.type)} · ${esc(f.inputType||'auto')} · ${esc(f.displayType||'auto')}</small></div>`).join('')||'<div class="empty">표시할 필드가 없습니다.</div>'}<div class="preview-footer"><button>취소</button><button class="primary">저장</button></div></div>`}
function enablePointerReorder(root,itemSelector,handleSelector,axis='y',onDone=()=>{}){root.querySelectorAll(handleSelector).forEach(h=>{h.onpointerdown=e=>{if(e.pointerType==='mouse')return;const item=h.closest(itemSelector);if(!item)return;e.preventDefault();h.setPointerCapture?.(e.pointerId);item.classList.add('dragging');const move=ev=>{const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(itemSelector);if(!target||target===item||target.parentElement!==root)return;const r=target.getBoundingClientRect(),before=axis==='x'?ev.clientX<r.left+r.width/2:ev.clientY<r.top+r.height/2;root.insertBefore(item,before?target:target.nextSibling)};const up=()=>{item.classList.remove('dragging');h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);onDone()};h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)}})}
function initSchemaDrag(){const root=document.getElementById('schemaRows');if(!root||root.dataset.dragReady)return;root.dataset.dragReady='1';let item=null,pid=null;const move=e=>{if(!item||e.pointerId!==pid)return;e.preventDefault();const rows=[...root.querySelectorAll('.schema-editor-row:not(.dragging)')];const after=rows.find(r=>e.clientY<r.getBoundingClientRect().top+r.getBoundingClientRect().height/2);after?root.insertBefore(item,after):root.appendChild(item)};const endDrag=e=>{if(!item||e.pointerId!==pid)return;item.classList.remove('dragging');item=null;pid=null;document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',endDrag);document.removeEventListener('pointercancel',endDrag);renderSchemaPreview()};root.querySelectorAll('.drag-handle').forEach(h=>{h.onpointerdown=e=>{item=h.closest('.schema-editor-row');pid=e.pointerId;item.classList.add('dragging');h.setPointerCapture?.(pid);document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);e.preventDefault()}})}
function pageSchemaEditor(kind){const p=page(),fields=p.schemas[kind]||[];modal(`Page 기본 Schema · ${kind}`,`<div class="schema-help">이 Schema는 새 ${kind} 탭을 만들 때의 기본값입니다. 이미 만들어진 탭의 Schema는 독립적으로 유지됩니다.</div><div id="pageSchemaRows">${fields.map(f=>schemaRow(f)).join('')}</div><button onclick="addPageSchemaRow('${kind}')">＋ 필드 추가</button>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="savePageSchema('${kind}')">저장</button>`)}
function addPageSchemaRow(){document.getElementById('pageSchemaRows').insertAdjacentHTML('beforeend',schemaRow(field('새 필드','text')))}
async function savePageSchema(kind){const p=page(),rows=[...document.querySelectorAll('#pageSchemaRows .schema-row')];p.schemas[kind]=rows.map(row=>{const old=p.schemas[kind]?.find(f=>f.id===row.dataset.row)||field('새 필드','text');old.name=row.querySelector('.sf-name').value.trim()||'필드';old.type=row.querySelector('.sf-type').value;old.component=row.querySelector('.sf-component').value;old.inputType=old.inputType||'auto';old.required=row.querySelector('.sf-req').checked;old.visible=row.querySelector('.sf-vis').checked;if(row.dataset.allowedHeads)old.allowedTagHeadIds=JSON.parse(row.dataset.allowedHeads);if(row.dataset.options)old.options=JSON.parse(row.dataset.options);return old});await saveDB();closeModal();renderBody()}
function tagHeadManager(){const p=page();modal('태그 머리 관리',`<div class="tag-head-manager">${p.data.tagHeads.map(h=>`<div class="tag-head-manage-row"><span style="color:${esc(h.color||'#4b5563')}">${esc(h.name)}</span><button onclick="editTagHead('${h.id}')">수정</button></div>`).join('')||'<div class="empty">태그 머리가 없습니다.</div>'}</div>`,`<button onclick="closeModal()">닫기</button>`)}
function tagHeadDisplaySettings(tabId){const t=page().tabs.find(x=>x.id===tabId),heads=page().data.tagHeads,sel=t.visibleTagHeadIds||[];modal('태그 탭 · 표시할 태그 머리',`<div class="form"><div class="notice">아무 것도 선택하지 않으면 모든 태그 머리를 표시합니다.</div>${heads.map(h=>`<label class="check"><input type="checkbox" class="tag-head-visible" value="${h.id}" ${sel.includes(h.id)?'checked':''}><span style="color:${esc(h.color||'#4b5563')}">${esc(h.name)}</span></label>`).join('')}</div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveTagHeadDisplay('${tabId}')">저장</button>`)}
async function saveTagHeadDisplay(tabId){const t=page().tabs.find(x=>x.id===tabId);t.visibleTagHeadIds=[...document.querySelectorAll('.tag-head-visible:checked')].map(x=>x.value);await saveDB();closeModal();renderBody()}
function profileTypeSettings(tabId){const t=page().tabs.find(x=>x.id===tabId),heads=page().data.tagHeads||[],sel=t.profileVisibleTagHeadIds||[];modal('표시할 프로필 종류',`<div class="form"><div class="notice">프로필과 연결된 프로필 태그의 Tag Head를 기준으로 이 탭에 표시할 프로필 종류를 정합니다. 아무 것도 선택하지 않으면 모든 프로필을 표시합니다.</div>${heads.map(h=>`<label class="check"><input class="profile-visible-head" type="checkbox" value="${h.id}" ${sel.includes(h.id)?'checked':''}> <span style="color:${esc(h.color||'#4b5563')}">${esc(h.name)}</span></label>`).join('')}<label class="check"><input class="profile-visible-head" type="checkbox" value="" ${sel.includes('')?'checked':''}> 태그 머리 없음</label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveProfileTypeSettings('${tabId}')">저장</button>`)}
async function saveProfileTypeSettings(tabId){const t=page().tabs.find(x=>x.id===tabId);t.profileVisibleTagHeadIds=[...document.querySelectorAll('.profile-visible-head:checked')].map(x=>x.value);await saveDB();closeModal();renderBody()}
function profileTagHeadSettings(tabId){const t=page().tabs.find(x=>x.id===tabId),p=page();modal('프로필 태그 머리',`<div class="form"><label>새 프로필 생성 시 자동 태그의 태그 머리<select id="profileTagHead"><option value="">없음</option>${p.data.tagHeads.map(h=>`<option value="${h.id}" ${t.profileTagHeadId===h.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select></label><div class="notice">이 설정은 이후 생성·수정되는 프로필 태그에 적용됩니다.</div></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveProfileTagHead('${tabId}')">저장</button>`)}
async function saveProfileTagHead(tabId){const t=page().tabs.find(x=>x.id===tabId);t.profileTagHeadId=document.getElementById('profileTagHead').value;await saveDB();closeModal();renderBody()}

function backup(){modal('백업 / 복원',`<div class="form"><div class="notice">현재 v2.41 신형 Schema DB만 백업/복원합니다. 구형 DB를 읽거나 변환하지 않습니다.</div><button onclick="exportDB()">JSON 백업 내보내기</button><button onclick="importDB()">JSON 백업 가져오기</button><button class="danger" onclick="resetDB()">현재 DB 초기화</button></div>`,`<button onclick="closeModal()">닫기</button>`)}
function exportDB(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tagmark-v2.41-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importDB(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||!Array.isArray(x.pages))throw new Error('Tagmark 신형 백업 형식이 아닙니다.');db=normalizeDB(x);state.pageId=db.pages[0].id;state.tabId=db.pages[0].tabs[0]?.id||null;await saveDB();closeModal();render();toast('복원이 완료되었습니다.')}catch(e){toast('가져오기 실패: '+e.message)}};i.click()}
async function resetDB(){if(!confirm('현재 로컬 DB를 완전히 초기화할까요?'))return;db=blankDB();state.pageId=db.pages[0].id;state.tabId=db.pages[0].tabs[0].id;state.selected.clear();await saveDB();closeModal();render()}
async function init(){try{await loadDB();render()}catch(e){console.error(e);document.getElementById('app').innerHTML=`<div style="padding:30px"><h2>신형 로컬 DB를 열 수 없습니다.</h2><p>${esc(e.message||e)}</p><p class="muted">IndexedDB가 차단된 비공개 브라우징/콘텐츠 환경인지 확인해 주세요.</p></div>`}}
init();
</script></body></html>
