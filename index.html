function fieldInput(f,v){const i=effectiveInput(f),id=`gf-${f.id}`,val=v??'';if(i==='long_text')return `<textarea id="${id}" data-gfield="${f.id}">${esc(val)}</textarea>`;if(i==='toggle')return `<label class="check"><input id="${id}" data-gfield="${f.id}" type="checkbox" ${val?'checked':''}> 사용</label>`;if(i==='radio')return `<div data-gfield="${f.id}" class="generic-choice">${(f.options||[]).map(o=>`<label><input type="radio" name="${id}" value="${esc(o)}" ${val===o?'checked':''}> ${esc(o)}</label>`).join('')}</div>`;if(i==='checkbox'){const a=Array.isArray(val)?val:[];return `<div data-gfield="${f.id}" class="generic-choice">${(f.options||[]).map(o=>`<label><input type="checkbox" value="${esc(o)}" ${a.includes(o)?'checked':''}> ${esc(o)}</label>`).join('')}</div>`}if(i==='dropdown')return `<select id="${id}" data-gfield="${f.id}"><option value=""></option>${(f.options||[]).map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;if(i==='tag_search'){const allowed=f.allowedTagHeadIds||[],tags=page().data.tags.filter(x=>!allowed.length||allowed.includes(x.tagHeadId)),a=Array.isArray(val)?val:(val?[val]:[]),multi=f.type.endsWith('[]')?' multiple size="5"':'';return `<select id="${id}" data-gfield="${f.id}" data-kind="tag"${multi}><option value=""></option>${tags.map(x=>`<option value="${x.id}" ${a.includes(x.id)?'selected':''}>${esc(fullTagLabel(x.id))}</option>`).join('')}</select>`}if(i==='profile_search'){const a=Array.isArray(val)?val:(val?[val]:[]),multi=f.type.endsWith('[]')?' multiple size="5"':'';return `<select id="${id}" data-gfield="${f.id}" data-kind="profile"${multi}><option value=""></option>${page().data.profiles.map(x=>`<option value="${x.id}" ${a.includes(x.id)?'selected':''}>${esc(x.name||'')}</option>`).join('')}</select>`}if(i==='category_search'){return `<select id="${id}" data-gfield="${f.id}"><option value=""></option>${page().data.categories.map(x=>`<option value="${x.id}" ${val===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`}let typ=i==='datetime'?'datetime-local':(['number','date','url','color'].includes(i)?i:'text');return `<input id="${id}" data-gfield="${f.id}" type="${typ}" value="${esc(val)}">`}
function readGenericField(f){const root=document.querySelector(`[data-gfield="${f.id}"]`);if(!root)return undefined;const i=effectiveInput(f);if(i==='toggle')return !!root.checked;if(i==='radio')return document.querySelector(`input[name="gf-${f.id}"]:checked`)?.value||'';if(i==='checkbox')return [...root.querySelectorAll('input:checked')].map(x=>x.value);if((i==='tag_search'||i==='profile_search')&&f.type.endsWith('[]'))return [...root.selectedOptions].map(x=>x.value).filter(Boolean);if(i==='number')return root.value===''?'':Number(root.value);return root.value}
function bookmarkEditor(t,r){const title=componentField(t,'title'),url=componentField(t,'url'),cat=componentField(t,'category'),chars=componentField(t,'character'),artist=componentField(t,'artist'),series=componentField(t,'series'),language=componentField(t,'language'),tags=componentField(t,'tags'),meta=componentField(t,'meta'),note=componentField(t,'note');editorState={tId:t.id,rId:r.id,chars:clone(r.data?.[chars?.id]||[]),tags:[...(r.data?.[tags?.id]||[])],artist:[...(r.data?.[artist?.id]||[])],series:[...(r.data?.[series?.id]||[])],language:[...(r.data?.[language?.id]||[])],category:r.data?.[cat?.id]||'',metaType:r.data?.[meta?.id]?.kind||'',pages:r.data?.[meta?.id]?.pages||'',duration:r.data?.[meta?.id]?.duration||'00:00:00'};return `<div class="record-editor">${title?`<div class="editor-field"><label>${esc(title.name)}</label><input id="le-title" value="${esc(r.data?.[title.id]||'')}"></div>`:''}${url?`<div class="editor-field"><label>${esc(url.name)}</label><input id="le-url" type="url" value="${esc(r.data?.[url.id]||'')}"></div>`:''}${cat?`<div class="editor-field"><label>${esc(cat.name)}</label><select id="le-cat"><option value="">선택 안 함</option>${page().data.categories.map(c=>`<option value="${c.id}" ${editorState.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div>`:''}${chars?entityInputComponent(chars):''}${artist?tagPickerComponent(artist,'artist') : ''}${series?tagPickerComponent(series,'series'):''}${language?tagPickerComponent(language,'language'):''}${tags?tagPickerComponent(tags,'tags'):''}${meta?metaComponent(meta):''}${note?`<div class="editor-field"><label>${esc(note.name)}</label><textarea id="le-note">${esc(r.data?.[note.id]||'')}</textarea></div>`:''}${(()=>{const used=new Set([title,url,cat,chars,artist,series,language,tags,meta,note].filter(Boolean).map(f=>f.id));return t.schema.filter(f=>f.visible!==false&&!used.has(f.id)).map(f=>`<div class="editor-field"><label>${esc(f.name)}</label>${fieldInput(f,r.data?.[f. function entityRow(c,i){c=c||{};const p=c.profileId?page().data.profiles.find(x=>x.id===c.profileId):null;const pname=p?.name||c.name||'';return `<div class="entity-row" data-ci="${i}"><input type="checkbox" class="le-char-check"><div class="entity-main"><div class="char-composite"><input class="le-char-name" value="${esc(pname)}" placeholder="태그/프로필 검색 또는 이름 입력" autocomplete="off"><div class="tag-suggest le-char-suggest"></div></div><select class="le-char-gender"><option value="unknown" ${c.gender==='unknown'?'selected':''}>Unknown</option><option value="female" ${c.gender==='female'?'selected':''}>Female</option><option value="male" ${c.gender==='male'?'selected':''}>Male</option><option value="both" ${c.gender==='both'?'selected':''}>Both</option></select><button type="button" onclick="removeEntityRow(${i})">×</button><div class="entity-tags">${(c.tags||[]).filter(x=>x!==c.profileTagId).map(tagChip).join('')}</div><div class="char-composite entity-tag-picker"><input class="le-char-tag" placeholder="작품 내 태그 검색" autocomplete="off"><div class="tag-suggest entity-tag-suggest"></div></div></div></div>`}
function initBookmarkEditor(t,r){const root=document.getElementById('modal');['artist','series','language','tags'].forEach(k=>{const inp=document.getElementById('le-'+k);if(!inp)return;inp.oninput=()=>tagPickerSuggest(k,inp.value);inp.onfocus=()=>tagPickerSuggest(k,inp.value);});root?.querySelectorAll('.le-char-name').forEach(e=>{const show=()=>characterSuggest(e,t);e.oninput=()=>{const i=+e.closest('[data-ci]').dataset.ci;editorState.chars[i].name=e.value;show()};e.onfocus=show});root?.querySelectorAll('.le-char-gender').forEach(e=>e.onchange=()=>{const i=+e.closest('[data-ci]').dataset.ci;editorState.chars[i].gender=e.value;renderEntityRows()});root?.querySelectorAll('.le-char-tag').forEach(e=>{const show=()=>entityTagSuggest(e,t);e.oninput=show;e.onfocus=show;e.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();const first=e.parentElement.querySelector('.entity-tag-suggest button');if(first)return first.click();const i=+e.closest('[data-ci]').dataset.ci,v=e.value.trim();if(v){editorState.chars[i].tags=[...(editorState.chars[i].tags||[]),tagIdByName(v)];e.value='';renderEntityRows()}}}});}

function characterSuggest(inp,t){const row=inp.closest('[data-ci]'),i=+row.dataset.ci,box=row.querySelector('.le-char-suggest'),f=componentField(t,'character'),allowed=f?.allowedTagHeadIds||[],q=inp.value.trim().toLowerCase();let tags=page().data.tags.filter(x=>(!allowed.length||allowed.includes(x.tagHeadId))&&(!q||fullTagLabel(x.id).toLowerCase().includes(q))).slice(0,15);box.innerHTML=tags.map(x=>`<button type="button" onclick="chooseCharacterTag(${i},'${x.id}')">${esc(fullTagLabel(x.id))}${x.profileId?' · 프로필':''}</button>`).join('')+(inp.value.trim()?`<button type="button" onclick="createCharacterTag(${i})">＋ "${esc(inp.value.trim())}" 등록</button>`:'');box.classList.toggle('open',!!box.innerHTML)}

function createCharacterTag(i){const t=page().tabs.find(x=>x.id===editorState.tId),f=componentField(t,'character'),allowed=f?.allowedTagHeadIds||[],c=editorState.chars[i],name=c?.name?.trim();if(!name)return;let tag=page().data.tags.find(x=>x.name.toLowerCase()===name.toLowerCase()&&(!allowed.length||allowed.includes(x.tagHeadId)));if(!tag){tag={id:uid(),name,tagHeadId:allowed[0]||'',color:'#6b7280'};page().data.tags.push(tag)}chooseCharacterTag(i,tag.id)}
function entityAllowedHeads(t,c){const f=componentField(t,'character'),base=[...(f?.allowedTagHeadIds||[])],g=f?.genderTagHeads||{},extra=[...(g[c?.gender]||[])];return [...new Set([...base,...extra])]}
function entityTagSuggest(inp,t){const row=inp.closest('[data-ci]'),i=+row.dataset.ci,c=editorState.chars[i],box=row.querySelector('.entity-tag-suggest'),allowed=entityAllowedHeads(t,c),q=inp.value.trim().toLowerCase(),selected=new Set(c.tags||[]);let tags=page().data.tags.filter(x=>(!allowed.length||allowed.includes(x.tagHeadId))&&!selected.has(x.id)&&(!q||fullTagLabel(x.id).toLowerCase().includes(q))).slice(0,15);box.innerHTML=tags.map(x=>`<button type="button" onclick="addEntityTag(${i},'${x.id}')">${esc(fullTagLabel(x.id))}</button>`).join('');box.classList.toggle('open',!!box.innerHTML)}

function tagPickerSuggest(kind,q){

function saveBookmark(tabId,id,editing){const t=page().tabs.find(x=>x.id===tabId),arr=recordArray(t),r=editing?arr.find(x=>x.id===id):{id,data:{}};const set=(component,val)=>{const f=componentField(t,component);if(f)r.data[f.id]=val};const title=componentField(t,'title'),url=componentField(t,'url'),cat=componentField(t,'category'),note=componentField(t,'note'),meta=componentField(t,'meta');if(title)set('title',document.getElementById('le-title')?.value.trim()||'');if(url){const u=document.getElementById('le-url')?.value.trim()||'';if(!u||!/^https?:\/\//i.test(u))return toast('http(s) URL 필요');set('url',u)}if(cat)set('category',document.getElementById('le-cat')?.value||'');set('character',clone(editorState.chars));set('artist',editorState.artist||[]);set('series',editorState.series||[]);set('language',editorState.language||[]);set('tags',editorState.tags||[]);if(meta){const dur=durationFromInputs();set('meta',{pages:document.getElementById('le-pages')?.value||'',duration:dur==='00:00:00'?'':dur});}if(note)set('note',document.getElementById('le-note')?.value||'');const usedIds=new Set(['title','url','category','character','artist','series','language','tags','meta','note'].map(c=>componentField(t,c)?.id).filter(Boolean));for(const f of t.schema){if(usedIds.has(f.id))continue;const gv=readGenericField(f);if(gv!==undefined)r.data[f.id]=gv}for(const f of t.schema){if(f.required&&(r.data[f.id]===undefined||r.data[f.id]===''||(Array.isArray(r.data[f.id])&&!r.data[f.id].length)))return toast(`필수 항목을 입력하세요: ${f.name}`)}if(!editing)arr.push(r);saveDB().then(()=>{closeModal();renderBody()})}
async function cloneRecord(tabId,id){const t=page().tabs.find(x=>x.id===tabId),arr=recordArray(t),src=arr.find(x=>x.id===id);if(!src)return;const cp=clone(src);cp.id=uid();const tf=t.schema.find(f=>f.id===t.titleField)||t.schema.find(f=>inferComponent(f)==='title');if(tf)cp.data[tf.id]=String(cp.data[tf.id]||'')+' - 의 사본';arr.push(cp);await saveDB();renderBody()}

let _renderCache=null;
function recordTagIds(r,t){const out=[];for(const f of (t.schema||[])){const v=r.data?.[f.id];if(f.type==='tag'&&v)out.push(v);if(f.type==='tag[]'&&Array.isArray(v))out.push(...v);if(String(f.type||'').startsWith('character')&&Array.isArray(v))for(const c of v)out.push(...(c.tags||[]),...(c.profileTagId?[c.profileTagId]:[]))}return [...new Set(out)]}
function buildRenderCache(){const p=page();const tagMap=new Map(p.data.tags.map(x=>[x.id,x])),headMap=new Map(p.data.tagHeads.map(x=>[x.id,x])),profileMap=new Map(p.data.profiles.map(x=>[x.id,x])),usage=new Map();const btabs=p.tabs.filter(t=>t.type==='bookmark');for(const r of p.data.bookmarks){const ids=new Set();for(const t of btabs)for(const id of recordTagIds(r,t))ids.add(id);for(const id of ids)usage.set(id,(usage.get(id)||0)+1)}for(const pr of p.data.profiles){const ids=new Set();for(const v of Object.values(pr.data||{})){if(Array.isArray(v))for(const id of v)if(tagMap.has(id))ids.add(id);else if(tagMap.has(v))ids.add(v)}for(const id of ids)usage.set(id,(usage.get(id)||0)+1)}_renderCache={tagMap,headMap,profileMap,usage};}
function rc(){if(!_renderCache)buildRenderCache();return _renderCache}
function fullTagLabel(id){const x=rc().tagMap.get(id);if(!x)return '';const h=rc().headMap.get(x.tagHeadId),hn=String(h?.name||'');const prefix=hn&&!/[:：\s]$/.test(hn)?hn+':':hn;return `${prefix}${x.name}`;}

function cycleTagFilter(id){if(state.tagInclude.has(id)){state.tagInclude.delete(id);state.tagExclude.add(id)}else if(state.tagExclude.has(id))state.tagExclude.delete(id);else state.tagInclude.add(id);renderBody()}
function tagView(t){const p=page(),q=(state.tabSearch[t.id]??t.searchText??'').trim().toLowerCase();state.search=q;let tags=p.data.tags.filter(x=>!q||x.name.toLowerCase().includes(q));const visible=(t.visibleTagHeadIds||[]);const heads=visible.length?p.data.tagHeads.filter(h=>visible.includes(h.id)):p.data.tagHeads;return `<div class="tab-sticky-tools">${toolbar(t,false)}<div class="tag-legend">태그를 누르면 포함 → 제외 → 해제 순서로 필터 상태가 바뀝니다. 프로필 태그는 여기서 수정·삭제하지 않습니다.</div><div class="actions tag-top-actions"><button class="primary" onclick="newTagHead()">＋ 태그 머리</button><button onclick="newTag()">＋ 태그</button><span class="action-spacer"></span><button onclick="tagHeadDisplaySettings('${t.id}')">표시할 태그 머리</button><button onclick="tagHeadManager()">태그 머리 수정</button></div></div><div class="tag-folders">${heads.map(h=>{const rows=tags.filter(x=>x.tagHeadId===h.id).sort((a,b)=>a.name.localeCompare(b.name,'ko'));return `<details class="tag-folder" open><summary><span style="color:${esc(h.color||'#4b5563')}">${esc(h.name)}</span><span class="meta">${rows.length}개</span></summary><div class="tag-folder-body">${rows.map(x=>{const c=h.color||'#4b5563',cls=state.tagInclude.has(x.id)?'include':state.tagExclude.has(x.id)?'exclude':'';return `<div class="reg-row searchable-item" data-search="${esc(fullTagLabel(x.id))}"><button class="tb ${cls}" style="color:${esc(c)}" onclick="cycleTagFilter('${x.id}')">${esc(fullTagLabel(x.id))} <span class="cnt">${tagUsageCount(x.id)}</span></button><span style="margin-left:auto"></span>${x.profileId?'<span class="meta">프로필</span>':`<button class="btn sm" onclick="editTag('${x.id}')">수정</button><button class="btn sm danger" onclick="deleteTag('${x.id}')">삭제</button>`}</div>`}).join('')||'<div class="empty" style="padding:8px">등록 없음</div>'}</div></details>`}).join('')||'<div class="empty">표시할 태그 머리가 없습니다.</div>'}</div>`}
function profileView(t){const p=page(),q=(state.tabSearch[t.id]??t.searchText??'').trim().toLowerCase();state.search=q;let arr=p.data.profiles.filter(x=>!q||searchText(x.data).includes(q)||String(x.name||'').toLowerCase().includes(q));const cfg=t.profileGroup||{mode:'none',fieldId:'',tagId:''},groups=new Map();const add=(k,x)=>{if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)};if(cfg.mode==='manual'){for(const x of arr){const f=p.data.profileFolders.find(f=>f.id===x.folderId);add(f?.name||'폴더 없음',x)}}else if(cfg.mode==='field'&&cfg.fieldId){const f=t.schema.find(x=>x.id===cfg.fieldId);for(const x of arr){const v=x.data?.[cfg.fieldId];if(Array.isArray(v)&&v.length)v.forEach(id=>add(resolveRef(id,f?.type?.replace('[]','')||'tag'),x));else if(v)add(resolveRef(v,f?.type||'tag'),x);else add('기타',x)}}else if(cfg.mode==='tag'&&cfg.tagId){for(const x of arr)add(profileHasTag(x,cfg.tagId)?(page().data.tags.find(z=>z.id===cfg.tagId)?.name||'해당 태그'):'기타',x)}else groups.set('전체',arr);return `<div class="tab-sticky-tools">${toolbar(t,false)}<div class="actions"><button class="primary" onclick="newProfile()">＋ 프로필</button><button onclick="schemaEditor('${t.id}')">필드 편집</button><button onclick="profileTagHeadSettings('${t.id}')">프로필 태그 머리</button><button onclick="profileGroupSettings('${t.id}')">그룹/폴더 설정</button>${cfg.mode==='manual'?'<button onclick="profileFolderManager()">폴더 관리</button>':''}</div><div class="profile-group-note">그룹 기준: ${esc(profileGroupLabel(t))}</div></div>${[...groups].map(([g,rows])=>{const key=btoa(unescape(encodeURIComponent(g))).replace(/=/g,'');const open=t.profileFolderOpen?.[key]!==false;return `<details class="profile-folder" ${open?'open':''} ontoggle="saveProfileFolderOpen('${key}',this.open)"><summary><span>📁 ${esc(g)}</span><span class="meta">${rows.length}개</span></summary><div class="profile-folder-body">${rows.map(x=>profileCard(x,t)).join('')}</div></details>`}).join('')||'<div class="empty">프로필이 없습니다.</div>'}`}
function profileHasTag(x,id){return Object.values(x.data||{}).some(v=>v===id||(Array.isArray(v)&&v.includes(id)))}
function profileGroupLabel(t){const c=t.profileGroup||{};if(c.mode==='manual')return '수동 폴더';if(c.mode==='field')return '항목: '+(t.schema.find(f=>f.id===c.fieldId)?.name||'선택 안 함');if(c.mode==='tag')return '태그: '+(page().data.tags.find(x=>x.id===c.tagId)?.name||'선택 안 함');return '없음'}
function saveProfileFolderOpen(k,open){const t=currentTab();t.profileFolderOpen ||= {};t.profileFolderOpen[k]=open;saveDB()}
function profileGroupSettings(tabId){const t=page().tabs.find(x=>x.id===tabId),c=t.profileGroup||{};modal('프로필 그룹/폴더 설정',`<div class="form"><label>그룹 방식<select id="pgMode" onchange="document.getElementById('pgFieldWrap').hidden=this.value!=='field';document.getElementById('pgTagWrap').hidden=this.value!=='tag'"><option value="none" ${c.mode==='none'?'selected':''}>그룹 없음</option><option value="field" ${c.mode==='field'?'selected':''}>항목 값을 기준으로 자동 그룹</option><option value="tag" ${c.mode==='tag'?'selected':''}>특정 태그 포함 여부로 그룹</option><option value="manual" ${c.mode==='manual'?'selected':''}>수동 폴더</option></select></label><label id="pgFieldWrap" ${c.mode!=='field'?'hidden':''}>기준 항목<select id="pgField">${t.schema.filter(f=>f.visible!==false).map(f=>`<option value="${f.id}" ${c.fieldId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><label id="pgTagWrap" ${c.mode!=='tag'?'hidden':''}>기준 태그<select id="pgTag">${page().data.tags.map(x=>`<option value="${x.id}" ${c.tagId===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><div class="notice">자동 그룹은 현재 프로필 데이터에 따라 즉시 재구성됩니다. 수동 폴더는 프로필 자체의 folderId로 저장되어 새로고침 후에도 유지됩니다.</div></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveProfileGroup('${tabId}')">저장</button>`)}
function saveProfileGroup(tabId){const t=page().tabs.find(x=>x.id===tabId);t.profileGroup={mode:document.getElementById('pgMode').value,fieldId:document.getElementById('pgField')?.value||'',tagId:document.getElementById('pgTag')?.value||''};saveDB().then(()=>{closeModal();renderBody()})}
function profileFolderManager(){const p=page();modal('프로필 수동 폴더',`<div class="form"><button class="primary" onclick="newProfileFolder()">＋ 새 폴더</button><div class="list-box">${p.data.profileFolders.map(f=>`<div class="reg-row"><b>${esc(f.name)}</b><span style="margin-left:auto"></span><button onclick="renameProfileFolder('${f.id}')">수정</button><button class="danger" onclick="deleteProfileFolder('${f.id}')">삭제</button></div>`).join('')}</div><label>프로필<select id="pfProfile">${p.data.profiles.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><label>배치할 폴더<select id="pfFolder"><option value="">폴더 해제</option>${p.data.profileFolders.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('')}</select></label><button onclick="assignProfileFolder()">프로필 배치/해제</button></div>`,`<button onclick="closeModal()">닫기</button>`)}
function newProfileFolder(){const n=prompt('폴더 이름');if(!n?.trim())return;page().data.profileFolders.push({id:uid(),name:n.trim()});saveDB().then(()=>profileFolderManager())}
function renameProfileFolder(id){const f=page().data.profileFolders.find(x=>x.id===id),n=prompt('폴더 이름',f?.name||'');if(!f||!n?.trim())return;f.name=n.trim();saveDB().then(()=>profileFolderManager())}
function deleteProfileFolder(id){if(!confirm('폴더를 삭제할까요? 프로필은 유지됩니다.'))return;page().data.profileFolders=page().data.profileFolders.filter(x=>x.id!==id);page().data.profiles.forEach(x=>{if(x.folderId===id)x.folderId=null});saveDB().then(()=>profileFolderManager())}
function assignProfileFolder(){const pid=document.getElementById('pfProfile').value,fid=document.getElementById('pfFolder').value,x=page().data.profiles.find(x=>x.id===pid);if(x)x.folderId=fid||null;saveDB().then(()=>{closeModal();renderBody()})}

function profileCard(x,t){const nameField=t.schema.find(f=>inferComponent(f)==='profile_title')||t.schema.find(f=>f.name==='이름')||t.schema[0],genderF=t.schema.find(f=>inferComponent(f)==='gender'),name=x.data?.[nameField?.id]||x.name||'프로필',gender=x.data?.[genderF?.id]||'unknown';return `<article class="profile-card"><div class="profile-card-title gender-${esc(gender)}">${esc(name)}</div>${t.schema.filter(f=>f.visible!==false&&f.id!==nameField?.id&&f.id!==genderF?.id&&inferComponent(f)!=='profile_tag').map(f=>{const v=fieldDisplay(x.data?.[f.id],f);return v?`<div class="profile-card-line"><span class="profile-label">${esc(f.name)}</span><span class="profile-value">${v}</span></div>`:''}).join('')}<div class="profile-card-actions"><button onclick="editProfile('${x.id}')">수정</button><button class="danger" onclick="deleteProfile('${x.id}')">삭제</button></div></article>`}
function profileFieldSchema(t){return t.schema}
function newProfile(){openProfileModal(null)}function editProfile(id){openProfileModal(id)}
function openProfileModal(id){const p=page(),t=p.tabs.find(x=>x.type==='profile'),x=id?p.data.profiles.find(x=>x.id===id):{id:uid(),data:{}};if(!t)return toast('프로필 탭이 없습니다.');modal(id?'프로필 편집':'프로필 등록',profileEditor(t,x),`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveProfile('${x.id}',${!!id})">저장</button>`);initProfileEditor(t,x)}
function profileEditor(t,x){return `<div class="record-editor profile-editor">${t.schema.filter(f=>f.visible!==false&&inferComponent(f)!=='profile_tag').map(f=>profileField(f,x.data?.[f.id])).join('')}</div>`}
function profileField(f,v){const c=inferComponent(f);if(c==='profile_title')return `<div class="editor-field"><label>${esc(f.name)}</label><input data-pfield="${f.id}" value="${esc(v||'')}"></div>`;if(c==='gender')return `<div class="editor-field"><label>${esc(f.name)}</label><div class="meta-input">${(f.options||['male','female','both','unknown']).map(o=>`<label><input type="radio" name="lp-gender" value="${o}" ${(v||'male')===o?'checked':''}> ${o}</label>`).join('')}</div></div>`;if(effectiveInput(f)==='tag_search'){const ids=Array.isArray(v)?v:(v?[v]:[]);return `<div class="editor-field profile-tag-picker"><label>${esc(f.name)}</label><div class="tag-selected lp-selected" data-for="${f.id}">${ids.map(id=>profileTagChip(f.id,id)).join('')}</div><input data-pfield="${f.id}" class="lp-tag" autocomplete="off" placeholder="태그 검색 또는 등록"><div class="tag-suggest lp-suggest" data-for="${f.id}"></div></div>`}if(f.type==='long_text'||f.type==='markdown')return `<div class="editor-field"><label>${esc(f.name)}</label><textarea data-pfield="${f.id}">${esc(v||'')}</textarea></div>`;return `<div class="editor-field"><label>${esc(f.name)}</label>${fieldInput(f,v)}</div>`}
function profileTagChip(fid,id){const x=rc().tagMap.get(id);if(!x)return '';const h=rc().headMap.get(x.tagHeadId),c=h?.color||'#4b5563';return `<span class="tag-chip" data-tag-id="${id}" style="--tag-color:${esc(c)}">${esc(fullTagLabel(id))} <button type="button" onclick="this.parentElement.remove()">×</button></span>`}
function initProfileEditor(t,x){document.querySelectorAll('.lp-tag').forEach(e=>{const f=t.schema.find(f=>f.id===e.dataset.pfield),box=document.querySelector(`.lp-suggest[data-for="${f.id}"]`);const show=()=>{const q=e.value.trim().toLowerCase(),allowed=f.allowedTagHeadIds||[];const tags=page().data.tags.filter(z=>(!allowed.length||allowed.includes(z.tagHeadId))&&(!q||fullTagLabel(z.id).toLowerCase().includes(q))).slice(0,15);box.innerHTML=tags.map(z=>`<button type="button" onclick="addProfileFieldTag('${f.id}','${z.id}')">${esc(fullTagLabel(z.id))}</button>`).join('')+(e.value.trim()?`<button type="button" onclick="createProfileFieldTag('${f.id}')">＋ "${esc(e.value.trim())}" 등록</button>`:'');box.classList.toggle('open',!!box.innerHTML)};e.oninput=show;e.onfocus=show;e.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();const first=box.querySelector('button');if(first)first.click()}}})}
function addProfileFieldTag(fid,id){const box=document.querySelector(`.lp-selected[data-for="${fid}"]`);if(!box||box.querySelector(`[data-tag-id="${id}"]`))return;box.insertAdjacentHTML('beforeend',profileTagChip(fid,id));const inp=document.querySelector(`.lp-tag[data-pfield="${fid}"]`);if(inp)inp.value='';document.querySelector(`.lp-suggest[data-for="${fid}"]`)?.classList.remove('open')}
function createProfileFieldTag(fid){const t=page().tabs.find(x=>x.type==='profile'),f=t.schema.find(x=>x.id===fid),inp=document.querySelector(`.lp-tag[data-pfield="${fid}"]`),name=inp?.value.trim();if(!name)return;const allowed=f.allowedTagHeadIds||[];let tag=page().data.tags.find(x=>x.name.toLowerCase()===name.toLowerCase()&&(!allowed.length||allowed.includes(x.tagHeadId)));if(!tag){tag={id:uid(),name,tagHeadId:allowed[0]||'',color:'#6b7280'};page().data.tags.push(tag)}addProfileFieldTag(fid,tag.id)}

async function saveProfile(id,editing){const p=page(),t=p.tabs.find(x=>x.type==='profile');const data={};for(const f of t.schema){if(f.component==='profile_tag')continue;const c=inferComponent(f);if(c==='gender')data[f.id]=document.querySelector('input[name="lp-gender"]:checked')?.value||'unknown';else if(effectiveInput(f)==='tag_search'){const box=document.querySelector(`.lp-selected[data-for="${f.id}"]`),ids=[...(box?.querySelectorAll('[data-tag-id]')||[])].map(x=>x.dataset.tagId);data[f.id]=f.type.endsWith('[]')?ids:(ids[0]||'');}else{const e=document.querySelector(`[data-pfield="${f.id}"]`);if(e)data[f.id]=e.value;else{const gv=readGenericField(f);if(gv!==undefined)data[f.id]=gv}}}const nf=t.schema.find(f=>inferComponent(f)==='profile_title')||t.schema[0];if(nf&&(!data[nf.id]||!String(data[nf.id]).trim()))return toast('프로필 이름을 입력하세요.');let x=editing?p.data.profiles.find(x=>x.id===id):{id,data:{}};x.data=data;x.name=String(data[nf.id]).trim();if(!editing)p.data.profiles.push(x);syncProfileTag(x);await saveDB();closeModal();renderBody()}
function syncProfileTag(profile){const p=page(),existing=p.data.tags.find(t=>t.profileId===profile.id),pt=p.tabs.find(t=>t.type==='profile'),head=pt?.profileTagHeadId||'';const name=profile.name;if(existing){existing.name=name;if(head)existing.tagHeadId=head}else p.data.tags.push({id:uid(),name,profileId:profile.id,tagHeadId:head,color:'#7c5cff'})}
async function deleteProfile(id){if(!confirm('프로필을 삭제할까요?'))return;const p=page();p.data.profiles=p.data.profiles.filter(x=>x.id!==id);p.data.tags=p.data.tags.filter(x=>x.profileId!==id);await saveDB();renderBody()}
function categoryView(t){const p=page();return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newCategory()">＋ 카테고리</button></div><div class="entity-grid">${p.data.categories.map(x=>`<article class="entity-card"><div class="card-actions"><button onclick="editCategory('${x.id}')">✎</button><button class="danger" onclick="deleteCategory('${x.id}')">×</button></div><h3>${esc(x.name)}</h3><div class="subtle">${esc(x.description||'')}</div></article>`).join('')||'<div class="empty">카테고리가 없습니다.</div>'}</div>`}
function newCategory(){modal('새 카테고리',`<div class="form"><label>이름<input id="catName"></label><label>설명<textarea id="catDesc"></textarea></label><label>상위 카테고리<select id="catParent"><option value="">없음</option>${page().data.categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveCategory()">추가</button>`)}
function editCategory(id){const x=page().data.categories.find(x=>x.id===id);modal('카테고리 편집',`<div class="form"><label>이름<input id="catName" value="${esc(x.name)}"></label><label>설명<textarea id="catDesc">${esc(x.description||'')}</textarea></label><label>상위 카테고리<select id="catParent"><option value="">없음</option>${page().data.categories.filter(c=>c.id!==id).map(c=>`<option value="${c.id}" ${x.parentId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>`,`<button class="danger" onclick="deleteCategory('${id}')">삭제</button><button onclick="closeModal()">취소</button><button class="primary" onclick="saveCategory('${id}')">저장</button>`)}
async function saveCategory(id){const p=page(),x=id?p.data.categories.find(x=>x.id===id):{id:uid()};x.name=document.getElementById('catName').value.trim();x.description=document.getElementById('catDesc').value;x.parentId=document.getElementById('catParent').value;if(!x.name)return toast('이름을 입력하세요.');if(!id)p.data.categories.push(x);await saveDB();closeModal();renderBody()}
async function deleteCategory(id){if(!confirm('카테고리를 삭제할까요? 연결된 필드의 참조도 제거됩니다.'))return;const p=page();p.data.categories=p.data.categories.filter(x=>x.id!==id);for(const t of p.tabs)for(const r of p.data.bookmarks)for(const f of t.schema.filter(f=>f.type==='category'||f.type==='category[]')){const v=r.data[f.id];if(Array.isArray(v))r.data[f.id]=v.filter(x=>x!==id);else if(v===id)r.data[f.id]=''}await saveDB();closeModal();renderBody()}
function folderView(t){const p=page();return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newFolder()">＋ 폴더</button></div>${p.data.folders.map(f=>{const n=p.data.bookmarks.filter(r=>Object.values(r.data||{}).some(v=>v===f.id||(Array.isArray(v)&&v.includes(f.id)))).length;return `<div class="folder-box"><div class="folder-head"><div><b>📁 ${esc(f.name)}</b><div class="subtle">${n}개 북마크</div></div><div><button onclick="editFolder('${f.id}')">✎</button><button class="danger" onclick="deleteFolder('${f.id}')">삭제</button></div></div><div class="subtle">${esc(f.description||'')}</div></div>`}).join('')||'<div class="empty">폴더가 없습니다.</div>'}`}
function newFolder(){openFolderModal(null)}function editFolder(id){openFolderModal(id)}
function toggleBookmarkFolder(id,btn){const t=currentTab();if(!t)return;t.bookmarkFolderOpen||={};const body=document.querySelector(`[data-folder-body="${id}"]`),open=body?.classList.contains('collapsed');t.bookmarkFolderOpen[id]=!!open;if(body)body.classList.toggle('collapsed',!open);if(btn){const f=page().data.folders.find(x=>x.id===id);btn.textContent=`${open?'▼':'▶'} ${f?.name||f?.title||'폴더'}`}saveDB()}
function bookmarkFolderManager(editId=''){const p=page(),bookmarks=p.data.bookmarks||[],f=p.data.folders.find(x=>x.id===editId);modal(f?'북마크 폴더 수정':'북마크 폴더 관리',`<div class="form">${f?`<label>폴더 이름<input id="bmFolderName" value="${esc(f.name||f.title||'')}"></label><div class="actions"><button class="primary" onclick="renameBookmarkFolder('${f.id}')">이름 저장</button><button class="danger" onclick="removeBookmarkFolder('${f.id}')">폴더 삭제</button></div>`:`<button class="primary" onclick="newFolder()">＋ 새 폴더</button><div class="list-box">${p.data.folders.map(z=>`<div class="reg-row"><b>📁 ${esc(z.name||z.title||'폴더')}</b><span class="subtle">${bookmarks.filter(r=>r.folderId===z.id).length}개</span><span style="margin-left:auto"></span><button onclick="bookmarkFolderManager('${z.id}')">수정</button></div>`).join('')||'<div class="subtle">폴더가 없습니다.</div>'}</div><label>북마크<select id="bmAssignRecord"><option value="">선택</option>${bookmarks.map(r=>{const t=currentTab(),tf=t?.schema.find(x=>inferComponent(x)==='title')||t?.schema[0];return `<option value="${r.id}">${esc(r.data?.[tf?.id]||'기록')}</option>`}).join('')}</select></label><label>배치할 폴더<select id="bmAssignFolder"><option value="">폴더 해제</option>${p.data.folders.map(z=>`<option value="${z.id}">${esc(z.name||z.title||'폴더')}</option>`).join('')}</select></label><button onclick="assignOneBookmarkFolder()">배치 / 해제</button>`}</div>`,`<button onclick="closeModal()">닫기</button>`)}

function openTabModal(id){const p=page(),x=id?p.tabs.find(t=>t.id===id):{id:uid(),name:'새 탭',type:'custom',layout:'grid',sort:'asc',search:true,schema:[]};const types=[['bookmark','북마크'],['tag','태그'],['profile','프로필'],['category','카테고리'],['folder','폴더'],['custom','사용자 정의']];modal(id?'탭 설정':'새 탭',`<div class="form"><label>탭 이름<input id="tabName" value="${esc(x.name)}"></label><label>탭 유형<select id="tabType" ${id?'disabled':''}>${types.map(([v,n])=>`<option value="${v}" ${x.type===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="check"><input id="tabSearch" type="checkbox" ${x.search!==false?'checked':''}> 검색 사용</label><label class="check"><input id="tabGrid" type="checkbox" ${x.layout==='grid'?'checked':''}> 그리드 기본</label><div class="notice">같은 유형의 탭은 여러 개 만들 수 있습니다. 단, 북마크 탭은 Page당 하나만 만들 수 있습니다.</div></div>`,`<button class="danger" onclick="deleteTab('${x.id}')" ${id?'':'style="display:none"'}>탭 삭제</button><button onclick="closeModal()">취소</button><button class="primary" onclick="saveTab('${x.id}',${!!id})">저장</button>`)}

function fieldAdvanced(id){const row=document.querySelector(`#schemaRows .schema-row[data-row="${id}"]`);if(!row)return;let panel=row.querySelector('.field-advanced-inline');if(panel){panel.remove();return}const t=page().tabs.find(x=>x.id===schemaDraftTabId),old=t?.schema.find(f=>f.id===id)||{},input0=row.querySelector('.sf-input').value,input=input0==='auto'?(row.querySelector('.sf-type').value.startsWith('character')?'character':row.querySelector('.sf-type').value.startsWith('tag')?'tag_search':input0):input0,heads=page().data.tagHeads||[],allowed=(row.dataset.allowedHeads?JSON.parse(row.dataset.allowedHeads):old.allowedTagHeadIds)||[],opts=(row.dataset.options?JSON.parse(row.dataset.options):old.options)||[],genderHeads=(row.dataset.genderHeads?JSON.parse(row.dataset.genderHeads):old.genderTagHeads)||{female:[],male:[],both:[]};panel=document.createElement('div');panel.className='field-advanced-inline';panel.style.cssText='grid-column:2/-1;border:1px solid var(--line);border-radius:9px;padding:10px;background:#fafbfe';panel.innerHTML=`${['tag_search','character'].includes(input)?`<b>검색/등록할 태그 머리</b><div class="list-box adv-head-box">${heads.map(h=>`<label class="check"><input class="adv-head" type="checkbox" value="${h.id}" ${allowed.includes(h.id)?'checked':''}> <span style="color:${esc(h.color||'#4b5563')}">${esc(h.name)}</span></label>`).join('')}</div>`:''}${input==='character'?`<div style="margin-top:10px"><b>성별에 따라 추가 검색할 태그 머리</b><div class="grid3">${['female','male','both'].map(g=>`<div><div class="subtle">${g}</div>${heads.map(h=>`<label class="check small"><input class="adv-gender-head" data-gender="${g}" type="checkbox" value="${h.id}" ${(genderHeads[g]||[]).includes(h.id)?'checked':''}> <span style="color:${esc(h.color||'#4b5563')}">${esc(h.name)}</span></label>`).join('')}</div>`).join('')}</div></div>`:''}${['radio','checkbox','dropdown'].includes(input)?`<label><b>선택지</b> (한 줄에 하나)<textarea class="adv-options">${esc(opts.join('\n'))}</textarea></label>`:''}${!['tag_search','character'].includes(input)&&!['radio','checkbox','dropdown'].includes(input)?'<span class="subtle">이 입력 방식에는 추가 설정이 없습니다.</span>':''}`;row.appendChild(panel);panel.addEventListener('change',()=>captureInlineAdvanced(row));panel.addEventListener('input',()=>captureInlineAdvanced(row));}
function captureInlineAdvanced(row){const heads=[...row.querySelectorAll('.adv-head:checked')].map(x=>x.value);if(row.querySelector('.adv-head-box'))row.dataset.allowedHeads=JSON.stringify(heads);const gh={female:[],male:[],both:[]};row.querySelectorAll('.adv-gender-head:checked').forEach(x=>gh[x.dataset.gender].push(x.value));if(row.querySelector('.adv-gender-head'))row.dataset.genderHeads=JSON.stringify(gh);const ta=row.querySelector('.adv-options');if(ta)row.dataset.options=JSON.stringify(ta.value.split(/\n/).map(x=>x.trim()).filter(Boolean));renderSchemaPreview()}

function saveFieldAdvanced(id){const t=page().tabs.find(x=>x.id===schemaDraftTabId),f=t?.schema.find(x=>x.id===id);if(!f)return closeModal();if(window._advField?.input==='tag_search')f.allowedTagHeadIds=[...document.querySelectorAll('.adv-head:checked')].map(x=>x.value);if(['radio','checkbox','dropdown'].includes(window._advField?.input)){f.options=(document.getElementById('advOptions')?.value||'').split(/\n/).map(x=>x.trim()).filter(Boolean)}closeModal();renderSchemaPreview()}
function addSchemaRow(){const root=document.getElementById('schemaRows');root.insertAdjacentHTML('beforeend',schemaRow(field('새 필드','text')));delete root.dataset.dragReady;bindSchemaPreview();initSchemaDrag();renderSchemaPreview()}
function readSchemaRows(tabId){const t=page().tabs.find(x=>x.id===tabId);return [...document.querySelectorAll('#schemaRows .schema-row')].map(row=>{const old=clone(t.schema.find(f=>f.id===row.dataset.row)||field('새 필드','text'));old.id=row.dataset.row;old.name=row.querySelector('.sf-name').value.trim()||'필드';old.type=row.querySelector('.sf-type').value;old.inputType=row.querySelector('.sf-input').value;old.displayType=row.querySelector('.sf-display').value;old.component=row.querySelector('.sf-component').value;old.required=row.querySelector('.sf-req').checked;old.visible=row.querySelector('.sf-vis').checked;if(row.dataset.allowedHeads)old.allowedTagHeadIds=JSON.parse(row.dataset.allowedHeads);if(row.dataset.options)old.options=JSON.parse(row.dataset.options);if(row.dataset.genderHeads)old.genderTagHeads=JSON.parse(row.dataset.genderHeads);return old})}
async function saveSchema(tabId){const t=page().tabs.find(x=>x.id===tabId);t.schema=readSchemaRows(tabId);if(!t.schema.length)return toast('최소 한 개의 필드가 필요합니다.');if(!t.schema.find(f=>f.required))t.schema[0].required=true;await saveDB();closeModal();renderBody()}
function bindSchemaPreview(){document.querySelectorAll('#schemaRows input,#schemaRows select').forEach(e=>{e.oninput=renderSchemaPreview;e.onchange=renderSchemaPreview})}
function previewControl(f){const ph=esc(f.name);const inp=f.inputType==='auto'?(f.type==='long_text'?'long_text':f.type==='tag[]'?'tag_search':f.type==='character[]'?'character':f.type):f.inputType;if(inp==='long_text')return `<textarea placeholder="${ph}"></textarea>`;if(inp==='toggle')return `<label class="check"><input type="checkbox"> 사용</label>`;if(['radio','checkbox'].includes(inp)){const os=f.options?.length?f.options:['선택 A','선택 B'];return `<div class="preview-choices">${os.map(o=>`<label><input type="${inp}" ${inp==='radio'?`name="pv-${f.id}"`:''}> ${esc(o)}</label>`).join('')}</div>`;}if(inp==='dropdown'){const os=f.options?.length?f.options:['샘플 항목'];return `<select><option value="">${ph} 선택</option>${os.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;}if(['category_search','folder_search','profile_search'].includes(inp))return `<select><option>${ph} 선택</option><option>샘플 항목</option></select>`;if(inp==='tag_search')return `<div><input placeholder="태그 검색"><div class="preview-tags"><span>sample</span><span>example</span></div></div>`;if(inp==='character')return `<div class="preview-character"><input placeholder="프로필/이름"><select><option>성별</option><option>여성</option><option>남성</option></select><input placeholder="태그"></div>`;if(inp==='date'||inp==='datetime'||inp==='number'||inp==='url'||inp==='color')return `<input type="${inp==='datetime'?'datetime-local':inp}" placeholder="${ph}">`;return `<input placeholder="${ph}">`}
function renderSchemaPreview(){const box=document.getElementById('schemaLivePreview');if(!box||!schemaDraftTabId)return;const fs=readSchemaRows(schemaDraftTabId).filter(f=>f.visible!==false&&f.displayType!=='hidden');box.innerHTML=`<div class="preview-modal"><div class="preview-modal-title">기록 등록</div>${fs.map(f=>`<div class="preview-field"><label>${esc(f.name)}${f.required?' *':''}</label>${previewControl(f)}<small>${typeLabel(f.type)} · ${esc(f.inputType||'auto')} · ${esc(f.displayType||'auto')}</small></div>`).join('')||'<div class="empty">표시할 필드가 없습니다.</div>'}<div class="preview-footer"><button>취소</button><button class="primary">저장</button></div></div>`}
function enablePointerReorder(root,itemSelector,handleSelector,axis='y',onDone=()=>{}){root.querySelectorAll(handleSelector).forEach(h=>{h.onpointerdown=e=>{if(e.pointerType==='mouse')return;const item=h.closest(itemSelector);if(!item)return;e.preventDefault();h.setPointerCapture?.(e.pointerId);item.classList.add('dragging');const move=ev=>{const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest(itemSelector);if(!target||target===item||target.parentElement!==root)return;const r=target.getBoundingClientRect(),before=axis==='x'?ev.clientX<r.left+r.width/2:ev.clientY<r.top+r.height/2;root.insertBefore(item,before?target:target.nextSibling)};const up=()=>{item.classList.remove('dragging');h.removeEventListener('pointermove',move);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);onDone()};h.addEventListener('pointermove',move);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)}})}
function initSchemaDrag(){const root=document.getElementById('schemaRows');if(!root||root.dataset.dragReady)return;root.dataset.dragReady='1';let item=null,pid=null;const move=e=>{if(!item||e.pointerId!==pid)return;e.preventDefault();const rows=[...root.querySelectorAll('.schema-editor-row:not(.dragging)')];const after=rows.find(r=>e.clientY<r.getBoundingClientRect().top+r.getBoundingClientRect().height/2);after?root.insertBefore(item,after):root.appendChild(item)};const endDrag=e=>{if(!item||e.pointerId!==pid)return;item.classList.remove('dragging');item=null;pid=null;document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',endDrag);document.removeEventListener('pointercancel',endDrag);renderSchemaPreview()};root.querySelectorAll('.drag-handle').forEach(h=>{h.onpointerdown=e=>{item=h.closest('.schema-editor-row');pid=e.pointerId;item.classList.add('dragging');h.setPointerCapture?.(pid);document.addEventListener('pointermove',move,{passive:false});document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);e.preventDefault()}})}
function pageSchemaEditor(kind){const p=page(),fields=p.schemas[kind]||[];modal(`Page 기본 Schema · ${kind}`,`<div class="schema-help">이 Schema는 새 ${kind} 탭을 만들 때의 기본값입니다. 이미 만들어진 탭의 Schema는 독립적으로 유지됩니다.</div><div id="pageSchemaRows">${fields.map(f=>schemaRow(f)).join('')}</div><button onclick="addPageSchemaRow('${kind}')">＋ 필드 추가</button>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="savePageSchema('${kind}')">저장</button>`)}
function addPageSchemaRow(){document.getElementById('pageSchemaRows').insertAdjacentHTML('beforeend',schemaRow(field('새 필드','text')))}
async function savePageSchema(kind){const p=page(),rows=[...document.querySelectorAll('#pageSchemaRows .schema-row')];p.schemas[kind]=rows.map(row=>{const old=p.schemas[kind]?.find(f=>f.id===row.dataset.row)||field('새 필드','text');old.name=row.querySelector('.sf-name').value.trim()||'필드';old.type=row.querySelector('.sf-type').value;old.component=row.querySelector('.sf-component').value;old.inputType=old.inputType||'auto';old.required=row.querySelector('.sf-req').checked;old.visible=row.querySelector('.sf-vis').checked;if(row.dataset.allowedHeads)old.allowedTagHeadIds=JSON.parse(row.dataset.allowedHeads);if(row.dataset.options)old.options=JSON.parse(row.dataset.options);return old});await saveDB();closeModal();renderBody()}
function tagHeadManager(){const p=page();modal('태그 머리 관리',`<div class="tag-head-manager">${p.data.tagHeads.map(h=>`<div class="tag-head-manage-row"><span style="color:${esc(h.color||'#4b5563')}">${esc(h.name)}</span><button onclick="editTagHead('${h.id}')">수정</button></div>`).join('')||'<div class="empty">태그 머리가 없습니다.</div>'}</div>`,`<button onclick="closeModal()">닫기</button>`)}
function tagHeadDisplaySettings(tabId){const t=page().tabs.find(x=>x.id===tabId),heads=page().data.tagHeads,sel=t.visibleTagHeadIds||[];modal('태그 탭 · 표시할 태그 머리',`<div class="form"><div class="notice">아무 것도 선택하지 않으면 모든 태그 머리를 표시합니다.</div>${heads.map(h=>`<label class="check"><input type="checkbox" class="tag-head-visible" value="${h.id}" ${sel.includes(h.id)?'checked':''}><span style="color:${esc(h.color||'#4b5563')}">${esc(h.name)}</span></label>`).join('')}</div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveTagHeadDisplay('${tabId}')">저장</button>`)}
async function saveTagHeadDisplay(tabId){const t=page().tabs.find(x=>x.id===tabId);t.visibleTagHeadIds=[...document.querySelectorAll('.tag-head-visible:checked')].map(x=>x.value);await saveDB();closeModal();renderBody()}
function profileTagHeadSettings(tabId){const t=page().tabs.find(x=>x.id===tabId),p=page();modal('프로필 태그 머리',`<div class="form"><label>새 프로필 생성 시 자동 태그의 태그 머리<select id="profileTagHead"><option value="">없음</option>${p.data.tagHeads.map(h=>`<option value="${h.id}" ${t.profileTagHeadId===h.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select></label><div class="notice">이 설정은 이후 생성·수정되는 프로필 태그에 적용됩니다.</div></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveProfileTagHead('${tabId}')">저장</button>`)}
async function saveProfileTagHead(tabId){const t=page().tabs.find(x=>x.id===tabId);t.profileTagHeadId=document.getElementById('profileTagHead').value;await saveDB();closeModal();renderBody()}
function initTabDrag(){const root=document.querySelector('.tabs');if(!root||root.dataset.dragReady)return;root.dataset.dragReady='1';let drag=null;root.querySelectorAll('.tab[data-tab-id]').forEach(el=>{el.addEventListener('dragstart',e=>{drag=el;el.classList.add('dragging');e.dataTransfer.effectAllowed='move'});el.addEventListener('dragend',async()=>{if(!drag)return;drag.classList.remove('dragging');const ids=[...root.querySelectorAll('.tab[data-tab-id]')].map(x=>x.dataset.tabId),p=page();p.tabs=ids.map(id=>p.tabs.find(t=>t.id===id)).filter(Boolean);drag=null;await saveDB()})});root.addEventListener('dragover',e=>{e.preventDefault();if(!drag)return;const others=[...root.querySelectorAll('.tab[data-tab-id]:not(.dragging)')];const after=others.find(x=>e.clientX<x.getBoundingClientRect().left+x.offsetWidth/2);after?root.insertBefore(drag,after):root.appendChild(drag)});enablePointerReorder(root,'.tab[data-tab-id]','.tab[data-tab-id]','x',async()=>{const ids=[...root.querySelectorAll('.tab[data-tab-id]')].map(x=>x.dataset.tabId),p=page();p.tabs=ids.map(id=>p.tabs.find(t=>t.id===id)).filter(Boolean);await saveDB()})}
function backup(){modal('백업 / 복원',`<div class="form"><div class="notice">현재 v2.33 신형 Schema DB만 백업/복원합니다. 구형 DB를 읽거나 변환하지 않습니다.</div><button onclick="exportDB()">JSON 백업 내보내기</button><button onclick="importDB()">JSON 백업 가져오기</button><button class="danger" onclick="resetDB()">현재 DB 초기화</button></div>`,`<button onclick="closeModal()">닫기</button>`)}
function exportDB(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tagmark-v2.33-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importDB(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||!Array.isArray(x.pages))throw new Error('Tagmark 신형 백업 형식이 아닙니다.');db=normalizeDB(x);state.pageId=db.pages[0].id;state.tabId=db.pages[0].tabs[0]?.id||null;await saveDB();closeModal();render();toast('복원이 완료되었습니다.')}catch(e){toast('가져오기 실패: '+e.message)}};i.click()}
async function resetDB(){if(!confirm('현재 로컬 DB를 완전히 초기화할까요?'))return;db=blankDB();state.pageId=db.pages[0].id;state.tabId=db.pages[0].tabs[0].id;state.selected.clear();await saveDB();closeModal();render()}
async function init(){try{await loadDB();render()}catch(e){console.error(e);document.getElementById('app').innerHTML=`<div style="padding:30px"><h2>신형 로컬 DB를 열 수 없습니다.</h2><p>${esc(e.message||e)}</p><p class="muted">IndexedDB가 차단된 비공개 브라우징/콘텐츠 환경인지 확인해 주세요.</p></div>`}}
init();
</script></body></html>
