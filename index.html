<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tagmark v2.01</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#dfe4ec;--text:#18202b;--muted:#6d7785;--accent:#315efb;--danger:#d64545;--side:#111827;--side2:#26344d}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;color:var(--text)}button:hover{background:#f1f4f9}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:var(--danger)}.app{display:flex;height:100vh;overflow:hidden}.sidebar{width:250px;background:var(--side);color:#fff;padding:18px;display:flex;flex-direction:column;gap:12px}.brand{font-weight:800;font-size:18px}.version{font-size:11px;color:#9ca3af;margin-top:-8px}.side-actions{display:flex;gap:7px}.side-actions button{flex:1}.page-list{overflow:auto;display:flex;flex-direction:column;gap:5px}.page-item{padding:10px;border-radius:8px;cursor:pointer;color:#d1d5db;display:flex;align-items:center;gap:7px}.page-item.active{background:var(--side2);color:#fff}.page-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{flex:1;display:flex;flex-direction:column;min-width:0}.topbar{min-height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 18px}.topbar input{flex:1;max-width:520px;padding:10px 12px;border:1px solid var(--line);border-radius:9px}.content{padding:20px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.head h1{margin:0 0 4px}.muted{color:var(--muted);font-size:13px}.actions,.toolbar,.tabs,.pill-row{display:flex;gap:7px;flex-wrap:wrap}.tabs{border-bottom:1px solid var(--line);margin:18px 0 14px;padding-bottom:0;overflow:auto}.tab{border:0;border-radius:8px 8px 0 0;background:transparent;padding:11px 14px;color:var(--muted);white-space:nowrap}.tab.active{color:var(--accent);background:#fff;border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px}.toolbar{align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{padding:9px;border:1px solid var(--line);border-radius:8px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.cards.list{display:flex;flex-direction:column}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative}.card h3{margin:0 40px 8px 0;font-size:16px}.card .field{margin-top:8px}.field-name{font-size:11px;color:var(--muted);margin-bottom:2px}.card-actions{position:absolute;right:10px;top:10px;display:flex;gap:4px}.card-actions button{padding:4px 7px}.empty{padding:45px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.chip{display:inline-flex;align-items:center;gap:3px;padding:4px 8px;border-radius:999px;background:#eef1f6;font-size:12px;margin:2px}.chip button{border:0;background:transparent;padding:0 2px;color:inherit}.chip.male{background:#e9f1ff}.chip.female{background:#fff0f4}.chip.artist{background:#fff2dc}.chip.series{background:#eeeaff}.chip.character{background:#e9f8ee}.chip.production{background:#e9f5f7}.folder{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;grid-column:1/-1}.folder-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.folder-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}.notice{padding:10px 12px;border-radius:8px;background:#eef3ff;color:#2949a6;font-size:13px}.modal-back{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000}.modal{width:min(820px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 20px 60px #0004}.modal h2{margin-top:0}.form{display:grid;gap:11px}.form label{font-size:13px;font-weight:600}.form input,.form textarea,.form select{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px}.form textarea{min-height:100px;resize:vertical}.modal-footer{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.schema-row{display:grid;grid-template-columns:1.3fr 1fr auto;gap:7px;align-items:center;margin:7px 0}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}.list-box{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}.tree-row{display:flex;align-items:center;gap:7px;padding:6px 4px}.tree-row span{flex:1}.subtle{font-size:12px;color:var(--muted)}.main-pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.main-pages.list{display:flex;flex-direction:column}.page-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;cursor:pointer;position:relative}.page-card:hover{border-color:#b9c4d8}.page-card h3{margin:5px 0}.page-card .pc-actions{position:absolute;right:10px;top:10px}.stat{font-size:12px;color:var(--muted)}.tag-heads{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.tag-head{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.tag-head-title{font-weight:700;margin-bottom:8px}.profile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.profile-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.hidden{display:none!important}
@media(max-width:760px){.sidebar{width:190px}.content{padding:14px}.head{flex-direction:column}.grid2{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.main-pages{grid-template-columns:1fr}}
</style></head>
<body><div id="app"></div>
<script>
const VERSION="v2.01";
const DB_NAME="tagmark-local-v1", DB_VERSION=7;
const STORES={BOOKMARKS:"bookmarks",TAGS:"registeredTags",CATEGORIES:"categories",TAG_INDEX:"tagIndex",FOLDERS:"bookmarkFolders",APP:"appState"};
const TAG_KINDS=["male","female","artist","series","language","character","cast","tag","production"];
const TAG_KIND_LABEL={male:"남성",female:"여성",artist:"작가",series:"시리즈",language:"언어",character:"캐릭터",cast:"성우/배우",tag:"태그",production:"제작/제작사"};
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
const tagLabel=t=>String(t||"").replace(/^\[[^\]]+\]\s*/,"");
const tagKind=t=>{const s=tagLabel(t),m=s.match(/^([A-Za-z]+):/);return m?m[1].toLowerCase():"tag"};
const tagColor=t=>{const k=tagKind(t);return ["male","female","artist","series","character","production"].includes(k)?k:""};
const normalizeUrl=u=>{try{const x=new URL(String(u||"").trim());x.protocol=x.protocol.toLowerCase();x.hostname=x.hostname.toLowerCase();if((x.protocol==="https:"&&x.port==="443")||(x.protocol==="http:"&&x.port==="80"))x.port="";x.hash="";if(x.pathname.length>1)x.pathname=x.pathname.replace(/\/+$/ ,"");return x.toString()}catch{return String(u||"").trim().replace(/\/+$/ ,"")}};
let idb=null, categories=[], items=[], folders=[], registeredTags=[], registeredMeta=[], tagNameToId=new Map(), tagIdToName=new Map(), state={mainLayout:"grid",mainSort:"asc",activePageId:null,activeTabId:null,tabLayout:{},pageFeatures:{}};
let ui={query:"",subCategory:"",sort:"updated",sortDesc:true,tagMode:"AND",includeTags:[],excludeTags:[],folderOpen:new Set()};
function reqPromise(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error("IndexedDB error"))})}
async function openDB(){if(idb)return idb;return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORES.BOOKMARKS))d.createObjectStore(STORES.BOOKMARKS,{keyPath:"i"});if(!d.objectStoreNames.contains(STORES.TAGS))d.createObjectStore(STORES.TAGS,{keyPath:"name"});if(!d.objectStoreNames.contains(STORES.CATEGORIES))d.createObjectStore(STORES.CATEGORIES,{keyPath:"id"});if(!d.objectStoreNames.contains(STORES.TAG_INDEX))d.createObjectStore(STORES.TAG_INDEX,{keyPath:"id"});if(!d.objectStoreNames.contains(STORES.FOLDERS))d.createObjectStore(STORES.FOLDERS,{keyPath:"id"});if(!d.objectStoreNames.contains(STORES.APP))d.createObjectStore(STORES.APP,{keyPath:"id"})};r.onsuccess=()=>{idb=r.result;idb.onversionchange=()=>idb.close();res(idb)};r.onerror=()=>rej(r.error||new Error("로컬 DB 열기 실패"))})}
async function all(store){const d=await openDB();return reqPromise(d.transaction(store).objectStore(store).getAll())}
async function putRaw(store,obj){const d=await openDB();return reqPromise(d.transaction(store,"readwrite").objectStore(store).put(obj))}
async function delRaw(store,key){const d=await openDB();return reqPromise(d.transaction(store,"readwrite").objectStore(store).delete(key))}
async function saveState(){await putRaw(STORES.APP,{id:"ui",state});}
async function loadState(){try{const r=(await all(STORES.APP)).find(x=>x.id==="ui");if(r?.state)state=Object.assign(state,r.state)}catch(e){console.warn(e)}}
function rootPages(){return categories.filter(c=>!c.parentId).sort((a,b)=>a.name.localeCompare(b.name,"ko"))}
function pageById(id){return categories.find(c=>c.id===id)||null}
function children(pid){return categories.filter(c=>(c.parentId||null)===(pid||null)).sort((a,b)=>a.name.localeCompare(b.name,"ko"))}
function descendants(id){const s=new Set([id]);let changed=true;while(changed){changed=false;for(const c of categories)if(c.parentId&&s.has(c.parentId)&&!s.has(c.id)){s.add(c.id);changed=true}}return s}
function catPath(id){const out=[],seen=new Set();let c=pageById(id);while(c&&!seen.has(c.id)){seen.add(c.id);out.unshift(c.name);c=c.parentId?pageById(c.parentId):null}return out.join(" / ")}
function pageScope(){return state.activePageId?descendants(state.activePageId):new Set()}
function ensurePageState(){const ps=state.pageFeatures||{};for(const p of rootPages()){if(!ps[p.id])ps[p.id]={bookmark:true,tag:true,profile:true,category:true,characters:true,profileCharacterLink:true};if(!state.tabLayout[p.id])state.tabLayout[p.id]=["main","tags","profiles"]} }
function defaultTabIds(p){return state.tabLayout[p.id]||["main","tags","profiles"]}
function tabDefs(p){return defaultTabIds(p).map(id=>{const d=state.tabDefs?.[id];return{id,name:id==="main"?"메인":id==="tags"?"태그 관리":id==="profiles"?"프로필":d?.name||id.slice(7),icon:id==="tags"?"🏷️":id==="profiles"?"👤":"📄"}})}
function features(p){return state.pageFeatures[p.id]||{bookmark:true,tag:true,profile:true,category:true,characters:true,profileCharacterLink:true}}
function currentTab(p){const defs=tabDefs(p),id=state.activeTabId;return defs.find(x=>x.id===id)||defs[0]}
function syncActive(){const pages=rootPages();if(state.activePageId&&!pages.some(p=>p.id===state.activePageId))state.activePageId=null;if(state.activePageId){const defs=tabDefs(pageById(state.activePageId));if(!defs.some(t=>t.id===state.activeTabId))state.activeTabId=defs[0]?.id||null}}
async function loadData(){await openDB();await loadState();categories=await all(STORES.CATEGORIES);const rawTags=await all(STORES.TAGS);registeredMeta=rawTags;registeredTags=rawTags.map(x=>x.name).filter(Boolean);const ti=await all(STORES.TAG_INDEX);tagNameToId.clear();tagIdToName.clear();for(const r of ti){if(r?.name&&r.id!=null){tagNameToId.set(r.name,r.id);tagIdToName.set(r.id,r.name)}};const br=await all(STORES.BOOKMARKS);items=br.map(decodeBookmark);folders=await all(STORES.FOLDERS);ensurePageState();syncActive();}
function decodeBookmark(r){if(r?.i!==undefined)return{id:r.i,url:r.u||"",title:r.l||"",categoryId:r.c||null,folderId:r.f||null,tags:(r.t||[]).map(id=>tagIdToName.get(id)).filter(Boolean),characters:(r.h||[]).map(c=>({name:c.n||"",role:c.r||"character",gender:c.g||"male",tags:(c.t||[]).map(id=>tagIdToName.get(id)).filter(Boolean)})),notes:r.n||"",metaType:r.m||"",pages:r.p??null,duration:r.d??null,artist:undefined,series:undefined,createdAt:r.a||Date.now(),updatedAt:r.b||Date.now()};return r||{}}
async function ensureTagIds(tags){const ids=[];let max=0;for(const id of tagIdToName.keys())max=Math.max(max,Number(id)||0);for(const t of tags||[]){if(!t)continue;let id=tagNameToId.get(t);if(id==null){id=++max;tagNameToId.set(t,id);tagIdToName.set(id,t);await putRaw(STORES.TAG_INDEX,{id,name:t})}ids.push(id)}return ids}
async function encodeBookmark(x){const ti=await ensureTagIds([...new Set(x.tags||[])]),cts=[];for(const c of x.characters||[]){cts.push({n:c.name||"",r:c.role||"character",g:c.gender||"male",t:await ensureTagIds([...new Set(c.tags||[])])})}return{i:x.id,u:normalizeUrl(x.url),l:x.title,c:x.categoryId||null,f:x.folderId||null,t:ti,h:cts,n:x.notes||"",m:x.metaType||"",p:x.pages??null,d:x.duration??null,a:x.createdAt||Date.now(),b:x.updatedAt||Date.now()}}
async function putBookmark(x){await putRaw(STORES.BOOKMARKS,await encodeBookmark(x))}
async function registerTag(name,kind="tag",profile=null){const n=String(name||"").trim();if(!n)return;let r=registeredMeta.find(x=>x.name===n);if(!r){r={name:n,kind,everUsed:true,profile:profile||undefined};registeredMeta.push(r);registeredTags.push(n);await putRaw(STORES.TAGS,r)}return n}
function tagValues(type,tags){return (tags||[]).filter(t=>tagKind(t)===type).map(t=>tagLabel(t).replace(new RegExp("^"+type+":","i"),"").trim()).filter(Boolean)}
function scopedItems(){const scope=pageScope();let a=items.filter(x=>!state.activePageId||scope.has(x.categoryId));if(ui.subCategory){const ds=descendants(ui.subCategory);a=a.filter(x=>ds.has(x.categoryId))}const q=ui.query.trim().toLowerCase();if(q)a=a.filter(x=>[x.title,x.url,x.notes,...(x.tags||[]),...(x.characters||[]).map(c=>c.name)].join(" ").toLowerCase().includes(q));if(ui.includeTags.length||ui.excludeTags.length){a=a.filter(x=>{const ts=new Set(x.tags||[]);const inc=ui.includeTags.every(t=>ts.has(t)),ex=ui.excludeTags.some(t=>ts.has(t));return ui.tagMode==="AND"?inc&&!ex:((ui.includeTags.length?ui.includeTags.some(t=>ts.has(t)):true)&&!ex)})}return a}
function sortItems(a){const val=x=>ui.sort==="title"?x.title:ui.sort==="artist"?tagValues("artist",x.tags).join(", "):ui.sort==="series"?tagValues("series",x.tags).join(", "):x.updatedAt||0;return [...a].sort((x,y)=>{const av=val(x),bv=val(y);const c=typeof av==="number"&&typeof bv==="number"?av-bv:String(av).localeCompare(String(bv),"ko");return ui.sortDesc?-c:c})}
function tagMarkup(t,remove=false){return `<span class="chip ${tagColor(t)}">${esc(tagLabel(t))}${remove?` <button onclick="removeEditTag(${JSON.stringify(t)})">×</button>`:""}</span>`}
function valueHTML(v,type){if(v==null||v==="")return '<span class="muted">—</span>';if(type==="url")return `<a class="link" href="${esc(v)}" target="_blank" rel="noopener noreferrer">${esc(v)}</a>`;if(Array.isArray(v))return v.map(x=>tagMarkup(String(x))).join("");return esc(typeof v==="object"?JSON.stringify(v):v)}
function bookmarkCard(x){const title=x.title||x.url||"Untitled",tags=(x.tags||[]).slice(0,8);return `<article class="card"><div class="card-actions"><button onclick="editBookmark('${esc(x.id)}')">✎</button><button class="danger" onclick="deleteBookmark('${esc(x.id)}')">×</button></div><h3>${x.url?`<a class="link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">${esc(title)}</a>`:esc(title)}</h3>${tagValues("artist",x.tags).length?`<div class="field"><div class="field-name">Artist</div><div>${esc(tagValues("artist",x.tags).join(", "))}</div></div>`:""}${tagValues("series",x.tags).length?`<div class="field"><div class="field-name">Series</div><div>${esc(tagValues("series",x.tags).join(", "))}</div></div>`:""}<div class="field">${tags.map(t=>tagMarkup(t)).join("")}</div>${x.characters?.length?`<div class="field"><div class="field-name">Characters</div><div>${x.characters.map(c=>`<span class="chip character">${esc(c.name)}</span>`).join("")}</div></div>`:""}</article>`}
function folderHTML(f,children){return `<section class="folder"><div class="folder-head"><div><strong>📁 ${esc(f.title||"Folder")}</strong><div class="subtle">${esc(f.artist||"")} ${f.series?"· "+esc(f.series):""}</div></div><div class="actions"><button onclick="toggleFolder('${esc(f.id)}')">${ui.folderOpen.has(f.id)?"접기":"열기"}</button><button onclick="editFolder('${esc(f.id)}')">✎</button><button class="danger" onclick="deleteFolder('${esc(f.id)}')">×</button></div></div>${ui.folderOpen.has(f.id)?`<div class="folder-items">${children.map(bookmarkCard).join("")||'<div class="empty">폴더가 비어 있습니다.</div>'}</div>`:""}</section>`}
function mainPageHTML(){const pages=rootPages();let a=[...pages];if(state.mainSort==="desc")a.reverse();return `<div class="head"><div><h1>Main Page</h1></div><div class="actions"><button class="${state.mainLayout==="grid"?'primary':''}" onclick="setMainLayout('grid')">▦ 그리드</button><button class="${state.mainLayout==="list"?'primary':''}" onclick="setMainLayout('list')">☷ 목록</button><button onclick="toggleMainSort()">${state.mainSort==="asc"?'A→Z':'Z→A'}</button><button class="primary" onclick="newPage()">＋ Page</button></div></div><div class="main-pages ${state.mainLayout==='list'?'list':''}">${a.map(p=>`<article class="page-card" onclick="openPage('${esc(p.id)}')"><div class="pc-actions"><button onclick="event.stopPropagation();editPage('${esc(p.id)}')">✎</button></div><div class="v12icon">${esc(p.icon||'📁')}</div><h3>${esc(p.name)}</h3><div class="stat">북마크 ${items.filter(x=>descendants(p.id).has(x.categoryId)).length}개 · 하위 카테고리 ${Math.max(0,descendants(p.id).size-1)}개</div></article>`).join("")||'<div class="empty">Page가 없습니다.<br><button class="primary" style="margin-top:12px" onclick="newPage()">＋ Page 추가</button></div>'}</div>`}
function render(){ensurePageState();syncActive();const p=state.activePageId?pageById(state.activePageId):null;document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand">Tagmark</div><div class="version">${VERSION}</div><div class="side-actions"><button onclick="goHome()">Main</button><button onclick="exportData()">백업</button></div><div class="page-list">${rootPages().map(x=>`<div class="page-item ${p?.id===x.id?'active':''}" onclick="openPage('${esc(x.id)}')"><span>${esc(x.icon||'📁')}</span><span class="page-name">${esc(x.name)}</span></div>`).join('')}</div></aside><main class="main"><div class="topbar"><input value="${esc(ui.query)}" oninput="ui.query=this.value;renderPageBody()" placeholder="검색..."><button onclick="importData()">가져오기</button><button onclick="backupDownload()">백업</button></div><div class="content" id="content">${p?pageHTML(p):mainPageHTML()}</div></main></div>`}
function pageHTML(p){const defs=tabDefs(p),t=currentTab(p),f=features(p);return `<div class="head"><div><h1>${esc(p.icon||'📁')} ${esc(p.name)}</h1></div><div class="actions"><button onclick="newTab()">＋ Tab</button><button onclick="editPage('${esc(p.id)}')">편집</button><button onclick="pageSettings('${esc(p.id)}')">⚙</button><button class="danger" onclick="deletePage('${esc(p.id)}')">삭제</button></div></div><div class="tabs">${defs.map(x=>`<button class="tab ${x.id===t.id?'active':''}" onclick="selectTab('${esc(x.id)}')">${x.icon} ${esc(x.name)}</button>`).join('')}<button class="tab" onclick="newTab()">＋</button></div>${tabHTML(p,t,f)}`}
function tabHTML(p,t,f){if(t.id==='main')return bookmarkTab(p,f);if(t.id==='tags')return tagTab(p,f);if(t.id==='profiles')return profileTab(p,f);return customTab(p,t)}
function bookmarkTab(p,f){if(!f.bookmark)return `<div class="empty">이 Page의 북마크 기능이 꺼져 있습니다.</div>`;const a=sortItems(scopedItems()),foldersIn=folders.filter(x=>items.some(i=>i.folderId===x.id&&pageScope().has(i.categoryId)));return `<div class="toolbar"><input value="${esc(ui.query)}" oninput="ui.query=this.value;renderPageBody()" placeholder="검색"><select onchange="ui.sort=this.value;renderPageBody()"><option value="updated" ${ui.sort==='updated'?'selected':''}>최근 수정</option><option value="title" ${ui.sort==='title'?'selected':''}>제목</option><option value="artist" ${ui.sort==='artist'?'selected':''}>Artist</option><option value="series" ${ui.sort==='series'?'selected':''}>Series</option></select><button onclick="ui.sortDesc=!ui.sortDesc;renderPageBody()">${ui.sortDesc?'↓':'↑'}</button><select onchange="ui.subCategory=this.value;renderPageBody()"><option value="">하위 전체</option>${childrenOptions(p.id)}</select><button onclick="newBookmark()">＋ Bookmark</button><button onclick="newFolder()">＋ Folder</button><button onclick="bulkTagPrompt()">일괄 태그</button><button onclick="bulkCharacterPrompt()">일괄 캐릭터</button></div><div class="cards">${foldersIn.map(f=>folderHTML(f,ui.folderOpen.has(f.id)?a.filter(x=>x.folderId===f.id):[])).join('')}${a.filter(x=>!x.folderId).map(bookmarkCard).join('')||(!foldersIn.length?'<div class="empty">북마크가 없습니다.</div>':'')}</div>`}
function childrenOptions(pid){let h='';const walk=(id,d)=>{for(const c of children(id)){h+=`<option value="${esc(c.id)}">${'　'.repeat(d)}${esc(c.name)}</option>`;walk(c.id,d+1)}};walk(pid,0);return h}
function tagTab(p,f){if(!f.tag)return `<div class="empty">이 Page의 태그 기능이 꺼져 있습니다.</div>`;const scope=pageScope(),tags=registeredMeta.filter(x=>{const n=x.name||'';return !n.startsWith('[')||scopeTags().has(n)}).sort((a,b)=>a.name.localeCompare(b.name,'ko'));const heads=TAG_KINDS.map(k=>({k,rows:tags.filter(x=>(x.kind||tagKind(x.name))===k)})).filter(x=>x.rows.length);return `<div class="toolbar"><input placeholder="태그 검색" oninput="filterTagsView(this.value)"><button onclick="newTag()">＋ 태그</button><button onclick="newTagHead()">＋ 태그 머리</button></div><div id="tagView" class="tag-heads">${heads.map(h=>`<section class="tag-head"><div class="tag-head-title">${TAG_KIND_LABEL[h.k]||h.k}</div>${h.rows.map(r=>`<span class="chip ${tagColor(r.name)}">${esc(tagLabel(r.name))}<button onclick="editTag('${esc(r.name)}')">✎</button></span>`).join('')}</section>`).join('')||'<div class="empty">등록된 태그가 없습니다.</div>'}</div>`}
function scopeTags(){const s=pageScope();return new Set(registeredTags.filter(t=>{const m=t.match(/^\[([^\]]+)\]/);return !m||[...s].some(id=>catPath(id)===m[1])}))}
function profileTab(p,f){if(!f.profile)return `<div class="empty">이 Page의 프로필 기능이 꺼져 있습니다.</div>`;const scope=pageScope(),used=new Map();for(const t of registeredMeta){if(t.profile){const r=t;const rid=r.profile.id||r.profile.name||r.name;used.set(rid,r)}}return `<div class="toolbar"><input placeholder="프로필 검색" oninput="filterProfilesView(this.value)"><button onclick="newProfile()">＋ 프로필</button></div><div id="profileView" class="profile-grid">${[...used.values()].map(r=>`<article class="profile-card"><strong>${esc(r.profile.name||r.name)}</strong><div class="subtle">${esc(r.profile.series||'')}</div><div class="field">${(r.profile.tags||[]).map(t=>tagMarkup(t)).join('')}</div><button onclick="editProfile('${esc(r.name)}')">편집</button></article>`).join('')||'<div class="empty">등록된 프로필이 없습니다.</div>'}</div>`}
function customTab(p,t){return `<div class="toolbar"><button onclick="newBookmark()">＋ Record</button><button onclick="editCustomTab('${esc(t.id)}')">⚙</button></div><div class="empty">이 사용자 Tab은 신형 구조의 독립 공간입니다.</div>`}
function renderPageBody(){const c=document.getElementById('content');if(!c)return;const p=state.activePageId?pageById(state.activePageId):null;c.innerHTML=p?pageHTML(p):mainPageHTML()}
function goHome(){state.activePageId=null;state.activeTabId=null;saveState().then(render)}
function openPage(id){state.activePageId=id;state.activeTabId='main';ui.query='';saveState().then(render)}
function selectTab(id){state.activeTabId=id;ui.query='';saveState().then(render)}
function setMainLayout(v){state.mainLayout=v;saveState().then(render)}
function toggleMainSort(){state.mainSort=state.mainSort==='asc'?'desc':'asc';saveState().then(render)}
function modal(title,body,foot){document.getElementById('modal')?.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><div class="modal"><h2>${title}</h2>${body}<div class="modal-footer">${foot||'<button onclick="closeModal()">취소</button>'}</div></div></div>`)}
function closeModal(){document.getElementById('modal')?.remove()}
function newPage(){modal('새 Page',`<div class="form"><label>Page 이름<input id="newPageName" autofocus></label><label>아이콘<input id="newPageIcon" value="📁"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createPage()">추가</button>`);document.getElementById('newPageName').onkeydown=e=>{if(e.key==='Enter')createPage()}}
async function createPage(){const name=document.getElementById('newPageName')?.value.trim();if(!name)return;const roots=rootPages();if(roots.some(x=>x.name===name)){alert('같은 이름의 Page가 이미 있습니다.');return}const c={id:uid(),name,parentId:null};await putRaw(STORES.CATEGORIES,c);categories.push(c);state.pageFeatures[c.id]={bookmark:true,tag:true,profile:true,category:true,characters:true,profileCharacterLink:true};state.tabLayout[c.id]=['main','tags','profiles'];state.activePageId=c.id;state.activeTabId='main';await saveState();closeModal();render()}
function editPage(id){const p=pageById(id);if(!p)return;modal('Page 편집',`<div class="form"><label>Page 이름<input id="editPageName" value="${esc(p.name)}"></label><label>아이콘<input id="editPageIcon" value="${esc(p.icon||'📁')}"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="savePageEdit('${esc(id)}')">저장</button>`)}
async function savePageEdit(id){const p=pageById(id);if(!p)return;p.name=document.getElementById('editPageName').value.trim()||p.name;p.icon=document.getElementById('editPageIcon').value||'📁';await putRaw(STORES.CATEGORIES,p);categories=await all(STORES.CATEGORIES);await saveState();closeModal();render()}
async function deletePage(id){const p=pageById(id);if(!p)return;if(!confirm(`Page "${p.name}"와 하위 카테고리를 삭제할까요? 북마크 자체는 삭제하지 않고 분류만 해제합니다.`))return;const ds=descendants(id);for(const c of [...ds])await delRaw(STORES.CATEGORIES,c);for(const x of items)if(ds.has(x.categoryId)){x.categoryId=null;await putBookmark(x)}categories=await all(STORES.CATEGORIES);delete state.pageFeatures[id];delete state.tabLayout[id];state.activePageId=null;await saveState();render()}
function pageSettings(id){const p=pageById(id),f=features(p);modal('Page 설정',`<div class="form">${Object.entries({bookmark:'북마크',tag:'태그',profile:'프로필',category:'카테고리',characters:'등장인물',profileCharacterLink:'프로필↔등장인물'}).map(([k,l])=>`<label class="check"><input type="checkbox" id="pf_${k}" ${f[k]?'checked':''}> ${l}</label>`).join('')}</div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="savePageSettings('${esc(id)}')">저장</button>`)}
async function savePageSettings(id){const f={};for(const k of ['bookmark','tag','profile','category','characters','profileCharacterLink'])f[k]=document.getElementById('pf_'+k).checked;state.pageFeatures[id]=f;await saveState();closeModal();render()}
function newTab(){modal('새 Tab',`<div class="form"><label>Tab 이름<input id="newTabName" autofocus></label><label>유형<select id="newTabType"><option value="custom">사용자 Tab</option><option value="bookmark">북마크</option><option value="tag">태그</option><option value="profile">프로필</option><option value="category">카테고리</option></select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createTab()">추가</button>`);document.getElementById('newTabName').onkeydown=e=>{if(e.key==='Enter')createTab()}}
async function createTab(){const p=pageById(state.activePageId);const n=document.getElementById('newTabName')?.value.trim();const type=document.getElementById('newTabType')?.value||'custom';if(!p||!n)return;const id='custom:'+uid();state.tabLayout[p.id]=[...(state.tabLayout[p.id]||['main','tags','profiles']),id];state.tabDefs=state.tabDefs||{};state.tabDefs[id]={name:n,type};state.activeTabId=id;await saveState();closeModal();render()}
function editCustomTab(id){const d=state.tabDefs?.[id];if(!d)return;modal('Tab 설정',`<div class="form"><label>Tab 이름<input id="ctn" value="${esc(d.name)}"></label><label>유형<select id="ctt"><option value="custom" ${d.type==='custom'?'selected':''}>사용자 Tab</option><option value="bookmark" ${d.type==='bookmark'?'selected':''}>북마크</option><option value="tag" ${d.type==='tag'?'selected':''}>태그</option><option value="profile" ${d.type==='profile'?'selected':''}>프로필</option><option value="category" ${d.type==='category'?'selected':''}>카테고리</option></select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveCustomTab('${esc(id)}')">저장</button>`)}
async function saveCustomTab(id){state.tabDefs=state.tabDefs||{};state.tabDefs[id]={name:document.getElementById('ctn').value.trim()||state.tabDefs[id].name,type:document.getElementById('ctt').value};await saveState();closeModal();render()}
function newBookmark(){const p=pageById(state.activePageId);const f=features(p);if(!f.bookmark)return;const x={id:uid(),title:'',url:'',categoryId:state.activePageId,tags:[],characters:[],notes:'',metaType:'',pages:null,duration:null,createdAt:Date.now(),updatedAt:Date.now()};bookmarkModal(x,false)}
function bookmarkModal(x,editing){window._edit=x;modal(editing?'북마크 편집':'새 북마크',`<div class="form"><label>제목<input id="bmTitle" value="${esc(x.title)}"></label><label>URL<input id="bmUrl" value="${esc(x.url)}"></label><label>카테고리<select id="bmCat"><option value="">없음</option>${childrenOptionsAllRoot().map(o=>`<option value="${o.id}" ${x.categoryId===o.id?'selected':''}>${'　'.repeat(o.d)}${esc(o.name)}</option>`).join('')}</select></label><label>태그<input id="bmTags" value="${esc((x.tags||[]).join(', '))}"></label><label>캐릭터<textarea id="bmChars" placeholder="이름, 이름"></textarea></label><label>메모<textarea id="bmNotes">${esc(x.notes||'')}</textarea></label><div class="grid2"><label>페이지 수<input id="bmPages" type="number" value="${x.pages??''}"></label><label>재생시간<input id="bmDuration" value="${esc(x.duration||'')}"></label></div></div>`,`<button onclick="closeModal()">취소</button>${editing?`<button onclick="cloneBookmark()">복제</button>`:''}<button class="primary" onclick="saveBookmarkModal()">저장</button>`)}
function childrenOptionsAllRoot(){const out=[];const walk=(id,d)=>{for(const c of children(id)){out.push({id:c.id,name:c.name,d});walk(c.id,d+1)}};for(const p of rootPages()){out.push({id:p.id,name:p.name,d:0});walk(p.id,1)}return out}
async function saveBookmarkModal(){const x=window._edit;x.title=document.getElementById('bmTitle').value.trim();x.url=normalizeUrl(document.getElementById('bmUrl').value);x.categoryId=document.getElementById('bmCat').value||state.activePageId;x.tags=document.getElementById('bmTags').value.split(',').map(s=>s.trim()).filter(Boolean);x.characters=document.getElementById('bmChars').value.split(',').map(s=>s.trim()).filter(Boolean).map(n=>({name:n,role:'character',gender:'male',tags:[]}));x.notes=document.getElementById('bmNotes').value;x.pages=document.getElementById('bmPages').value?Number(document.getElementById('bmPages').value):null;x.duration=document.getElementById('bmDuration').value.trim()||null;x.updatedAt=Date.now();for(const t of x.tags)await registerTag(t,tagKind(t));await putBookmark(x);items=await all(STORES.BOOKMARKS);items=items.map(decodeBookmark);closeModal();render()}
function editBookmark(id){const x=items.find(i=>String(i.id)===String(id));if(x)bookmarkModal({...x,tags:[...(x.tags||[])],characters:[...(x.characters||[]).map(c=>({...c}))]},true)}
async function deleteBookmark(id){if(!confirm('이 북마크를 삭제할까요?'))return;await delRaw(STORES.BOOKMARKS,id);items=items.filter(x=>String(x.id)!==String(id));render()}
function cloneBookmark(){const x={...window._edit,id:uid(),createdAt:Date.now(),updatedAt:Date.now()};putBookmark(x).then(async()=>{items=await all(STORES.BOOKMARKS);items=items.map(decodeBookmark);closeModal();render()})}
function newFolder(){if(!state.activePageId)return;modal('새 Folder',`<div class="form"><label>이름<input id="folderName"></label><label>Artist<input id="folderArtist"></label><label>Series<input id="folderSeries"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveNewFolder()">생성</button>`)}
async function saveNewFolder(){const f={id:uid(),title:document.getElementById('folderName').value.trim()||'Folder',artist:document.getElementById('folderArtist').value.trim(),series:document.getElementById('folderSeries').value.trim(),createdAt:Date.now(),updatedAt:Date.now()};await putRaw(STORES.FOLDERS,f);folders.push(f);closeModal();render()}
function toggleFolder(id){ui.folderOpen.has(id)?ui.folderOpen.delete(id):ui.folderOpen.add(id);renderPageBody()}
function editFolder(id){const f=folders.find(x=>x.id===id);if(!f)return;modal('Folder 편집',`<div class="form"><label>이름<input id="fn" value="${esc(f.title||'')}"></label><label>Artist<input id="fa" value="${esc(f.artist||'')}"></label><label>Series<input id="fs" value="${esc(f.series||'')}"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveFolder('${esc(id)}')">저장</button>`)}
async function saveFolder(id){const f=folders.find(x=>x.id===id);f.title=document.getElementById('fn').value.trim();f.artist=document.getElementById('fa').value.trim();f.series=document.getElementById('fs').value.trim();f.updatedAt=Date.now();await putRaw(STORES.FOLDERS,f);closeModal();render()}
async function deleteFolder(id){if(!confirm('Folder를 삭제할까요? 북마크는 유지됩니다.'))return;await delRaw(STORES.FOLDERS,id);for(const x of items)if(x.folderId===id){x.folderId=null;await putBookmark(x)}folders=folders.filter(x=>x.id!==id);render()}
function newTag(){modal('새 태그',`<div class="form"><label>태그 이름<input id="tagName"></label><label>태그 머리<select id="tagKind">${TAG_KINDS.map(k=>`<option value="${k}">${TAG_KIND_LABEL[k]}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createTag()">추가</button>`)}
async function createTag(){const n=document.getElementById('tagName').value.trim();const k=document.getElementById('tagKind').value;if(!n)return;const full=/^[A-Za-z]+:/.test(n)?n:`${k}:${n}`;await registerTag(full,k);closeModal();renderPageBody()}
function newTagHead(){modal('새 태그 머리',`<div class="form"><label>이름<input id="headName"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createTagHead()">추가</button>`)}
async function createTagHead(){const n=document.getElementById('headName').value.trim();if(!n)return;if(!TAG_KINDS.includes(n))TAG_KINDS.push(n);closeModal();renderPageBody()}
function editTag(name){const r=registeredMeta.find(x=>x.name===name);if(!r)return;modal('태그 편집',`<div class="form"><label>이름<input id="etn" value="${esc(tagLabel(name))}"></label><label>태그 머리<select id="etk">${TAG_KINDS.map(k=>`<option value="${k}" ${(r.kind||tagKind(name))===k?'selected':''}>${TAG_KIND_LABEL[k]||k}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="danger" onclick="deleteTag('${esc(name)}')">삭제</button><button class="primary" onclick="saveTagEdit('${esc(name)}')">저장</button>`)}
async function saveTagEdit(old){const r=registeredMeta.find(x=>x.name===old),n=document.getElementById('etn').value.trim(),k=document.getElementById('etk').value;if(!r||!n)return;const full=`${k}:${n}`;await delRaw(STORES.TAGS,old);r.name=full;r.kind=k;await putRaw(STORES.TAGS,r);const idx=registeredTags.indexOf(old);if(idx>=0)registeredTags[idx]=full;closeModal();renderPageBody()}
async function deleteTag(name){if(!confirm('태그를 삭제할까요?'))return;await delRaw(STORES.TAGS,name);registeredTags=registeredTags.filter(x=>x!==name);registeredMeta=registeredMeta.filter(x=>x.name!==name);for(const x of items){if(x.tags?.includes(name)){x.tags=x.tags.filter(t=>t!==name);await putBookmark(x)}}closeModal();render()}
function newProfile(){modal('새 프로필',`<div class="form"><label>이름<input id="prName"></label><label>Series<input id="prSeries"></label><label>태그<input id="prTags"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createProfile()">추가</button>`)}
async function createProfile(){const name=document.getElementById('prName').value.trim();if(!name)return;const tags=document.getElementById('prTags').value.split(',').map(s=>s.trim()).filter(Boolean);const full=`profile:${name}`;await registerTag(full,'profile',{name,series:document.getElementById('prSeries').value.trim(),tags});closeModal();renderPageBody()}
function editProfile(name){const r=registeredMeta.find(x=>x.name===name);if(!r)return;modal('프로필 편집',`<div class="form"><label>이름<input id="epn" value="${esc(r.profile?.name||tagLabel(name))}"></label><label>Series<input id="eps" value="${esc(r.profile?.series||'')}"></label><label>태그<input id="ept" value="${esc((r.profile?.tags||[]).join(', '))}"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveProfile('${esc(name)}')">저장</button>`)}
async function saveProfile(name){const r=registeredMeta.find(x=>x.name===name);if(!r)return;r.profile={name:document.getElementById('epn').value.trim(),series:document.getElementById('eps').value.trim(),tags:document.getElementById('ept').value.split(',').map(s=>s.trim()).filter(Boolean)};await putRaw(STORES.TAGS,r);closeModal();renderPageBody()}
function bulkTagPrompt(){const a=scopedItems();if(!a.length){alert('대상 북마크가 없습니다.');return}modal('일괄 태그',`<div class="form"><div class="subtle">현재 Page의 ${a.length}개 북마크에 적용합니다.</div><label>태그<input id="bulkTag"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulkTag()">적용</button>`)}
async function applyBulkTag(){const ts=document.getElementById('bulkTag').value.split(',').map(s=>s.trim()).filter(Boolean);for(const t of ts)await registerTag(t,tagKind(t));for(const x of scopedItems()){x.tags=[...new Set([...(x.tags||[]),...ts])];x.updatedAt=Date.now();await putBookmark(x)}items=await all(STORES.BOOKMARKS);items=items.map(decodeBookmark);closeModal();renderPageBody()}
function bulkCharacterPrompt(){const a=scopedItems();if(!a.length){alert('대상 북마크가 없습니다.');return}modal('일괄 캐릭터',`<div class="form"><div class="subtle">현재 Page의 ${a.length}개 북마크에 적용합니다.</div><label>캐릭터<input id="bulkChar"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulkCharacter()">적용</button>`)}
async function applyBulkCharacter(){const ns=document.getElementById('bulkChar').value.split(',').map(s=>s.trim()).filter(Boolean);for(const x of scopedItems()){x.characters=[...(x.characters||[])];for(const n of ns)if(!x.characters.some(c=>c.name===n))x.characters.push({name:n,role:'character',gender:'male',tags:[]});x.updatedAt=Date.now();await putBookmark(x)}items=await all(STORES.BOOKMARKS);items=items.map(decodeBookmark);closeModal();renderPageBody()}
function filterTagsView(q){const root=document.getElementById('tagView');if(!root)return;const l=q.toLowerCase();root.querySelectorAll('.tag-head').forEach(h=>{let any=false;h.querySelectorAll('.chip').forEach(c=>{const yes=c.textContent.toLowerCase().includes(l);c.classList.toggle('hidden',!yes);if(yes)any=true});h.classList.toggle('hidden',!any)})}
function filterProfilesView(q){const root=document.getElementById('profileView');if(!root)return;const l=q.toLowerCase();root.querySelectorAll('.profile-card').forEach(c=>c.classList.toggle('hidden',!c.textContent.toLowerCase().includes(l)))}
function exportData(){backupDownload()}
async function backupDownload(){const data={version:VERSION,exportedAt:new Date().toISOString(),categories,bookmarks:items,folders,registeredTags:registeredMeta,uiState:state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tagmark-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){const inp=document.createElement('input');inp.type='file';inp.accept='.json,.txt';inp.onchange=async()=>{const f=inp.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());for(const c of data.categories||[])await putRaw(STORES.CATEGORIES,c);for(const x of data.bookmarks||[])await putBookmark(x);for(const f2 of data.folders||[])await putRaw(STORES.FOLDERS,f2);for(const t of data.registeredTags||[])await putRaw(STORES.TAGS,t);categories=await all(STORES.CATEGORIES);items=(await all(STORES.BOOKMARKS)).map(decodeBookmark);folders=await all(STORES.FOLDERS);registeredMeta=await all(STORES.TAGS);registeredTags=registeredMeta.map(x=>x.name);alert('가져오기가 완료되었습니다.');render()}catch(e){alert('가져오기에 실패했습니다.\n'+(e.message||e))}};inp.click()}
function init(){loadData().then(render).catch(e=>{console.error(e);document.getElementById('app').innerHTML=`<div style="padding:30px"><h2>로컬 DB를 열 수 없습니다.</h2><p>${esc(e.message||e)}</p></div>`})}
init();
</script></body></html>
