<style>
:root{--bg:#f4f6fa;--panel:#fff;--line:#dfe4ec;--text:#17202b;--muted:#6d7785;--accent:#315efb;--danger:#d64545;--side:#111827;--side2:#26344d;--shadow:0 8px 24px #17202b12}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;color:var(--text);min-height:38px}button:hover{background:#f1f4f9}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:var(--danger)}.iconbtn{padding:7px 9px;min-width:38px}.app{display:flex;height:100dvh;overflow:hidden}.sidebar{width:250px;flex:0 0 250px;background:var(--side);color:#fff;padding:18px;display:flex;flex-direction:column;gap:12px;z-index:20}.brand{font-weight:800;font-size:19px}.version{font-size:11px;color:#9ca3af;margin-top:-8px}.side-actions{display:flex;gap:7px}.side-actions button{flex:1}.page-list{overflow:auto;display:flex;flex-direction:column;gap:5px}.page-item{padding:10px;border-radius:9px;cursor:pointer;color:#d1d5db;display:flex;align-items:center;gap:8px}.page-item.active{background:var(--side2);color:#fff}.page-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{flex:1;display:flex;flex-direction:column;min-width:0}.topbar{min-height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 18px}.topbar input{flex:1;min-width:0;max-width:520px;padding:10px 12px;border:1px solid var(--line);border-radius:9px}.content{padding:20px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.head h1{margin:0 0 4px}.muted{color:var(--muted);font-size:13px}.actions,.toolbar,.tabs,.pill-row{display:flex;gap:7px;flex-wrap:wrap}.tabs{border-bottom:1px solid var(--line);margin:18px 0 14px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:0;border-radius:8px 8px 0 0;background:transparent;padding:11px 14px;color:var(--muted);white-space:nowrap}.tab.active{color:var(--accent);background:#fff;border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px}.toolbar{align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{padding:9px;border:1px solid var(--line);border-radius:8px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.cards.list{display:flex;flex-direction:column}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;box-shadow:0 1px 2px #00000006}.card.selected{outline:2px solid #315efb55;background:#f7f9ff}.card h3{margin:0 42px 8px 0;font-size:16px;word-break:break-word}.card .field{margin-top:9px;word-break:break-word}.field-name{font-size:11px;color:var(--muted);margin-bottom:3px}.card-actions{position:absolute;right:10px;top:9px;display:flex;gap:4px}.card-actions button{padding:4px 7px;min-height:30px}.empty{padding:45px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:#eef1f6;font-size:12px;margin:2px}.link{color:var(--accent);text-decoration:none}.link:hover{text-decoration:underline}.main-pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.main-pages.list{display:flex;flex-direction:column}.page-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;cursor:pointer;position:relative;box-shadow:var(--shadow)}.page-card h3{margin:5px 0;word-break:break-word}.page-card .pc-actions{position:absolute;right:10px;top:10px;display:flex;gap:4px}.stat{font-size:12px;color:var(--muted)}.section{margin-top:16px}.notice{padding:10px 12px;border-radius:9px;background:#eef3ff;color:#2949a6;font-size:13px}.modal-back{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px;z-index:1000}.modal{width:min(980px,100%);max-height:92dvh;overflow:auto;background:#fff;border-radius:15px;padding:20px;box-shadow:0 20px 60px #0004}.modal h2{margin:0 0 15px}.form{display:grid;gap:11px}.form label{font-size:13px;font-weight:650}.form input,.form textarea,.form select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.form textarea{min-height:100px;resize:vertical}.modal-footer{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.schema-row{display:grid;grid-template-columns:1.15fr 1fr 70px 60px auto;gap:7px;align-items:center;margin:7px 0}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}.list-box{max-height:310px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}.subtle{font-size:12px;color:var(--muted)}.hidden{display:none!important}.selectbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:12px}.selectbar .count{font-weight:700}.color-dot{width:13px;height:13px;border-radius:50%;display:inline-block;border:1px solid #0002;vertical-align:-2px}.tag-heads{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.tag-head{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.tag-head-title{font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.entity-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;position:relative}.entity-card h3{margin:0 70px 8px 0}.folder-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}.folder-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.mobile-menu{display:none}.schema-help{padding:10px 12px;background:#f7f9fc;border:1px solid var(--line);border-radius:9px;margin-bottom:12px;font-size:13px}.dangerbox{padding:10px 12px;background:#fff4f4;border:1px solid #f0caca;border-radius:9px}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field-row{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.field-row-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.small{font-size:12px}.preview{padding:12px;border:1px dashed var(--line);border-radius:9px;background:#fafbfc}
@media(max-width:760px){.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .18s;width:min(300px,88vw);box-shadow:20px 0 50px #0005}.sidebar.open{transform:translateX(0)}.mobile-menu{display:block}.topbar{padding:9px 10px;gap:6px}.topbar input{order:2}.content{padding:12px}.head{gap:8px}.head .actions{width:100%}.head .actions button{flex:1}.cards{grid-template-columns:1fr}.main-pages{grid-template-columns:1fr}.grid2,.settings-grid{grid-template-columns:1fr}.modal{padding:16px;border-radius:13px}.schema-row{grid-template-columns:1fr}.tabs{margin-top:12px}.toolbar>*{flex:1;min-width:120px}.toolbar input{min-width:160px}.page-card{min-height:110px}.modal-footer{position:sticky;bottom:0;background:#fff;padding-top:10px}.selectbar{position:sticky;top:0;z-index:5}.brand{font-size:18px}}
</style></head>
<body><div id="app"></div>
<script>
const VERSION="v2.04";
const DB_NAME="tagmark-schema-v204";
const DB_VERSION=1;
const STORE="app";
const FIELD_TYPES=[
 ['text','텍스트'],['long_text','장문'],['url','URL'],['number','숫자'],['boolean','체크'],['date','날짜'],['datetime','날짜·시간'],['duration','시간/기간'],['image','이미지 URL'],['color','색상'],['rating','평점'],
 ['tag','태그'],['tag[]','태그 다중'],['profile','프로필'],['profile[]','프로필 다중'],['category','카테고리'],['category[]','카테고리 다중'],['folder','폴더'],['folder[]','폴더 다중'],['relation','관계'],['relation[]','관계 다중'],['enum','선택'],['markdown','Markdown'],['json','JSON']
];
const uid=()=>crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36);
const clone=x=>JSON.parse(JSON.stringify(x));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let idb=null,db=null,state={pageId:null,tabId:null,search:'',selected:new Set(),selectMode:false};
const typeLabel=t=>Object.fromEntries(FIELD_TYPES)[t]||t;
function field(name,type,extra={}){return {id:uid(),name,type,required:false,visible:true,searchable:true,sortable:false,...extra}}
function defaultPageSchema(type){
 if(type==='bookmark')return [field('제목','text',{required:true,sortable:true}),field('URL','url',{required:true}),field('메모','long_text'),field('태그','tag[]'),field('프로필','profile[]'),field('카테고리','category[]'),field('폴더','folder')];
 if(type==='profile')return [field('이름','text',{required:true,sortable:true}),field('프로필 태그','tag',{visible:false}),field('설명','long_text'),field('웹사이트','url'),field('이미지','image'),field('태그','tag[]'),field('Note','long_text')];
 if(type==='folder')return [field('이름','text',{required:true}),field('설명','long_text'),field('상위 폴더','folder')];
 return [];
}
function makeTab(name,type,baseSchema){return {id:uid(),name,type,icon:type==='bookmark'?'🔖':type==='tag'?'🏷️':type==='profile'?'👤':'📄',layout:'grid',sort:'asc',sortField:'',search:true,filter:{},schema:clone(baseSchema||[]),schemaMode:'independent'}}
function makePage(name){
 const schemas={bookmark:defaultPageSchema('bookmark'),profile:defaultPageSchema('profile'),folder:defaultPageSchema('folder')};
 return {id:uid(),name:name||'새 Page',description:'',icon:'📁',ui:{layout:'grid',sort:'asc'},schemas,tabs:[makeTab('북마크','bookmark',schemas.bookmark),makeTab('태그','tag',[]),makeTab('프로필','profile',schemas.profile)],data:{bookmarks:[],folders:[],tags:[],tagHeads:[],profiles:[],categories:[]}};
}
function blankDB(){const p=makePage('새 Page');return {schemaVersion:2,appVersion:VERSION,main:{layout:'grid',sort:'asc'},pages:[p],activePageId:p.id};}
function normalizeDB(x){
 if(!x||!Array.isArray(x.pages))return blankDB();
 if(!x.schemaVersion)x.schemaVersion=2;x.appVersion=VERSION;
 if(!x.main)x.main={layout:'grid',sort:'asc'};
 x.pages.forEach(p=>{
  p.id ||= uid();p.name ||= 'Page';p.description ||= '';p.ui ||= {layout:'grid',sort:'asc'};p.schemas ||= {bookmark:defaultPageSchema('bookmark'),profile:defaultPageSchema('profile'),folder:defaultPageSchema('folder')};
  p.data ||= {bookmarks:[],folders:[],tags:[],tagHeads:[],profiles:[],categories:[]};
  for(const k of ['bookmarks','folders','tags','tagHeads','profiles','categories'])p.data[k] ||= [];
  p.tabs ||= [];
  p.tabs.forEach(t=>{t.id ||= uid();t.name ||= 'Tab';t.type ||= 'custom';t.layout ||= 'grid';t.sort ||= 'asc';t.schema ||= [];t.schemaMode ||= 'independent';t.records ||= undefined;});
 });
 if(!x.pages.length){const p=makePage('새 Page');x.pages=[p];}
 x.activePageId ||= x.pages[0].id;return x;
}
function page(){return db.pages.find(p=>p.id===state.pageId)||db.pages[0]}
function currentTab(){return page()?.tabs.find(t=>t.id===state.tabId)||page()?.tabs[0]}
function openIDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('IndexedDB를 열 수 없습니다.'));})}
async function loadDB(){idb=await openIDB();const tx=idb.transaction(STORE,'readonly');const s=tx.objectStore(STORE);const row=await new Promise((res,rej)=>{const r=s.get('main');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});db=normalizeDB(row?.data||blankDB());state.pageId=db.activePageId||db.pages[0].id;state.tabId=page().tabs[0]?.id||null;}
async function saveDB(){db.appVersion=VERSION;db.activePageId=state.pageId;const tx=idb.transaction(STORE,'readwrite');tx.objectStore(STORE).put({id:'main',data:clone(db)});return new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error||new Error('저장 실패'));tx.onabort=()=>rej(tx.error||new Error('저장이 취소되었습니다.'));})}
function toast(msg){const e=document.createElement('div');e.textContent=msg;e.style='position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:2000;background:#111827;color:white;padding:10px 14px;border-radius:9px;box-shadow:0 8px 30px #0004;font-size:13px';document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function modal(title,body,footer=''){document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="modal"><div class="modal"><h2>${esc(title)}</h2>${body}<div class="modal-footer">${footer}</div></div></div>`)}
function closeModal(){document.getElementById('modal')?.remove()}
function render(){document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar" id="side"><div class="brand">Tagmark</div><div class="version">${VERSION} · 신형 Schema DB</div><div class="side-actions"><button onclick="newPage()">＋ Page</button><button onclick="goMain()">Main</button></div><div class="page-list">${db.pages.map(p=>`<div class="page-item ${p.id===state.pageId?'active':''}" onclick="openPage('${p.id}')"><span>${esc(p.icon||'📁')}</span><span class="page-name">${esc(p.name)}</span></div>`).join('')}</div><div style="margin-top:auto"><button style="width:100%" onclick="backup()">백업 / 복원</button></div></aside><main class="main"><div class="topbar"><button class="iconbtn mobile-menu" onclick="toggleSide()">☰</button><button onclick="goMain()">⌂</button><input placeholder="현재 페이지 검색" value="${esc(state.search)}" oninput="state.search=this.value;renderBody()"><button onclick="pageSettings()">⚙</button></div><div class="content" id="content"></div></main></div>`;renderBody()}
function toggleSide(){document.getElementById('side')?.classList.toggle('open')}
function goMain(){state.pageId=null;state.tabId=null;state.selected.clear();renderBody()}
function openPage(id){state.pageId=id;db.activePageId=id;state.tabId=page().tabs[0]?.id||null;state.search='';state.selected.clear();render();document.getElementById('side')?.classList.remove('open')}
function pageCard(p){const d=p.data;return `<article class="page-card" onclick="openPage('${p.id}')"><div class="pc-actions"><button onclick="event.stopPropagation();editPage('${p.id}')">✎</button><button class="danger" onclick="event.stopPropagation();deletePage('${p.id}')">×</button></div><div>${esc(p.icon||'📁')}</div><h3>${esc(p.name)}</h3><div class="muted">${esc(p.description||'')}</div><div class="stat">북마크 ${d.bookmarks.length} · 프로필 ${d.profiles.length} · 태그 ${d.tags.length}</div><div class="stat">탭 ${p.tabs.length}</div></article>`}
function mainView(){let ps=[...db.pages];ps.sort((a,b)=>db.main.sort==='asc'?a.name.localeCompare(b.name):b.name.localeCompare(a.name));return `<div class="head"><div><h1>Main Page</h1><div class="muted">Page를 독립적인 정보 공간으로 관리합니다.</div></div><div class="actions"><button class="primary" onclick="newPage()">＋ Page</button><button onclick="toggleMainLayout()">${db.main.layout==='grid'?'그리드':'목록'}</button><button onclick="toggleMainSort()">${db.main.sort==='asc'?'A→Z':'Z→A'}</button></div></div><div class="main-pages ${db.main.layout==='list'?'list':''}" style="margin-top:16px">${ps.map(pageCard).join('')||'<div class="empty">Page가 없습니다.</div>'}</div>`}
async function toggleMainLayout(){db.main.layout=db.main.layout==='grid'?'list':'grid';await saveDB();renderBody()}
async function toggleMainSort(){db.main.sort=db.main.sort==='asc'?'desc':'asc';await saveDB();renderBody()}
function renderBody(){const c=document.getElementById('content');if(!c)return;if(!state.pageId){c.innerHTML=mainView();return}const p=page();let tabs=p.tabs;const t=currentTab()||tabs[0];if(!state.tabId&&t)state.tabId=t.id;c.innerHTML=`<div class="head"><div><h1>${esc(p.icon||'📁')} ${esc(p.name)}</h1><div class="muted">${esc(p.description||'')}</div></div><div class="actions"><button onclick="editPage('${p.id}')">페이지 편집</button><button onclick="tabSettings()">탭 설정</button><button class="primary" onclick="newTab()">＋ 탭</button></div></div><div class="tabs">${tabs.map(x=>`<button class="tab ${x.id===state.tabId?'active':''}" onclick="openTab('${x.id}')">${esc(x.icon||'📄')} ${esc(x.name)}</button>`).join('')}</div>${t?tabView(t):'<div class="empty">탭이 없습니다.</div>'}`}
function openTab(id){state.tabId=id;state.selected.clear();renderBody()}
function toggleTabLayout(t){t.layout=t.layout==='grid'?'list':'grid';saveDB().then(renderBody)}
function toolbar(t,selection=true){return `<div class="toolbar"><input placeholder="${t.search===false?'검색 비활성화':'검색'}" value="${esc(state.search)}" oninput="state.search=this.value;renderBody()"><button onclick="toggleTabLayout(currentTab())">${t.layout==='grid'?'그리드':'목록'}</button><button onclick="toggleTabSort(currentTab())">${t.sort==='asc'?'A→Z':'Z→A'}</button>${selection?`<button onclick="toggleSelectMode()">${state.selectMode?'선택 종료':'선택'}</button>`:''}</div>`}
async function toggleTabSort(t){t.sort=t.sort==='asc'?'desc':'asc';await saveDB();renderBody()}
function tabView(t){if(t.type==='tag')return tagView(t);if(t.type==='profile')return profileView(t);if(t.type==='category')return categoryView(t);if(t.type==='folder')return folderView(t);if(t.type==='bookmark')return recordView(t,'bookmark');return recordView(t,'custom')}
function recordArray(t){return t.type==='bookmark'?page().data.bookmarks:[]}
function titleForRecord(r,t){const f=t.schema.find(f=>f.id===t.titleField)||t.schema.find(f=>f.required)||t.schema[0];return f?displayValue(r.data?.[f.id],f.type):'기록'}
function displayValue(v,type){if(v===undefined||v===null||v==='')return '<span class="subtle">—</span>';if(type.endsWith('[]')&&Array.isArray(v))return v.map(x=>displayValue(x,type.slice(0,-2))).join(' ');if(type==='url')return `<a class="link" href="${esc(v)}" target="_blank" rel="noopener">열기</a>`;if(type==='boolean')return v?'✓':'—';if(type==='duration')return esc(v);if(type==='tag'||type==='profile'||type==='category'||type==='folder'||type==='relation')return `<span class="chip">${esc(resolveRef(v,type))}</span>`;if(type==='color')return `<span class="color-dot" style="background:${esc(v)}"></span>`;return esc(v).replace(/\n/g,'<br>')}
function resolveRef(id,type){const p=page();if(type==='tag')return p.data.tags.find(x=>x.id===id)?.name||id;if(type==='profile')return p.data.profiles.find(x=>x.id===id)?.name||id;if(type==='category')return p.data.categories.find(x=>x.id===id)?.name||id;if(type==='folder')return p.data.folders.find(x=>x.id===id)?.name||id;return id}
function recordView(t,type){let arr=recordArray(t);const q=state.search.trim().toLowerCase();if(q&&t.search!==false)arr=arr.filter(r=>t.schema.some(f=>String(r.data?.[f.id]??'').toLowerCase().includes(q)));arr=[...arr];const sf=t.schema.find(f=>f.id===t.sortField)||t.schema.find(f=>f.sortable)||t.schema[0];arr.sort((a,b)=>{const av=String(a.data?.[sf?.id]??''),bv=String(b.data?.[sf?.id]??'');return t.sort==='asc'?av.localeCompare(bv):bv.localeCompare(av)});return `${toolbar(t)}${state.selectMode?selectBar(t,arr):''}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newRecord('${t.id}')">＋ ${t.type==='bookmark'?'북마크':'기록'}</button><button onclick="schemaEditor('${t.id}')">필드 편집</button></div><div class="cards ${t.layout==='list'?'list':''}">${arr.map(r=>recordCard(r,t)).join('')||'<div class="empty">저장된 정보가 없습니다.</div>'}</div>`}
function selectBar(t,arr){return `<div class="selectbar"><span class="count">${state.selected.size}개 선택</span><button onclick="selectAllVisible()">전체 선택</button><button onclick="clearSelection()">해제</button><button onclick="bulkTags()">태그</button><button onclick="bulkProfiles()">프로필</button><button onclick="bulkFolders()">폴더</button><button class="danger" onclick="bulkDelete()">삭제</button></div>`}
function recordCard(r,t){const title=titleForRecord(r,t);return `<article class="card ${state.selected.has(r.id)?'selected':''}"><div class="card-actions">${state.selectMode?`<button onclick="toggleSelect('${r.id}')">${state.selected.has(r.id)?'✓':'○'}</button>`:''}<button onclick="editRecord('${t.id}','${r.id}')">✎</button><button class="danger" onclick="deleteRecord('${t.id}','${r.id}')">×</button></div><h3>${esc(stripHTML(title))}</h3>${t.schema.filter(f=>f.visible!==false&&f.id!==((t.schema.find(f=>f.id===t.titleField)||t.schema[0])?.id)).slice(0,8).map(f=>`<div class="field"><div class="field-name">${esc(f.name)}</div><div>${displayValue(r.data?.[f.id],f.type)}</div></div>`).join('')}</article>`}
function stripHTML(s){const d=document.createElement('div');d.innerHTML=s;return d.textContent||d.innerText||''}
function fieldInput(f,value,extra=''){let v=value??'';if(f.type==='long_text'||f.type==='markdown'||f.type==='json')return `<label>${esc(f.name)}${f.required?' *':''}<textarea data-field="${f.id}" ${extra}>${esc(typeof v==='object'?JSON.stringify(v):v)}</textarea></label>`;if(f.type==='boolean')return `<label class="check"><input type="checkbox" data-field="${f.id}" ${v?'checked':''}> ${esc(f.name)}</label>`;if(['tag','tag[]','profile','profile[]','category','category[]','folder','folder[]'].includes(f.type))return relationInput(f,v,extra);let type=f.type==='duration'?'time':f.type==='image'?'url':f.type==='color'?'color':f.type==='number'||f.type==='rating'?'number':f.type==='date'?'date':f.type==='datetime'?'datetime-local':f.type==='url'?'url':'text';return `<label>${esc(f.name)}${f.required?' *':''}<input type="${type}" data-field="${f.id}" value="${esc(v)}" ${extra} ${f.type==='rating'?'min="0" max="5" step="0.5"':''}></label>`}
function relationInput(f,value,extra=''){const p=page();let source=[];if(f.type.startsWith('tag'))source=p.data.tags.map(x=>[x.id,x.name]);if(f.type.startsWith('profile'))source=p.data.profiles.map(x=>[x.id,x.name]);if(f.type.startsWith('category'))source=p.data.categories.map(x=>[x.id,x.name]);if(f.type.startsWith('folder'))source=p.data.folders.map(x=>[x.id,x.name]);const multi=f.type.endsWith('[]'),vals=multi?(Array.isArray(value)?value:[]):[value];return `<label>${esc(f.name)}${f.required?' *':''}<select data-field="${f.id}" ${multi?'multiple':''} ${extra}>${multi?'':`<option value="">선택 안 함</option>`}${source.map(([id,name])=>`<option value="${esc(id)}" ${vals.includes(id)?'selected':''}>${esc(name)}</option>`).join('')}</select></label>`}
function readForm(schema){const data={};for(const f of schema){const e=document.querySelector(`[data-field="${f.id}"]`);if(!e)continue;if(f.type==='boolean')data[f.id]=e.checked;else if(f.type.endsWith('[]'))data[f.id]=[...e.selectedOptions].map(o=>o.value);else if(f.type==='number'||f.type==='rating')data[f.id]=e.value===''?'':Number(e.value);else if(f.type==='json'){try{data[f.id]=e.value?JSON.parse(e.value):null}catch{data[f.id]=e.value}}else data[f.id]=e.value}return data}
function newRecord(tabId){openRecordModal(tabId,null)}
function editRecord(tabId,id){openRecordModal(tabId,id)}
function openRecordModal(tabId,id){const t=page().tabs.find(x=>x.id===tabId);const arr=recordArray(t);const r=id?arr.find(x=>x.id===id):{id:uid(),data:{}};modal(id?'정보 편집':'새 정보',`<div class="form">${t.schema.map(f=>fieldInput(f,r.data?.[f.id])).join('')}</div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveRecord('${tabId}','${r.id}',${!!id})">저장</button>`)}
async function saveRecord(tabId,id,editing){const t=page().tabs.find(x=>x.id===tabId),arr=recordArray(t),data=readForm(t.schema);for(const f of t.schema)if(f.required&&(data[f.id]===undefined||data[f.id]===''||(Array.isArray(data[f.id])&&!data[f.id].length))){toast(`필수 항목을 입력하세요: ${f.name}`);return}let r=editing?arr.find(x=>x.id===id):{id,data:{}};r.data=data;if(!editing)arr.push(r);await saveDB();closeModal();renderBody()}
async function deleteRecord(tabId,id){if(!confirm('이 정보를 삭제할까요?'))return;const t=page().tabs.find(x=>x.id===tabId);const arr=recordArray(t);if(t.type==='bookmark')page().data.bookmarks=arr.filter(x=>x.id!==id);await saveDB();renderBody()}
function tagView(t){const p=page();const q=state.search.trim().toLowerCase();const tags=p.data.tags.filter(x=>!q||x.name.toLowerCase().includes(q));return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newTagHead()">＋ 태그 머리</button><button onclick="newTag()">＋ 태그</button></div><div class="tag-heads">${p.data.tagHeads.map(h=>`<article class="tag-head"><div class="tag-head-title"><span><span class="color-dot" style="background:${esc(h.color||'#999')}"></span> ${esc(h.name)}</span><span><button onclick="editTagHead('${h.id}')">✎</button><button class="danger" onclick="deleteTagHead('${h.id}')">×</button></span></div>${tags.filter(x=>x.tagHeadId===h.id).map(x=>`<div class="tree-row"><span><span class="color-dot" style="background:${esc(x.color||h.color||'#999')}"></span> ${esc(x.name)}${x.profileId?' · 프로필':''}</span><button onclick="editTag('${x.id}')">✎</button></div>`).join('')||'<div class="subtle">태그 없음</div>'}</article>`).join('')||'<div class="empty">태그 머리가 없습니다.</div>'}</div><div class="section"><h3>전체 태그</h3><div class="pill-row">${tags.map(x=>`<span class="chip"><span class="color-dot" style="background:${esc(x.color||'#999')}"></span>${esc(x.name)}</span>`).join('')||'<span class="subtle">태그 없음</span>'}</div></div>`}
function profileView(t){const p=page();const q=state.search.trim().toLowerCase();let arr=p.data.profiles.filter(x=>!q||JSON.stringify(x.data).toLowerCase().includes(q));return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newProfile()">＋ 프로필</button><button onclick="schemaEditor('${t.id}')">필드 편집</button></div><div class="entity-grid">${arr.map(x=>profileCard(x,t)).join('')||'<div class="empty">프로필이 없습니다.</div>'}</div>`}
function profileCard(x,t){const nameField=t.schema.find(f=>f.name==='이름')||t.schema[0];const name=x.data?.[nameField?.id]||'프로필';return `<article class="entity-card"><div class="card-actions"><button onclick="editProfile('${x.id}')">✎</button><button class="danger" onclick="deleteProfile('${x.id}')">×</button></div><h3>${esc(name)}</h3>${t.schema.filter(f=>f.visible!==false&&f.id!==nameField?.id).slice(0,7).map(f=>`<div class="field"><div class="field-name">${esc(f.name)}</div><div>${displayValue(x.data?.[f.id],f.type)}</div></div>`).join('')}</article>`}
function profileFieldSchema(t){return t.schema}
function newProfile(){openProfileModal(null)}function editProfile(id){openProfileModal(id)}
function openProfileModal(id){const p=page(),t=p.tabs.find(x=>x.type==='profile'),x=id?p.data.profiles.find(x=>x.id===id):{id:uid(),data:{}};if(!t){toast('프로필 탭이 없습니다.');return}modal(id?'프로필 편집':'새 프로필',`<div class="form">${t.schema.map(f=>fieldInput(f,x.data?.[f.id])).join('')}</div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveProfile('${x.id}',${!!id})">저장</button>`)}
async function saveProfile(id,editing){const p=page(),t=p.tabs.find(x=>x.type==='profile'),data=readForm(t.schema);const nf=t.schema.find(f=>f.name==='이름')||t.schema[0];if(nf&&(!data[nf.id]||!String(data[nf.id]).trim())){toast('프로필 이름을 입력하세요.');return}let x=editing?p.data.profiles.find(x=>x.id===id):{id,data:{}};x.data=data;let name=String(data[nf.id]||'').trim();x.name=name;if(!editing)p.data.profiles.push(x);syncProfileTag(x);await saveDB();closeModal();renderBody()}
function syncProfileTag(profile){const p=page();const existing=p.data.tags.find(t=>t.profileId===profile.id);const name=profile.name;if(existing){existing.name=name}else{p.data.tags.push({id:uid(),name,profileId:profile.id,tagHeadId:'',color:'#7c5cff'})} }
async function deleteProfile(id){if(!confirm('프로필을 삭제할까요? 프로필 태그도 함께 삭제하고 연결된 필드에서는 참조를 제거합니다.'))return;const p=page();p.data.profiles=p.data.profiles.filter(x=>x.id!==id);p.data.tags=p.data.tags.filter(x=>x.profileId!==id);for(const t of p.tabs)for(const r of (t.type==='bookmark'?p.data.bookmarks:[])){for(const f of t.schema.filter(f=>f.type==='profile'||f.type==='profile[]')){const v=r.data[f.id];if(Array.isArray(v))r.data[f.id]=v.filter(x=>x!==id);else if(v===id)r.data[f.id]=''}}await saveDB();renderBody()}
function categoryView(t){const p=page();return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newCategory()">＋ 카테고리</button></div><div class="entity-grid">${p.data.categories.map(x=>`<article class="entity-card"><div class="card-actions"><button onclick="editCategory('${x.id}')">✎</button><button class="danger" onclick="deleteCategory('${x.id}')">×</button></div><h3>${esc(x.name)}</h3><div class="subtle">${esc(x.description||'')}</div></article>`).join('')||'<div class="empty">카테고리가 없습니다.</div>'}</div>`}
function newCategory(){modal('새 카테고리',`<div class="form"><label>이름<input id="catName"></label><label>설명<textarea id="catDesc"></textarea></label><label>상위 카테고리<select id="catParent"><option value="">없음</option>${page().data.categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveCategory()">추가</button>`)}
function editCategory(id){const x=page().data.categories.find(x=>x.id===id);modal('카테고리 편집',`<div class="form"><label>이름<input id="catName" value="${esc(x.name)}"></label><label>설명<textarea id="catDesc">${esc(x.description||'')}</textarea></label><label>상위 카테고리<select id="catParent"><option value="">없음</option>${page().data.categories.filter(c=>c.id!==id).map(c=>`<option value="${c.id}" ${x.parentId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>`,`<button class="danger" onclick="deleteCategory('${id}')">삭제</button><button onclick="closeModal()">취소</button><button class="primary" onclick="saveCategory('${id}')">저장</button>`)}
async function saveCategory(id){const p=page(),x=id?p.data.categories.find(x=>x.id===id):{id:uid()};x.name=document.getElementById('catName').value.trim();x.description=document.getElementById('catDesc').value;x.parentId=document.getElementById('catParent').value;if(!x.name)return toast('이름을 입력하세요.');if(!id)p.data.categories.push(x);await saveDB();closeModal();renderBody()}
async function deleteCategory(id){if(!confirm('카테고리를 삭제할까요? 연결된 필드의 참조도 제거됩니다.'))return;const p=page();p.data.categories=p.data.categories.filter(x=>x.id!==id);for(const t of p.tabs)for(const r of p.data.bookmarks)for(const f of t.schema.filter(f=>f.type==='category'||f.type==='category[]')){const v=r.data[f.id];if(Array.isArray(v))r.data[f.id]=v.filter(x=>x!==id);else if(v===id)r.data[f.id]=''}await saveDB();closeModal();renderBody()}
function folderView(t){const p=page();return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newFolder()">＋ 폴더</button></div>${p.data.folders.map(f=>{const n=p.data.bookmarks.filter(r=>Object.values(r.data||{}).some(v=>v===f.id||(Array.isArray(v)&&v.includes(f.id)))).length;return `<div class="folder-box"><div class="folder-head"><div><b>📁 ${esc(f.name)}</b><div class="subtle">${n}개 북마크</div></div><div><button onclick="editFolder('${f.id}')">✎</button><button class="danger" onclick="deleteFolder('${f.id}')">삭제</button></div></div><div class="subtle">${esc(f.description||'')}</div></div>`}).join('')||'<div class="empty">폴더가 없습니다.</div>'}`}
function newFolder(){openFolderModal(null)}function editFolder(id){openFolderModal(id)}
function openFolderModal(id){const p=page(),x=id?p.data.folders.find(x=>x.id===id):{id:uid(),data:{},name:''},schema=p.schemas.folder;modal(id?'폴더 편집':'새 폴더',`<div class="form"><label>이름<input id="folderName" value="${esc(x.name||x.data?.[schema[0]?.id]||'')}"></label><label>설명<textarea id="folderDesc">${esc(x.description||'')}</textarea></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveFolder('${x.id}',${!!id})">저장</button>`)}
async function saveFolder(id,editing){const p=page(),x=editing?p.data.folders.find(x=>x.id===id):{id,data:{}};x.name=document.getElementById('folderName').value.trim();x.description=document.getElementById('folderDesc').value;if(!x.name)return toast('폴더 이름을 입력하세요.');x.data=x.data||{};const nf=p.schemas.folder.find(f=>f.name==='이름')||p.schemas.folder[0];if(nf)x.data[nf.id]=x.name;if(!editing)p.data.folders.push(x);await saveDB();closeModal();renderBody()}
async function deleteFolder(id){if(!confirm('폴더를 삭제할까요? 북마크의 다른 정보는 유지됩니다.'))return;const p=page();p.data.folders=p.data.folders.filter(x=>x.id!==id);for(const t of p.tabs)for(const r of p.data.bookmarks)for(const f of t.schema.filter(f=>f.type==='folder'||f.type==='folder[]')){const v=r.data[f.id];if(Array.isArray(v))r.data[f.id]=v.filter(x=>x!==id);else if(v===id)r.data[f.id]=''}await saveDB();closeModal();renderBody()}
function newTagHead(){modal('새 태그 머리',`<div class="form"><label>이름<input id="thName"></label><label>색상<input id="thColor" type="color" value="#315efb"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveTagHead()">추가</button>`)}
function editTagHead(id){const x=page().data.tagHeads.find(x=>x.id===id);modal('태그 머리 편집',`<div class="form"><label>이름<input id="thName" value="${esc(x.name)}"></label><label>색상<input id="thColor" type="color" value="${esc(x.color||'#315efb')}"></label></div>`,`<button class="danger" onclick="deleteTagHead('${id}')">삭제</button><button onclick="closeModal()">취소</button><button class="primary" onclick="saveTagHead('${id}')">저장</button>`)}
async function saveTagHead(id){const p=page(),x=id?p.data.tagHeads.find(x=>x.id===id):{id:uid()};x.name=document.getElementById('thName').value.trim();x.color=document.getElementById('thColor').value;if(!x.name)return toast('이름을 입력하세요.');if(!id)p.data.tagHeads.push(x);await saveDB();closeModal();renderBody()}
async function deleteTagHead(id){if(!confirm('태그 머리를 삭제할까요? 태그 자체는 유지하고 머리 연결만 제거합니다.'))return;const p=page();p.data.tagHeads=p.data.tagHeads.filter(x=>x.id!==id);p.data.tags.forEach(t=>{if(t.tagHeadId===id)t.tagHeadId=''});await saveDB();closeModal();renderBody()}
function tagOptions(selected='',profileOnly=false){const p=page();return p.data.tags.filter(x=>profileOnly?x.profileId:!x.profileId).map(x=>`<option value="${x.id}" ${selected===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}
function newTag(){openTagModal(null)}function editTag(id){openTagModal(id)}
function openTagModal(id){const p=page(),x=id?p.data.tags.find(x=>x.id===id):{id:uid(),name:'',tagHeadId:'',color:'#7c8799',profileId:''};modal(id?'태그 편집':'새 태그',`<div class="form"><label>이름<input id="tagName" value="${esc(x.name)}"></label><label>태그 머리<select id="tagHead"><option value="">없음</option>${p.data.tagHeads.map(h=>`<option value="${h.id}" ${x.tagHeadId===h.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select></label><label>색상<input id="tagColor" type="color" value="${esc(x.color||'#7c8799')}"></label><div class="notice">프로필이 자동 생성한 프로필 태그는 여기서 일반 태그와 같은 방식으로 태그 머리/색상을 지정할 수 있습니다.</div></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveTag('${x.id}',${!!id})">저장</button>`)}
async function saveTag(id,editing){const p=page(),x=editing?p.data.tags.find(x=>x.id===id):{id:uid()};x.name=document.getElementById('tagName').value.trim();x.tagHeadId=document.getElementById('tagHead').value;x.color=document.getElementById('tagColor').value;if(!x.name)return toast('이름을 입력하세요.');if(!editing)p.data.tags.push(x);await saveDB();closeModal();renderBody()}
async function bulkTags(){const t=currentTab();if(!state.selected.size)return;const f=t.schema.find(f=>f.type==='tag[]'||f.type==='tag');if(!f)return toast('현재 탭에 태그 필드가 없습니다.');modal('선택 항목에 태그 추가',`<div class="form"><label>태그<select id="bulkTag" multiple>${tagOptions()}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulk('tag')">적용</button>`)}
async function bulkProfiles(){const t=currentTab();if(!state.selected.size)return;const f=t.schema.find(f=>f.type==='profile[]'||f.type==='profile');if(!f)return toast('현재 탭에 프로필 필드가 없습니다.');modal('선택 항목에 프로필 추가',`<div class="form"><label>프로필<select id="bulkProfile" multiple>${page().data.profiles.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulk('profile')">적용</button>`)}
async function bulkFolders(){const t=currentTab();if(!state.selected.size)return;const f=t.schema.find(f=>f.type==='folder[]'||f.type==='folder');if(!f)return toast('현재 탭에 폴더 필드가 없습니다.');modal('선택 항목에 폴더 지정',`<div class="form"><label>폴더<select id="bulkFolder">${page().data.folders.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulk('folder')">적용</button>`)}
async function applyBulk(kind){const el=document.getElementById(kind==='tag'?'bulkTag':kind==='profile'?'bulkProfile':'bulkFolder');const ids=kind==='folder'?[el.value]:[...el.selectedOptions].map(x=>x.value);const t=currentTab();const f=t.schema.find(f=>f.type===kind+'[]'||f.type===kind);for(const r of page().data.bookmarks.filter(r=>state.selected.has(r.id))){if(f.type.endsWith('[]'))r.data[f.id]=[...new Set([...(Array.isArray(r.data[f.id])?r.data[f.id]:[]),...ids])];else r.data[f.id]=ids[0]||''}await saveDB();state.selected.clear();state.selectMode=false;closeModal();renderBody()}
async function bulkDelete(){if(!state.selected.size||!confirm(`${state.selected.size}개 북마크를 삭제할까요?`))return;page().data.bookmarks=page().data.bookmarks.filter(r=>!state.selected.has(r.id));state.selected.clear();state.selectMode=false;await saveDB();renderBody()}
function toggleSelectMode(){state.selectMode=!state.selectMode;state.selected.clear();renderBody()}function toggleSelect(id){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);renderBody()}function clearSelection(){state.selected.clear();renderBody()}function selectAllVisible(){const t=currentTab();const arr=recordArray(t);arr.forEach(r=>state.selected.add(r.id));renderBody()}

function newPage(){modal('새 Page',`<div class="form"><label>이름<input id="pageName" value="새 Page"></label><label>설명<textarea id="pageDesc"></textarea></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="savePage()">생성</button>`)}
function editPage(id){const p=db.pages.find(x=>x.id===id);modal('Page 편집',`<div class="form"><label>이름<input id="pageName" value="${esc(p.name)}"></label><label>설명<textarea id="pageDesc">${esc(p.description||'')}</textarea></label><label>아이콘<input id="pageIcon" value="${esc(p.icon||'📁')}"></label><div class="notice">Page는 실제 데이터를 소유하는 최상위 공간입니다. 탭은 이 Page의 데이터를 표시·편집하는 UI입니다.</div><div class="actions"><button onclick="pageSchemaEditor('bookmark')">북마크 기본 필드</button><button onclick="pageSchemaEditor('profile')">프로필 기본 필드</button><button onclick="pageSchemaEditor('folder')">폴더 기본 필드</button></div></div>`,`<button class="danger" onclick="deletePage('${id}')">삭제</button><button onclick="closeModal()">취소</button><button class="primary" onclick="savePage('${id}')">저장</button>`)}
async function savePage(id){if(id){const p=db.pages.find(x=>x.id===id);p.name=document.getElementById('pageName').value.trim()||p.name;p.description=document.getElementById('pageDesc').value;p.icon=document.getElementById('pageIcon').value||'📁'}else{const p=newPageObj(document.getElementById('pageName').value.trim(),document.getElementById('pageDesc').value);db.pages.push(p);state.pageId=p.id;state.tabId=p.tabs[0].id}await saveDB();closeModal();render()}
function newPageObj(name,desc){const p=makePage(name||'새 Page');p.description=desc||'';return p}
async function deletePage(id){const p=db.pages.find(x=>x.id===id);if(!p)return;if(db.pages.length<=1)return toast('마지막 Page는 삭제할 수 없습니다.');if(!confirm(`"${p.name}" Page를 삭제할까요? 이 Page의 모든 데이터가 삭제됩니다.`))return;db.pages=db.pages.filter(x=>x.id!==id);if(state.pageId===id){state.pageId=db.pages[0].id;state.tabId=db.pages[0].tabs[0]?.id||null}await saveDB();closeModal();render()}
function newTab(){openTabModal(null)}
function tabSettings(){if(state.tabId)openTabModal(state.tabId)}
function openTabModal(id){const p=page(),x=id?p.tabs.find(t=>t.id===id):{id:uid(),name:'새 탭',type:'custom',layout:'grid',sort:'asc',search:true,schema:[]};const types=[['bookmark','북마크'],['tag','태그'],['profile','프로필'],['category','카테고리'],['folder','폴더'],['custom','사용자 정의']];modal(id?'탭 설정':'새 탭',`<div class="form"><label>탭 이름<input id="tabName" value="${esc(x.name)}"></label><label>탭 유형<select id="tabType" ${id?'disabled':''}>${types.map(([v,n])=>`<option value="${v}" ${x.type===v?'selected':''}>${n}</option>`).join('')}</select></label><label class="check"><input id="tabSearch" type="checkbox" ${x.search!==false?'checked':''}> 검색 사용</label><label class="check"><input id="tabGrid" type="checkbox" ${x.layout==='grid'?'checked':''}> 그리드 기본</label><div class="notice">같은 유형의 탭은 여러 개 만들 수 있습니다. 단, 북마크 탭은 Page당 하나만 만들 수 있습니다.</div></div>`,`<button class="danger" onclick="deleteTab('${x.id}')" ${id?'':'style="display:none"'}>탭 삭제</button><button onclick="closeModal()">취소</button><button class="primary" onclick="saveTab('${x.id}',${!!id})">저장</button>`)}
async function saveTab(id,editing){const p=page(),type=document.getElementById('tabType').value,name=document.getElementById('tabName').value.trim()||'새 탭';if(type==='bookmark'&&p.tabs.some(t=>t.type==='bookmark'&&t.id!==id))return toast('한 Page에는 북마크 탭을 하나만 만들 수 있습니다.');let x=editing?p.tabs.find(t=>t.id===id):{id:uid(),name,type,icon:type==='bookmark'?'🔖':type==='tag'?'🏷️':type==='profile'?'👤':type==='category'?'🗂️':type==='folder'?'📁':'📄',layout:'grid',sort:'asc',search:true,schema:[]};x.name=name;x.search=document.getElementById('tabSearch').checked;x.layout=document.getElementById('tabGrid').checked?'grid':'list';if(!editing){const base=type==='bookmark'||type==='profile'||type==='folder'?p.schemas[type]:[];x.schema=clone(base);p.tabs.push(x);state.tabId=x.id}else{if(['bookmark','profile','folder'].includes(x.type)&&x.schema.length===0)x.schema=clone(p.schemas[x.type])}await saveDB();closeModal();renderBody()}
async function deleteTab(id){const p=page(),x=p.tabs.find(t=>t.id===id);if(!x)return;if(!confirm(`"${x.name}" 탭을 삭제할까요? 실제 Page 데이터는 삭제되지 않습니다.`))return;p.tabs=p.tabs.filter(t=>t.id!==id);state.tabId=p.tabs[0]?.id||null;await saveDB();closeModal();renderBody()}
function schemaEditor(tabId){const p=page(),t=p.tabs.find(x=>x.id===tabId);if(!t)return;let rows=t.schema.map(f=>schemaRow(f)).join('');modal(`${esc(t.name)} · 필드 편집`,`<div class="schema-help">이 편집기는 <b>이 탭이 어떤 정보를 저장하고 표시할지</b>를 정합니다. Page의 기본 Schema와 별개로 탭마다 독립적으로 수정됩니다. 필드를 삭제해도 기존 데이터는 즉시 지우지 않고 필드 정의만 제거합니다.</div><div id="schemaRows">${rows}</div><button onclick="addSchemaRow()">＋ 필드 추가</button><div class="preview" style="margin-top:12px">필드 유형은 텍스트·장문·URL·숫자·날짜·시간/기간·태그·프로필·카테고리·폴더·선택 등으로 확장할 수 있습니다.</div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveSchema('${tabId}')">저장</button>`)}
function schemaRow(f){return `<div class="schema-row" data-row="${f.id}"><input class="sf-name" value="${esc(f.name)}" placeholder="필드 이름"><select class="sf-type">${FIELD_TYPES.map(([v,n])=>`<option value="${v}" ${f.type===v?'selected':''}>${n}</option>`).join('')}</select><label class="check small"><input class="sf-req" type="checkbox" ${f.required?'checked':''}>필수</label><label class="check small"><input class="sf-vis" type="checkbox" ${f.visible!==false?'checked':''}>표시</label><button class="danger" onclick="this.parentElement.remove()">×</button></div>`}
function addSchemaRow(){const id=uid();document.getElementById('schemaRows').insertAdjacentHTML('beforeend',schemaRow(field('새 필드','text')))}
async function saveSchema(tabId){const t=page().tabs.find(x=>x.id===tabId),rows=[...document.querySelectorAll('#schemaRows .schema-row')];t.schema=rows.map(row=>{const old=t.schema.find(f=>f.id===row.dataset.row)||field('새 필드','text');old.name=row.querySelector('.sf-name').value.trim()||'필드';old.type=row.querySelector('.sf-type').value;old.required=row.querySelector('.sf-req').checked;old.visible=row.querySelector('.sf-vis').checked;return old});if(!t.schema.length)return toast('최소 한 개의 필드가 필요합니다.');if(!t.schema.find(f=>f.required))t.schema[0].required=true;await saveDB();closeModal();renderBody()}
function pageSchemaEditor(kind){const p=page(),fields=p.schemas[kind]||[];modal(`Page 기본 Schema · ${kind}`,`<div class="schema-help">이 Schema는 새 ${kind} 탭을 만들 때의 기본값입니다. 이미 만들어진 탭의 Schema는 독립적으로 유지됩니다.</div><div id="pageSchemaRows">${fields.map(f=>schemaRow(f)).join('')}</div><button onclick="addPageSchemaRow('${kind}')">＋ 필드 추가</button>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="savePageSchema('${kind}')">저장</button>`)}
function addPageSchemaRow(){document.getElementById('pageSchemaRows').insertAdjacentHTML('beforeend',schemaRow(field('새 필드','text')))}
async function savePageSchema(kind){const p=page(),rows=[...document.querySelectorAll('#pageSchemaRows .schema-row')];p.schemas[kind]=rows.map(row=>{const old=p.schemas[kind]?.find(f=>f.id===row.dataset.row)||field('새 필드','text');old.name=row.querySelector('.sf-name').value.trim()||'필드';old.type=row.querySelector('.sf-type').value;old.required=row.querySelector('.sf-req').checked;old.visible=row.querySelector('.sf-vis').checked;return old});await saveDB();closeModal();renderBody()}
function backup(){modal('백업 / 복원',`<div class="form"><div class="notice">현재 v2.04 신형 Schema DB만 백업/복원합니다. 구형 DB를 읽거나 변환하지 않습니다.</div><button onclick="exportDB()">JSON 백업 내보내기</button><button onclick="importDB()">JSON 백업 가져오기</button><button class="danger" onclick="resetDB()">현재 DB 초기화</button></div>`,`<button onclick="closeModal()">닫기</button>`)}
function exportDB(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tagmark-v2.04-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importDB(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||!Array.isArray(x.pages))throw new Error('Tagmark 신형 백업 형식이 아닙니다.');db=normalizeDB(x);state.pageId=db.pages[0].id;state.tabId=db.pages[0].tabs[0]?.id||null;await saveDB();closeModal();render();toast('복원이 완료되었습니다.')}catch(e){toast('가져오기 실패: '+e.message)}};i.click()}
async function resetDB(){if(!confirm('현재 로컬 DB를 완전히 초기화할까요?'))return;db=blankDB();state.pageId=db.pages[0].id;state.tabId=db.pages[0].tabs[0].id;state.selected.clear();await saveDB();closeModal();render()}
async function init(){try{await loadDB();render()}catch(e){console.error(e);document.getElementById('app').innerHTML=`<div style="padding:30px"><h2>신형 로컬 DB를 열 수 없습니다.</h2><p>${esc(e.message||e)}</p><p class="muted">IndexedDB가 차단된 비공개 브라우징/콘텐츠 환경인지 확인해 주세요.</p></div>`}}
init();
</script></body></html>
