function renderRelationResults(fieldId,q){const box=document.querySelector(`[data-rel-picker="${fieldId}"]`);if(!box)return;const f=currentTab()?.schema.find(x=>x.id===fieldId);if(!f)return;const vals=relationValues(fieldId),low=(q||'').trim().toLowerCase(),multi=box.dataset.multi==='true';const arr=relationSource(f).filter(x=>!vals.includes(x[0])&&(!low||x[1].toLowerCase().includes(low))).slice(0,30);const out=document.getElementById('rel-results-'+fieldId);out.innerHTML=arr.map(([id,name])=>`<button type="button" onclick="pickRelation('${fieldId}','${id}')">${esc(name)}</button>`).join('')||'<div class="subtle" style="padding:9px">검색 결과가 없습니다.</div>';out.classList.remove('hidden')}

function setRelationValues(fieldId,vals){const e=document.querySelector(`input[type=hidden][data-field="${fieldId}"]`);if(e)e.value=JSON.stringify(vals);const box=document.querySelector(`[data-rel-picker="${fieldId}"]`),f=currentTab()?.schema.find(x=>x.id===fieldId),source=relationSource(f||{});document.getElementById('rel-selected-'+fieldId).innerHTML=vals.map(id=>{const x=source.find(z=>z[0]===id);return x?`<span class="chip">${esc(x[1])} <button type="button" class="iconbtn" style="min-height:24px;padding:2px 6px" onclick="removeRelation('${fieldId}','${id}')">×</button></span>`:''}).join('');if(f?.inputType==='profile_add')renderProfileAddPreview(fieldId,vals)}
function pickRelation(fieldId,id){const box=document.querySelector(`[data-rel-picker="${fieldId}"]`),multi=box?.dataset.multi==='true';let vals=relationValues(fieldId);if(multi)vals=[...new Set([...vals,id])];else vals=[id];setRelationValues(fieldId,vals);document.getElementById('rel-results-'+fieldId)?.classList.add('hidden');const inp=document.querySelector(`[data-rel-search="${fieldId}"]`);if(inp)inp.value='';}
function removeRelation(fieldId,id){setRelationValues(fieldId,relationValues(fieldId).filter(x=>x!==id))}
function renderProfileAddPreview(fieldId,vals){const f=currentTab()?.schema.find(x=>x.id===fieldId);if(!f||!f.type.startsWith('profile'))return;const p=page();let box=document.getElementById('profile-add-preview-'+fieldId);if(!box){const picker=document.querySelector(`[data-rel-picker="${fieldId}"]`);box=document.createElement('div');box.id='profile-add-preview-'+fieldId;box.className='character-profile-info';picker?.appendChild(box)}box.innerHTML=vals.map(id=>{const pr=p.data.profiles.find(x=>x.id===id);if(!pr)return '';const tags=p.data.tags.filter(t=>t.profileId===id);return `<div><b>${esc(pr.name)}</b><div>${tags.map(t=>`<span class="chip">${esc(t.name)}</span>`).join(' ')||'<span class="subtle">등록된 태그 없음</span>'}</div></div>`}).join('')}
function bindRelationInputs(){document.querySelectorAll('[data-rel-picker]').forEach(box=>{const id=box.dataset.relPicker,inp=box.querySelector('[data-rel-search]');if(!inp||inp.dataset.bound)return;inp.dataset.bound='1';inp.addEventListener('input',()=>renderRelationResults(id,inp.value));inp.addEventListener('focus',()=>renderRelationResults(id,inp.value));});}
function readForm(schema){const data={};for(const f of schema){if(f.type==='character'||f.type==='character[]'){const e=document.querySelector(`input[type=hidden][data-field="${f.id}"]`);try{const v=JSON.parse(e?.value||'[]');data[f.id]=f.type==='character[]'?v:(v[0]||null)}catch{data[f.id]=f.type==='character[]'?[]:null}continue}const es=[...document.querySelectorAll(`[data-field="${f.id}"]`)];if(!es.length)continue;const input=f.inputType||'auto';if(input==='checkbox'){data[f.id]=es.filter(e=>e.checked).map(e=>e.value)}else if(input==='radio'){data[f.id]=es.find(e=>e.checked)?.value||''}else if(f.type==='boolean'||input==='toggle'){data[f.id]=!!es[0].checked}else if(['tag','tag[]'].includes(f.type)){try{const vals=JSON.parse(es[0].value||'[]');data[f.id]=f.type==='tag[]'?vals:(vals[0]||'')}catch{data[f.id]=f.type==='tag[]'?[]:''}}else if(['profile','profile[]','category','category[]','folder','folder[]'].includes(f.type)&&es[0].type==='hidden'){try{const vals=JSON.parse(es[0].value||'[]');data[f.id]=f.type.endsWith('[]')?vals:(vals[0]||'')}catch{data[f.id]=f.type.endsWith('[]')?[]:''}}else if(f.type.endsWith('[]'))data[f.id]=[...(es[0].selectedOptions||[])].map(o=>o.value);else if(f.type==='number'||f.type==='rating')data[f.id]=es[0].value===''?'':Number(es[0].value);else if(f.type==='json'){try{data[f.id]=es[0].value?JSON.parse(es[0].value):null}catch{data[f.id]=es[0].value}}else data[f.id]=es[0].value}return data}
function fieldInput(f,value,extra=''){let v=value??'';const input=f.inputType||'auto';if(f.type==='character'||f.type==='character[]'||input==='character')return characterInput(f,v);if(input==='toggle'||(input==='auto'&&f.type==='boolean'))return `<label class="check"><input type="checkbox" data-field="${f.id}" ${v?'checked':''}> ${esc(f.name)}${f.required?' *':''}</label>`;if(input==='radio'||input==='checkbox'||input==='dropdown'||f.type==='enum'){const opts=f.options||[];if(input==='radio')return `<fieldset><legend>${esc(f.name)}</legend><div class="radio-options">${opts.map(o=>`<label class="check"><input type="radio" name="radio-${f.id}" data-field="${f.id}" value="${esc(o)}" ${String(v)===String(o)?'checked':''}>${esc(o)}</label>`).join('')}</div></fieldset>`;if(input==='checkbox')return `<fieldset><legend>${esc(f.name)}</legend><div class="choice-options">${opts.map(o=>`<label class="check"><input type="checkbox" data-field="${f.id}" value="${esc(o)}" ${(Array.isArray(v)&&v.includes(o))?'checked':''}>${esc(o)}</label>`).join('')}</div></fieldset>`;return `<label>${esc(f.name)}${f.required?' *':''}<select data-field="${f.id}">${opts.map(o=>`<option value="${esc(o)}" ${String(v)===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`}if(input==='tag_search')return tagRelationInput(f,v,extra);if(input==='profile_search'||input==='profile_add')return relationSearchInput(f,v,extra);if(input==='category_search'||input==='folder_search')return relationSearchInput(f,v,extra);if(f.type==='long_text'||f.type==='markdown'||f.type==='json'||input==='long_text')return `<label>${esc(f.name)}${f.required?' *':''}<textarea data-field="${f.id}" ${extra}>${esc(typeof v==='object'?JSON.stringify(v):v)}</textarea></label>`;if(f.type==='boolean')return `<label class="check"><input type="checkbox" data-field="${f.id}" ${v?'checked':''}> ${esc(f.name)}</label>`;if(['tag','tag[]'].includes(f.type))return tagRelationInput(f,v,extra);if(['profile','profile[]','category','category[]','folder','folder[]'].includes(f.type))return relationSearchInput(f,v,extra);let type='text';if(input==='number'||f.type==='number'||f.type==='rating')type='number';else if(input==='date'||f.type==='date')type='date';else if(input==='datetime'||f.type==='datetime')type='datetime-local';else if(input==='duration'||f.type==='duration')type='time';else if(input==='url'||f.type==='url')type='url';else if(input==='color'||f.type==='color')type='color';return `<label>${esc(f.name)}${f.required?' *':''}<input type="${type}" data-field="${f.id}" value="${esc(v)}" ${extra} ${f.type==='rating'?'min="0" max="5" step="0.5"':''}></label>`}
function newRecord(tabId){openRecordModal(tabId,null)}
function editRecord(tabId,id){openRecordModal(tabId,id)}
function openRecordModal(tabId,id){const t=page().tabs.find(x=>x.id===tabId);const arr=recordArray(t);const r=id?arr.find(x=>x.id===id):{id:uid(),data:{}};modal(id?'정보 편집':'새 정보',`<div class="form">${t.schema.map(f=>fieldInput(f,r.data?.[f.id])).join('')}</div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveRecord('${tabId}','${r.id}',${!!id})">저장</button>`);setTimeout(()=>{bindRelationInputs();document.querySelectorAll('[data-character-editor]').forEach(e=>bindCharacterInputs(e.dataset.characterEditor))},0)}
async function saveRecord(tabId,id,editing){const t=page().tabs.find(x=>x.id===tabId),arr=recordArray(t),data=readForm(t.schema);for(const f of t.schema)if(f.required&&(data[f.id]===undefined||data[f.id]===''||(Array.isArray(data[f.id])&&!data[f.id].length))){toast(`필수 항목을 입력하세요: ${f.name}`);return}let r=editing?arr.find(x=>x.id===id):{id,data:{}};r.data=data;if(!editing)arr.push(r);await saveDB();closeModal();renderBody()}
async function deleteRecord(tabId,id){if(!confirm('이 정보를 삭제할까요?'))return;const t=page().tabs.find(x=>x.id===tabId);const arr=recordArray(t);if(t.type==='bookmark')page().data.bookmarks=arr.filter(x=>x.id!==id);await saveDB();renderBody()}
function tagView(t){const p=page(),q=state.search.trim().toLowerCase(),tags=p.data.tags.filter(x=>!x.profileId&&(!q||x.name.toLowerCase().includes(q)));const groups=[...p.data.tagHeads].sort((a,b)=>(a.order??0)-(b.order??0)).map(h=>({h,arr:tags.filter(x=>x.tagHeadId===h.id).sort((a,b)=>a.name.localeCompare(b.name,'ko'))}));const noHead=tags.filter(x=>!x.tagHeadId).sort((a,b)=>a.name.localeCompare(b.name,'ko'));return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newTagHead()">＋ 태그 머리</button><button onclick="newTag()">＋ 태그</button></div><div class="tag-filter-grid">${groups.map(g=>`<div class="tag-group drag-row" draggable="true" data-drag-kind="taghead" data-drag-id="${g.h.id}"><details open><summary><span><span class="drag-handle">☰</span><span class="color-dot" style="background:${esc(g.h.color||'#999')}"></span> ${esc(g.h.name)}</span><span><span class="tag-kind-badge">${g.arr.length}개</span><button onclick="event.stopPropagation();editTagHead('${g.h.id}')">✎</button></span></summary><div class="tag-group-body">${g.arr.map(x=>`<div class="tag-row"><span class="color-dot" style="background:${esc(x.color||g.h.color||'#999')}"></span><span class="name">${esc(x.name)}</span><button onclick="editTag('${x.id}')">✎</button><button class="danger" onclick="deleteTag('${x.id}')">×</button></div>`).join('')||'<div class="subtle">태그가 없습니다.</div>'}</div></details></div>`).join('')}${noHead.length?`<div class="tag-group"><details open><summary>태그 머리 없음 <span class="tag-kind-badge">${noHead.length}개</span></summary><div class="tag-group-body">${noHead.map(x=>`<div class="tag-row"><span class="color-dot" style="background:${esc(x.color||'#999')}" ></span><span class="name">${esc(x.name)}</span><button onclick="editTag('${x.id}')">✎</button><button class="danger" onclick="deleteTag('${x.id}')">×</button></div>`).join('')}</div></details></div>`:''}${groups.length||noHead.length?'':'<div class="empty">현재 탭에서 사용할 수 있는 일반 태그가 없습니다.</div>'}</div>`}
function profileView(t){const p=page();const q=state.search.trim().toLowerCase();let arr=p.data.profiles.filter(x=>x.originTabId===t.id && (!q||JSON.stringify(x.data).toLowerCase().includes(q))).filter(x=>{const pt=p.data.tags.find(z=>z.profileId===x.id);return true});const fs=t.schema.filter(f=>f.type==='folder'||f.type==='folder[]');const groups=new Map(),ungrouped=[];for(const x of arr){let ids=x.folderId?[x.folderId]:[];for(const f of fs){const v=x.data?.[f.id];if(Array.isArray(v))ids.push(...v);else if(v)ids.push(v)}ids=[...new Set(ids)];if(!ids.length)ungrouped.push(x);else ids.forEach(fid=>{if(!groups.has(fid))groups.set(fid,[]);groups.get(fid).push(x)})}let body='';for(const [fid,items] of groups){const folder=p.data.folders.find(x=>x.id===fid);body+=`<details class="folder-box" open><summary class="folder-head"><strong>${esc(folder?.name||'폴더')}</strong><span class="subtle">${items.length}개</span></summary><div class="entity-grid">${items.map(x=>profileCard(x,t)).join('')}</div></details>`}body+=`<div class="entity-grid">${ungrouped.map(x=>profileCard(x,t)).join('')}</div>`;return `${toolbar(t)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newProfile()">＋ 추가</button><button onclick="schemaEditor('${t.id}')">필드 편집</button><button onclick="openFolderManager()">폴더 관리</button></div>${body||'<div class="empty">이 탭에서 생성된 프로필이 없습니다.</div>'}`}
function profileCard(x,t){const nameField=t.schema.find(f=>f.name==='이름')||t.schema[0];const name=x.data?.[nameField?.id]||'프로필';const pt=page().data.tags.find(z=>z.profileId===x.id);return `<article class="entity-card select-card ${state.selected.has(x.id)?'selected':''}" onclick="${state.selectMode?`toggleSelect('${x.id}')`:''}"><div class="card-actions" onclick="event.stopPropagation()">${state.selectMode?`<button class="select-check" onclick="toggleSelect('${x.id}')">${state.selected.has(x.id)?'✓':'○'}</button>`:''}<button onclick="editProfile('${x.id}')">✎</button><button class="danger" onclick="deleteProfile('${x.id}')">×</button></div><h3>${esc(name)}</h3><div class="field"><div class="field-name">프로필 태그</div><div>${pt?`<span class="chip"><span class="color-dot" style="background:${esc(pt.color||'#999')}"></span>${esc(pt.name)}</span> <button onclick="editProfileTag('${pt.id}')">✎</button>`:'—'}</div></div>${t.schema.filter(f=>f.visible!==false&&f.id!==nameField?.id).slice(0,7).map(f=>`<div class="field"><div class="field-name">${esc(f.name)}</div><div>${displayValue(x.data?.[f.id],f.type)}</div></div>`).join('')}</article>`}
function profileFieldSchema(t){return t.schema}
function newProfile(){openProfileModal(null)}function editProfile(id){openProfileModal(id)}
function openProfileModal(id){const p=page(),t=currentTab()?.type==='profile'?currentTab():p.tabs.find(x=>x.type==='profile'),x=id?p.data.profiles.find(x=>x.id===id):{id:uid(),data:{}};if(!t){toast('프로필 탭이 없습니다.');return}modal(id?'프로필 편집':'새 프로필',`<div class="form">${t.schema.map(f=>fieldInput(f,x.data?.[f.id])).join('')}</div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveProfile('${x.id}',${!!id})">저장</button>`);setTimeout(()=>{bindRelationInputs();document.querySelectorAll('[data-character-editor]').forEach(e=>bindCharacterInputs(e.dataset.characterEditor))},0)}
async function saveProfile(id,editing){const p=page(),t=currentTab()?.type==='profile'?currentTab():p.tabs.find(x=>x.type==='profile'),data=readForm(t.schema);const nf=t.schema.find(f=>f.name==='이름')||t.schema[0];if(nf&&(!data[nf.id]||!String(data[nf.id]).trim())){toast('프로필 이름을 입력하세요.');return}let x=editing?p.data.profiles.find(x=>x.id===id):{id,data:{}};x.data=data;let name=String(data[nf.id]||'').trim();x.name=name;x.originTabId=t.id;x.profileKind=t.profileKind||'series';if(!editing)p.data.profiles.push(x);syncProfileTag(x);await saveDB();closeModal();renderBody()}
function syncProfileTag(profile){const p=page();const existing=p.data.tags.find(t=>t.profileId===profile.id);const name=profile.name;if(existing){existing.name=name;existing.profileTabId=profile.originTabId;existing.profileKind=profile.profileKind}else{p.data.tags.push({id:uid(),name,profileId:profile.id,profileTabId:profile.originTabId,profileKind:profile.profileKind,tagHeadId:'',color:'#7c5cff'})}}
async function deleteProfile(id){if(!confirm('프로필을 삭제할까요? 프로필 태그도 함께 삭제하고 연결된 필드에서는 참조를 제거합니다.'))return;const p=page();p.data.profiles=p.data.profiles.filter(x=>x.id!==id);p.data.tags=p.data.tags.filter(x=>x.profileId!==id);for(const t of p.tabs)for(const r of (t.type==='bookmark'?p.data.bookmarks:[])){for(const f of t.schema.filter(f=>f.type==='profile'||f.type==='profile[]')){const v=r.data[f.id];if(Array.isArray(v))r.data[f.id]=v.filter(x=>x!==id);else if(v===id)r.data[f.id]=''}}await saveDB();renderBody()}
function editProfileTag(id){const p=page(),x=p.data.tags.find(t=>t.id===id);if(!x||!x.profileId)return;const profile=p.data.profiles.find(pr=>pr.id===x.profileId);const tab=currentTab();if(!profile||profile.originTabId!==tab?.id)return toast('프로필 태그는 프로필이 생성된 탭에서만 편집할 수 있습니다.');modal('프로필 태그 편집',`<div class="form"><label>이름<input value="${esc(x.name)}" disabled></label><label>색상<input id="ptColor" type="color" value="${esc(x.color||'#7c5cff')}"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveProfileTag('${id}')">저장</button>`)}
async function saveProfileTag(id){const x=page().data.tags.find(t=>t.id===id);if(!x)return;x.color=document.getElementById('ptColor').value;await saveDB();closeModal();renderBody()}
function categoryView(t){const p=page();return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newCategory()">＋ 카테고리</button></div><div class="entity-grid">${p.data.categories.map(x=>`<article class="entity-card"><div class="card-actions"><button onclick="editCategory('${x.id}')">✎</button><button class="danger" onclick="deleteCategory('${x.id}')">×</button></div><h3>${esc(x.name)}</h3><div class="subtle">${esc(x.description||'')}</div></article>`).join('')||'<div class="empty">카테고리가 없습니다.</div>'}</div>`}
function newCategory(){modal('새 카테고리',`<div class="form"><label>이름<input id="catName"></label><label>설명<textarea id="catDesc"></textarea></label><label>상위 카테고리<select id="catParent"><option value="">없음</option>${page().data.categories.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveCategory()">추가</button>`)}
function editCategory(id){const x=page().data.categories.find(x=>x.id===id);modal('카테고리 편집',`<div class="form"><label>이름<input id="catName" value="${esc(x.name)}"></label><label>설명<textarea id="catDesc">${esc(x.description||'')}</textarea></label><label>상위 카테고리<select id="catParent"><option value="">없음</option>${page().data.categories.filter(c=>c.id!==id).map(c=>`<option value="${c.id}" ${x.parentId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label></div>`,`<button class="danger" onclick="deleteCategory('${id}')">삭제</button><button onclick="closeModal()">취소</button><button class="primary" onclick="saveCategory('${id}')">저장</button>`)}
async function saveCategory(id){const p=page(),x=id?p.data.categories.find(x=>x.id===id):{id:uid()};x.name=document.getElementById('catName').value.trim();x.description=document.getElementById('catDesc').value;x.parentId=document.getElementById('catParent').value;if(!x.name)return toast('이름을 입력하세요.');if(!id)p.data.categories.push(x);await saveDB();closeModal();renderBody()}
async function deleteCategory(id){if(!confirm('카테고리를 삭제할까요? 연결된 필드의 참조도 제거됩니다.'))return;const p=page();p.data.categories=p.data.categories.filter(x=>x.id!==id);for(const t of p.tabs)for(const r of p.data.bookmarks)for(const f of t.schema.filter(f=>f.type==='category'||f.type==='category[]')){const v=r.data[f.id];if(Array.isArray(v))r.data[f.id]=v.filter(x=>x!==id);else if(v===id)r.data[f.id]=''}await saveDB();closeModal();renderBody()}
function openFolderManager(){const p=page();const rows=p.data.folders.map(f=>{const b=p.data.bookmarks.filter(r=>r.folderId===f.id||Object.values(r.data||{}).some(v=>v===f.id||(Array.isArray(v)&&v.includes(f.id)))).length;const pr=p.data.profiles.filter(r=>r.folderId===f.id||Object.values(r.data||{}).some(v=>v===f.id||(Array.isArray(v)&&v.includes(f.id)))).length;return `<div class="folder-manager-row"><div><b>${esc(f.name)}</b><div class="subtle">북마크 ${b} · 프로필 ${pr}</div></div><div class="actions"><button onclick="editFolder('${f.id}')">편집</button><button class="danger" onclick="deleteFolder('${f.id}')">삭제</button></div></div>`}).join('');modal('폴더 관리',`<div class="folder-manager-list">${rows||'<div class="empty">폴더가 없습니다.</div>'}</div>`,`<button class="primary" onclick="closeModal();newFolder()">＋ 폴더 추가</button><button onclick="closeModal()">닫기</button>`)}
function folderView(t){const p=page();return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newFolder()">＋ 폴더</button></div>${p.data.folders.map(f=>{const n=p.data.bookmarks.filter(r=>Object.values(r.data||{}).some(v=>v===f.id||(Array.isArray(v)&&v.includes(f.id)))).length;return `<div class="folder-box"><div class="folder-head"><div><b>${esc(f.name)}</b><div class="subtle">${n}개 북마크</div></div><div><button onclick="editFolder('${f.id}')">✎</button><button class="danger" onclick="deleteFolder('${f.id}')">삭제</button></div></div><div class="subtle">${esc(f.description||'')}</div></div>`}).join('')||'<div class="empty">폴더가 없습니다.</div>'}`}

function editFieldOptions(fieldId){window._schemaDraft=captureSchemaDraft();const f=window._schemaDraft.find(x=>x.id===fieldId);if(!f)return;const opts=(f.options||[]).join('\n');modal('필드 선택지',`<div class="form"><textarea id="fieldOptions" style="min-height:180px">${esc(opts)}</textarea></div>`,`<button onclick="renderSchemaEditor('${currentTab().id}')">취소</button><button class="primary" onclick="saveFieldOptions('${fieldId}')">저장</button>`)}
function saveFieldOptions(fieldId){const f=window._schemaDraft?.find(x=>x.id===fieldId);if(!f)return;f.options=document.getElementById('fieldOptions').value.split(/\n+/).map(x=>x.trim()).filter(Boolean);renderSchemaEditor(window._schemaDraftTab)}
function editSchemaTagHeads(fieldId){window._schemaDraft=captureSchemaDraft();const f=window._schemaDraft.find(x=>x.id===fieldId);if(!f)return;modal('이 필드의 태그 머리',`<div class="form">${tagHeadChecks('schema',f.allowedTagHeadIds||[])}</div>`,`<button onclick="renderSchemaEditor('${window._schemaDraftTab}')">취소</button><button class="primary" onclick="saveSchemaTagHeads('${fieldId}')">저장</button>`)}
function saveSchemaTagHeads(fieldId){const f=window._schemaDraft?.find(x=>x.id===fieldId);if(f)f.allowedTagHeadIds=checkedHeadIds('schema');renderSchemaEditor(window._schemaDraftTab)}
function removeSchemaDraft(fieldId){window._schemaDraft=captureSchemaDraft().filter(f=>f.id!==fieldId);renderSchemaEditor(window._schemaDraftTab)}
function addSchemaRow(){window._schemaDraft=captureSchemaDraft();window._schemaDraft.push(field('필드','text'));renderSchemaEditor(window._schemaDraftTab)}
async function saveSchema(tabId){window._schemaDraft=captureSchemaDraft();const t=page().tabs.find(x=>x.id===tabId);if(!t)return;t.schema=clone(window._schemaDraft||[]);t.schema.forEach((f,i)=>f.order=i);await saveDB();window._schemaDraft=null;window._schemaDraftTab=null;closeModal();renderBody()}
function pageSchemaEditor(){toast('Page 기본 필드는 사용하지 않습니다. 각 탭의 필드 편집에서 직접 만드세요.')}
function backup(){modal('백업 / 복원',`<div class="form"><div class="notice">현재 신형 Schema DB만 백업/복원합니다. 구형 DB를 읽거나 변환하지 않습니다.</div><button onclick="exportDB()">JSON 백업 내보내기</button><button onclick="importDB()">JSON 백업 가져오기</button><button class="danger" onclick="resetDB()">현재 DB 초기화</button></div>`,`<button onclick="closeModal()">닫기</button>`)}
function exportDB(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tagmark-v2.11-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importDB(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{const f=i.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||!Array.isArray(x.pages))throw new Error('Tagmark 신형 백업 형식이 아닙니다.');db=normalizeDB(x);state.pageId=db.pages[0].id;state.tabId=db.pages[0].tabs[0]?.id||null;await saveDB();closeModal();render();toast('복원이 완료되었습니다.')}catch(e){toast('가져오기 실패: '+e.message)}};i.click()}
async function resetDB(){if(!confirm('현재 로컬 DB를 완전히 초기화할까요?'))return;db=blankDB();state.pageId=db.pages[0].id;state.tabId=db.pages[0].tabs[0].id;state.selected.clear();await saveDB();closeModal();render()}
function initDragLists(){document.querySelectorAll('[data-drag-kind]').forEach(el=>{if(el.dataset.dragBound)return;el.dataset.dragBound='1';let timer=null,dragging=false,startY=0;el.addEventListener('dragstart',e=>{window._dragEl=el;el.classList.add('dragging');e.dataTransfer?.setData('text/plain',el.dataset.dragId||el.dataset.row);});el.addEventListener('dragend',async()=>{el.classList.remove('dragging');window._dragEl=null;await persistDrag(el.dataset.dragKind)});el.addEventListener('dragover',e=>{e.preventDefault();const d=window._dragEl;if(!d||d===el||d.dataset.dragKind!==el.dataset.dragKind)return;const r=el.getBoundingClientRect();el.parentElement.insertBefore(d,e.clientY<r.top+r.height/2?el:el.nextSibling)});el.addEventListener('pointerdown',e=>{if(e.button!==undefined&&e.button!==0)return;if(e.pointerType==='mouse')return;if(e.target.closest('input,select,textarea,button,a'))return;startY=e.clientY;clearTimeout(timer);timer=setTimeout(()=>{dragging=true;window._touchDrag=el;el.classList.add('dragging');el.setPointerCapture?.(e.pointerId)},360)});el.addEventListener('pointermove',e=>{if(!dragging||window._touchDrag!==el)return;const container=el.parentElement;const target=[...container.children].find(x=>x!==el&&x.dataset?.dragKind===el.dataset.dragKind&&(()=>{const r=x.getBoundingClientRect();return e.clientY<r.top+r.height/2})());if(target)container.insertBefore(el,target);else{const items=[...container.children].filter(x=>x!==el&&x.dataset?.dragKind===el.dataset.dragKind);const last=items[items.length-1];if(last)container.appendChild(el)}});el.addEventListener('pointerup',async()=>{clearTimeout(timer);if(dragging){dragging=false;el.classList.remove('dragging');window._touchDrag=null;window._suppressClickUntil=Date.now()+450;await persistDrag(el.dataset.dragKind)}});el.addEventListener('pointercancel',async()=>{clearTimeout(timer);if(dragging){dragging=false;el.classList.remove('dragging');window._touchDrag=null;await persistDrag(el.dataset.dragKind)}})});}
document.addEventListener('click',e=>{if(window._suppressClickUntil&&Date.now()<window._suppressClickUntil){e.preventDefault();e.stopPropagation();window._suppressClickUntil=0}},true);
async function persistDrag(kind){const container=kind==='page'?document.querySelector('.page-list'):kind==='tab'?document.querySelector('.tabs'):kind==='taghead'?document.querySelector('.tag-filter-grid'):document.querySelector('#schemaRows');if(!container)return;let ids=[...container.querySelectorAll(`[data-drag-kind="${kind}"]`)].map(x=>x.dataset.dragId||x.dataset.row);if(kind==='page'){ids.forEach((id,i)=>{const x=db.pages.find(p=>p.id===id);if(x)x.order=i});}else if(kind==='tab'){const p=page();ids.forEach((id,i)=>{const x=p.tabs.find(t=>t.id===id);if(x)x.order=i});}else if(kind==='taghead'){const p=page();ids.forEach((id,i)=>{const x=p.data.tagHeads.find(h=>h.id===id);if(x)x.order=i});}else{if(window._schemaDraft){ids.forEach((id,i)=>{const x=window._schemaDraft.find(f=>f.id===id);if(x)x.order=i});window._schemaDraft.sort((a,b)=>(a.order??0)-(b.order??0));renderSchemaEditor(window._schemaDraftTab);return;}const t=currentTab();ids.forEach((id,i)=>{const x=t.schema.find(f=>f.id===id);if(x)x.order=i});}await saveDB();if(kind!=='schema')render();}
async function init(){try{await loadDB();render()}catch(e){console.error(e);document.getElementById('app').innerHTML=`<div style="padding:30px"><h2>신형 로컬 DB를 열 수 없습니다.</h2><p>${esc(e.message||e)}</p><p class="muted">IndexedDB가 차단된 비공개 브라우징/콘텐츠 환경인지 확인해 주세요.</p></div>`}}
init();
</script></body></html>
