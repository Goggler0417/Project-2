<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tagmark v2.02</title>
<style>
:root{--bg:#f4f6fa;--panel:#fff;--line:#dfe4ec;--text:#17202b;--muted:#6d7785;--accent:#315efb;--danger:#d64545;--side:#111827;--side2:#26344d;--shadow:0 8px 24px #17202b12}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 12px;color:var(--text);min-height:38px}button:hover{background:#f1f4f9}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.danger{color:var(--danger)}.iconbtn{padding:7px 9px;min-width:38px}.app{display:flex;height:100dvh;overflow:hidden}.sidebar{width:250px;flex:0 0 250px;background:var(--side);color:#fff;padding:18px;display:flex;flex-direction:column;gap:12px;z-index:20}.brand{font-weight:800;font-size:19px}.version{font-size:11px;color:#9ca3af;margin-top:-8px}.side-actions{display:flex;gap:7px}.side-actions button{flex:1}.page-list{overflow:auto;display:flex;flex-direction:column;gap:5px}.page-item{padding:10px;border-radius:9px;cursor:pointer;color:#d1d5db;display:flex;align-items:center;gap:8px}.page-item.active{background:var(--side2);color:#fff}.page-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{flex:1;display:flex;flex-direction:column;min-width:0}.topbar{min-height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 18px}.topbar input{flex:1;min-width:0;max-width:520px;padding:10px 12px;border:1px solid var(--line);border-radius:9px}.content{padding:20px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.head h1{margin:0 0 4px}.muted{color:var(--muted);font-size:13px}.actions,.toolbar,.tabs,.pill-row{display:flex;gap:7px;flex-wrap:wrap}.tabs{border-bottom:1px solid var(--line);margin:18px 0 14px;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:0;border-radius:8px 8px 0 0;background:transparent;padding:11px 14px;color:var(--muted);white-space:nowrap}.tab.active{color:var(--accent);background:#fff;border:1px solid var(--line);border-bottom-color:#fff;margin-bottom:-1px}.toolbar{align-items:center;margin-bottom:14px}.toolbar input,.toolbar select{padding:9px;border:1px solid var(--line);border-radius:8px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.cards.list{display:flex;flex-direction:column}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:relative;box-shadow:0 1px 2px #00000006}.card.selected{outline:2px solid #315efb55;background:#f7f9ff}.card h3{margin:0 42px 8px 0;font-size:16px;word-break:break-word}.card .field{margin-top:9px;word-break:break-word}.field-name{font-size:11px;color:var(--muted);margin-bottom:3px}.card-actions{position:absolute;right:10px;top:9px;display:flex;gap:4px}.card-actions button{padding:4px 7px;min-height:30px}.empty{padding:45px;text-align:center;background:#fff;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;background:#eef1f6;font-size:12px;margin:2px}.chip.dot{border:1px solid #00000010}.link{color:var(--accent);text-decoration:none}.link:hover{text-decoration:underline}.main-pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}.main-pages.list{display:flex;flex-direction:column}.page-card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;cursor:pointer;position:relative;box-shadow:var(--shadow)}.page-card:hover{border-color:#b9c4d8}.page-card h3{margin:5px 0;word-break:break-word}.page-card .pc-actions{position:absolute;right:10px;top:10px;display:flex;gap:4px}.stat{font-size:12px;color:var(--muted)}.section{margin-top:16px}.notice{padding:10px 12px;border-radius:9px;background:#eef3ff;color:#2949a6;font-size:13px}.modal-back{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:14px;z-index:1000}.modal{width:min(860px,100%);max-height:92dvh;overflow:auto;background:#fff;border-radius:15px;padding:20px;box-shadow:0 20px 60px #0004}.modal h2{margin:0 0 15px}.form{display:grid;gap:11px}.form label{font-size:13px;font-weight:650}.form input,.form textarea,.form select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}.form textarea{min-height:100px;resize:vertical}.modal-footer{display:flex;justify-content:flex-end;gap:7px;margin-top:16px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.schema-row{display:grid;grid-template-columns:1.2fr 1fr auto;gap:7px;align-items:center;margin:7px 0}.check{display:flex;align-items:center;gap:7px}.check input{width:auto}.list-box{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px}.tree-row{display:flex;align-items:center;gap:7px;padding:7px 4px}.tree-row span{flex:1}.subtle{font-size:12px;color:var(--muted)}.hidden{display:none!important}.selectbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px;margin-bottom:12px}.selectbar .count{font-weight:700}.color-dot{width:13px;height:13px;border-radius:50%;display:inline-block;border:1px solid #0002;vertical-align:-2px}.tag-heads{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}.tag-head{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.tag-head-title{font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px}.entity-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.entity-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;position:relative}.entity-card h3{margin:0 70px 8px 0}.folder-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:12px}.folder-head{display:flex;justify-content:space-between;gap:8px;align-items:center}.mobile-menu{display:none}
@media(max-width:760px){.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-105%);transition:transform .18s;width:min(300px,88vw);box-shadow:20px 0 50px #0005}.sidebar.open{transform:translateX(0)}.mobile-menu{display:block}.topbar{padding:9px 10px;gap:6px}.topbar input{order:2}.content{padding:12px}.head{gap:8px}.head .actions{width:100%}.head .actions button{flex:1}.cards{grid-template-columns:1fr}.main-pages{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.modal{padding:16px;border-radius:13px}.schema-row{grid-template-columns:1fr}.card-actions{position:static;justify-content:flex-end;margin-bottom:5px}.card h3{margin-right:0}.tabs{margin-top:12px}.toolbar>*{flex:1;min-width:120px}.toolbar input{min-width:160px}.page-card{min-height:110px}.modal-footer{position:sticky;bottom:0;background:#fff;padding-top:10px}.selectbar{position:sticky;top:0;z-index:5}.brand{font-size:18px}}
</style></head>
<body><div id="app"></div>
<script>
const VERSION="v2.02";
const DB_NAME="tagmark-new-v2";
const DB_VERSION=1;
const STORE="database";
const TYPES=[['text','텍스트'],['long_text','긴 텍스트'],['url','URL'],['number','숫자'],['boolean','체크'],['date','날짜'],['datetime','날짜·시간'],['image','이미지 URL'],['file','파일'],['color','색상'],['rating','평점'],['tag','태그'],['tag[]','태그 다중'],['category','카테고리'],['category[]','카테고리 다중'],['profile','프로필'],['profile[]','프로필 다중'],['character','등장인물'],['character[]','등장인물 다중'],['folder','폴더'],['folder[]','폴더 다중'],['enum','선택'],['relation','관계'],['relation[]','관계 다중'],['markdown','Markdown'],['json','JSON']];
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clone=x=>JSON.parse(JSON.stringify(x));
const defaultSchema=(type)=>type==='bookmark'?[{id:uid(),name:'제목',type:'text'},{id:uid(),name:'URL',type:'url'},{id:uid(),name:'메모',type:'long_text'},{id:uid(),name:'태그',type:'tag[]'},{id:uid(),name:'카테고리',type:'category[]'},{id:uid(),name:'프로필',type:'profile[]'},{id:uid(),name:'등장인물',type:'character[]'},{id:uid(),name:'폴더',type:'folder'}]:type==='profile'?[{id:uid(),name:'이름',type:'text'},{id:uid(),name:'이미지',type:'image'},{id:uid(),name:'URL',type:'url'},{id:uid(),name:'메모',type:'long_text'},{id:uid(),name:'등장인물',type:'character[]'}]:type==='character'?[{id:uid(),name:'이름',type:'text'},{id:uid(),name:'이미지',type:'image'},{id:uid(),name:'역할',type:'text'},{id:uid(),name:'메모',type:'long_text'},{id:uid(),name:'프로필',type:'profile[]'}]:type==='tag'?[{id:uid(),name:'태그 이름',type:'text'},{id:uid(),name:'태그 머리',type:'text'},{id:uid(),name:'색상',type:'color'}]:[{id:uid(),name:'이름',type:'text'},{id:uid(),name:'메모',type:'long_text'}];
function newTab(name,type='custom'){const schema=defaultSchema(type);return{id:uid(),name,icon:type==='bookmark'?'🔖':type==='tag'?'🏷️':type==='profile'?'👤':type==='character'?'🎭':type==='category'?'🗂️':type==='folder'?'📁':'📄',type,layout:'grid',titleField:schema[0]?.id||'',titleLinkField:'',search:true,sortField:'',sortDesc:false,schema,records:[]}}
function newPage(name){return{id:uid(),name:name||'새 Page',icon:'📁',settings:{bookmark:true,tag:true,profile:true,character:true,category:true,folder:true},shared:{tagHeads:[],tags:[],categories:[],folders:[],profiles:[],characters:[]},tabs:[newTab('북마크','bookmark'),newTab('태그 관리','tag'),newTab('프로필','profile'),newTab('등장인물','character'),newTab('카테고리','category'),newTab('폴더','folder')]}}
function blankDB(){const p=newPage('새 Page');return{version:1,main:{layout:'grid',sort:'asc'},pages:[p],activePageId:p.id,activeTabId:p.tabs[0].id}}
let db=null, dbPromise=null, query='', selected=new Set(), modalEl=null;
function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('IndexedDB 오류'))})}
async function openDB(){if(db)return db;if(dbPromise)return dbPromise;dbPromise=new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>{db=r.result;db.onversionchange=()=>db.close();res(db)};r.onerror=()=>rej(r.error||new Error('로컬 DB 열기 실패'))});return dbPromise}
async function loadDB(){const d=await openDB(),o=d.transaction(STORE).objectStore(STORE),v=await req(o.get('root'));if(v?.data){db=v.data;normalizeDB();}else{db=blankDB();await saveDB()}}
function normalizeDB(){db.pages??=[];db.main??={layout:'grid',sort:'asc'};db.view??='page';for(const p of db.pages){p.settings=Object.assign({bookmark:true,tag:true,profile:true,character:true,category:true,folder:true},p.settings||{});p.shared=Object.assign({tagHeads:[],tags:[],categories:[],folders:[],profiles:[],characters:[]},p.shared||{});p.tabs??=[];for(const t of p.tabs){t.schema??=defaultSchema(t.type);t.records??=[];t.layout??='grid';t.search=t.search!==false;t.sortDesc=!!t.sortDesc}}if(db.view!=='home'&&!db.activePageId&&db.pages[0])db.activePageId=db.pages[0].id;if(db.view!=='home'&&!page()&&db.pages[0])db.activePageId=db.pages[0].id;if(page()&&!tab()&&page().tabs[0])db.activeTabId=page().tabs[0].id}
async function saveDB(){const d=await openDB();await req(d.transaction(STORE,'readwrite').objectStore(STORE).put({id:'root',data:db}))}
function page(){return db?.pages.find(p=>p.id===db.activePageId)||null}function tab(){const p=page();return p?.tabs.find(t=>t.id===db.activeTabId)||p?.tabs[0]||null}
function pageCount(p){return p.tabs.reduce((n,t)=>n+t.records.length,0)}
function visibleTabs(p){return p.tabs.filter(t=>p.settings[t.type]!==false||t.type==='custom')}
function featureLabel(type){return({bookmark:'북마크',tag:'태그',profile:'프로필',character:'등장인물',category:'카테고리',folder:'폴더',custom:'커스텀'})[type]||type}
function toast(msg){alert(msg)}
function modal(title,body,foot){closeModal();modalEl=document.createElement('div');modalEl.className='modal-back';modalEl.innerHTML=`<div class="modal"><h2>${title}</h2>${body}<div class="modal-footer">${foot}</div></div>`;document.body.appendChild(modalEl)}
function closeModal(){if(modalEl){modalEl.remove();modalEl=null}}
function render(){normalizeDB();const p=db.view==='home'?null:page();const t=db.view==='home'?null:tab();document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar" id="sidebar"><div class="brand">Tagmark</div><div class="version">신형 ${VERSION}</div><div class="side-actions"><button onclick="openPageModal()">＋ Page</button><button onclick="exportDB()">백업</button></div><div class="page-list">${db.pages.map(x=>`<div class="page-item ${x.id===p?.id?'active':''}" onclick="selectPage('${x.id}')"><span>${esc(x.icon||'📁')}</span><span class="page-name">${esc(x.name)}</span></div>`).join('')}</div></aside><main class="main"><div class="topbar"><button class="iconbtn mobile-menu" onclick="toggleSidebar()">☰</button><input value="${esc(query)}" oninput="query=this.value;renderBody()" placeholder="검색"><button onclick="goHome()">Main</button>${p?`<button onclick="openPageSettings()">Page 설정</button>`:''}</div><div class="content" id="content">${p?pageView(p,t):homeView()}</div></main></div>`}
function toggleSidebar(){document.getElementById('sidebar')?.classList.toggle('open')}
function goHome(){db.view='home';selected.clear();query='';saveDB();render()}
function homeView(){let pages=[...db.pages];pages.sort((a,b)=>{const z=a.name.localeCompare(b.name,'ko');return db.main.sort==='desc'?-z:z});const list=db.main.layout==='list';return `<div class="head"><div><h1>Main Page</h1><div class="muted">${pages.length}개 Page</div></div><div class="actions"><button onclick="toggleMainLayout()">${list?'☷ 목록':'▦ 그리드'}</button><button onclick="toggleMainSort()">${db.main.sort==='desc'?'Z→A':'A→Z'}</button><button class="primary" onclick="openPageModal()">＋ Page</button></div></div><div class="main-pages ${list?'list':''}" style="margin-top:16px">${pages.map(p=>`<article class="page-card" onclick="selectPage('${p.id}')"><div class="pc-actions"><button class="iconbtn" onclick="event.stopPropagation();openPageSettings('${p.id}')">⚙</button><button class="iconbtn danger" onclick="event.stopPropagation();deletePage('${p.id}')">×</button></div><div style="font-size:28px">${esc(p.icon||'📁')}</div><h3>${esc(p.name)}</h3><div class="stat">${p.tabs.length} Tabs · ${pageCount(p)} Records</div></article>`).join('')||'<div class="empty">Page가 없습니다.</div>'}</div>`}
function toggleMainLayout(){db.main.layout=db.main.layout==='grid'?'list':'grid';saveDB();render()}
function toggleMainSort(){db.main.sort=db.main.sort==='desc'?'asc':'desc';saveDB();render()}
function selectPage(id){db.view='page';db.activePageId=id;const p=page();db.activeTabId=visibleTabs(p)[0]?.id||p.tabs[0]?.id||null;query='';selected.clear();saveDB();if(innerWidth<=760)toggleSidebar();render()}
function selectTab(id){db.activeTabId=id;query='';selected.clear();saveDB();renderBody()}
function pageView(p,t){const ts=visibleTabs(p);return `<div class="head"><div><h1>${esc(p.icon||'📁')} ${esc(p.name)}</h1><div class="muted">${ts.length}개 Tab · ${pageCount(p)} Records</div></div><div class="actions"><button onclick="openTabModal()">＋ Tab</button><button onclick="openPageSettings()">설정</button><button class="danger" onclick="deletePage('${p.id}')">삭제</button></div></div><div class="tabs">${ts.map(x=>`<button class="tab ${x.id===t?.id?'active':''}" onclick="selectTab('${x.id}')">${esc(x.icon||'📄')} ${esc(x.name)}</button>`).join('')}<button class="tab" onclick="openTabModal()">＋</button></div>${t?tabView(t):'<div class="empty">사용 가능한 Tab이 없습니다.</div>'}`}
function renderBody(){const p=db.view==='home'?null:page(),t=db.view==='home'?null:tab();document.getElementById('content').innerHTML=p?pageView(p,t):homeView()}
function openPageModal(){modal('새 Page',`<div class="form"><label>Page 이름<input id="newPageName" autofocus></label><label>아이콘<input id="newPageIcon" value="📁"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createPage()">추가</button>`);setTimeout(()=>document.getElementById('newPageName')?.focus(),0)}
async function createPage(){const name=document.getElementById('newPageName')?.value.trim();if(!name){toast('Page 이름을 입력해주세요.');return}if(db.pages.some(p=>p.name===name)){toast('같은 이름의 Page가 이미 있습니다.');return}const p=newPage(name);db.view='page';p.icon=document.getElementById('newPageIcon')?.value||'📁';db.pages.push(p);db.activePageId=p.id;db.activeTabId=p.tabs[0].id;selected.clear();await saveDB();closeModal();render()}
async function deletePage(id=page()?.id){const p=db.pages.find(x=>x.id===id);if(!p)return;if(!confirm(`"${p.name}" Page와 내부 데이터를 삭제할까요?`))return;db.pages=db.pages.filter(x=>x.id!==id);if(db.activePageId===id){db.activePageId=db.pages[0]?.id||null;db.activeTabId=page()?.tabs[0]?.id||null}selected.clear();await saveDB();render()}
function openPageSettings(id=page()?.id){const p=db.pages.find(x=>x.id===id);if(!p)return;modal('Page 설정',`<div class="form"><label>Page 이름<input id="psName" value="${esc(p.name)}"></label><label>아이콘<input id="psIcon" value="${esc(p.icon||'📁')}"></label><div><b>사용할 기능</b><div class="grid2" style="margin-top:8px">${['bookmark','tag','profile','character','category','folder'].map(k=>`<label class="check"><input type="checkbox" id="feat_${k}" ${p.settings[k]!==false?'checked':''}> ${featureLabel(k)}</label>`).join('')}</div></div></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="savePageSettings('${p.id}')">저장</button>`)}
async function savePageSettings(id){const p=db.pages.find(x=>x.id===id);p.name=document.getElementById('psName').value.trim()||p.name;p.icon=document.getElementById('psIcon').value||'📁';for(const k of ['bookmark','tag','profile','character','category','folder'])p.settings[k]=document.getElementById('feat_'+k).checked;await saveDB();closeModal();render()}
function openTabModal(){const p=page();if(!p)return;modal('새 Tab',`<div class="form"><label>Tab 이름<input id="tabName"></label><label>Tab 유형<select id="tabType">${['bookmark','tag','profile','character','category','folder','custom'].map(k=>`<option value="${k}">${featureLabel(k)}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createTab()">추가</button>`)}
async function createTab(){const p=page(),name=document.getElementById('tabName').value.trim()||'새 Tab',type=document.getElementById('tabType').value;if(type!=='custom'&&p.settings[type]===false){toast('Page 설정에서 이 기능을 먼저 켜주세요.');return}const t=newTab(name,type);p.tabs.push(t);db.activeTabId=t.id;await saveDB();closeModal();renderBody()}
function openTabSettings(){const t=tab();if(!t)return;modal('Tab 설정',`<div class="form"><label>Tab 이름<input id="tsName" value="${esc(t.name)}"></label><label>아이콘<input id="tsIcon" value="${esc(t.icon||'📄')}"></label><label>유형<select id="tsType">${['bookmark','tag','profile','character','category','folder','custom'].map(k=>`<option value="${k}" ${t.type===k?'selected':''}>${featureLabel(k)}</option>`).join('')}</select></label><label>레이아웃<select id="tsLayout"><option value="grid" ${t.layout==='grid'?'selected':''}>그리드</option><option value="list" ${t.layout==='list'?'selected':''}>목록</option></select></label><label>제목 Field<select id="tsTitle">${t.schema.map(f=>`<option value="${f.id}" ${t.titleField===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><label>제목 링크 URL Field<select id="tsLink"><option value="">사용 안 함</option>${t.schema.filter(f=>f.type==='url').map(f=>`<option value="${f.id}" ${t.titleLinkField===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></label><div><b>저장 필드(Schema)</b><div class="subtle">이 Tab의 Record에 저장할 항목을 자유롭게 추가/삭제할 수 있습니다.</div><div id="schemaRows">${t.schema.map(schemaRow).join('')}</div><button onclick="addSchemaRow()">＋ Field</button></div></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveTabSettings()">저장</button>`)}
function schemaRow(f){return `<div class="schema-row" data-fid="${f.id}"><input class="sn" value="${esc(f.name)}"><select class="st">${TYPES.map(x=>`<option value="${x[0]}" ${f.type===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><button class="danger" onclick="this.parentElement.remove()">×</button></div>`}
function addSchemaRow(){document.getElementById('schemaRows').insertAdjacentHTML('beforeend',schemaRow({id:uid(),name:'새 Field',type:'text'}))}
async function saveTabSettings(){const t=tab();t.name=document.getElementById('tsName').value.trim()||t.name;t.icon=document.getElementById('tsIcon').value||'📄';t.type=document.getElementById('tsType').value;t.layout=document.getElementById('tsLayout').value;t.titleField=document.getElementById('tsTitle').value;t.titleLinkField=document.getElementById('tsLink').value;const ns=[...document.querySelectorAll('#schemaRows .schema-row')].map(r=>({id:r.dataset.fid,name:r.querySelector('.sn').value.trim()||'Field',type:r.querySelector('.st').value}));if(!ns.length)ns.push({id:uid(),name:'이름',type:'text'});t.schema=ns;if(!ns.some(f=>f.id===t.titleField))t.titleField=ns[0].id;await saveDB();closeModal();renderBody()}
function toolbar(t,selection=true){return `<div class="toolbar">${t.search?`<input value="${esc(query)}" oninput="query=this.value;renderBody()" placeholder="${featureLabel(t.type)} 검색">`:''}<select onchange="setSort(this.value)"><option value="">정렬</option>${t.schema.map(f=>`<option value="${f.id}" ${t.sortField===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select><button onclick="toggleTabLayout()">${t.layout==='list'?'☷ 목록':'▦ 그리드'}</button>${t.type==='bookmark'?`<button onclick="toggleSelectMode()">${selectionMode?'선택 취소':'선택'}</button>`:''}<button onclick="openTabSettings()">⚙</button></div>`}
let selectionMode=false;
function toggleSelectMode(){selectionMode=!selectionMode;selected.clear();renderBody()}
function setSort(id){const t=tab();if(!id){t.sortField='';}else if(t.sortField===id)t.sortDesc=!t.sortDesc;else{t.sortField=id;t.sortDesc=false}saveDB();renderBody()}
function toggleTabLayout(){const t=tab();t.layout=t.layout==='grid'?'list':'grid';saveDB();renderBody()}
function getRecords(t){let a=[...t.records];if(query.trim()){const q=query.toLowerCase();a=a.filter(r=>JSON.stringify(r.data).toLowerCase().includes(q))}if(t.sortField){const f=t.schema.find(x=>x.id===t.sortField);a.sort((x,y)=>String(x.data?.[f?.name]??'').localeCompare(String(y.data?.[f?.name]??''),'ko',{numeric:true})*(t.sortDesc?-1:1))}return a}
function tabView(t){if(t.type==='tag')return tagView(t);if(t.type==='profile')return entityView(t,'profile');if(t.type==='character')return entityView(t,'character');if(t.type==='category')return categoryView(t);if(t.type==='folder')return folderView(t);return recordsView(t)}
function recordsView(t){const a=getRecords(t);const bulk=selectionMode?`<div class="selectbar"><span class="count">${selected.size}개 선택</span><button onclick="selectAllVisible()">전체 선택</button><button onclick="clearSelection()">선택 해제</button><button onclick="bulkTag()">태그</button><button onclick="bulkCharacter()">등장인물</button><button onclick="bulkFolder()">폴더</button><button class="danger" onclick="bulkDelete()">삭제</button></div>`:'';return toolbar(t)+bulk+(a.length?`<div class="cards ${t.layout==='list'?'list':''}">${a.map(recordCard).join('')}</div>`:`<div class="empty">Record가 없습니다.<br><button class="primary" onclick="openRecordModal()">＋ 추가</button></div>`)}
function recordCard(r){const t=tab(),tf=t.schema.find(f=>f.id===t.titleField)||t.schema[0],lf=t.schema.find(f=>f.id===t.titleLinkField),title=r.data?.[tf?.name]||'이름 없음';return `<article class="card ${selected.has(r.id)?'selected':''}"><div class="card-actions">${selectionMode?`<input type="checkbox" ${selected.has(r.id)?'checked':''} onchange="toggleSelected('${r.id}')">`:''}<button onclick="openRecordModal('${r.id}')">✎</button><button class="danger" onclick="deleteRecord('${r.id}')">×</button></div><h3>${lf&&r.data?.[lf.name]?`<a class="link" href="${esc(r.data[lf.name])}" target="_blank">${esc(title)}</a>`:esc(title)}</h3>${t.schema.filter(f=>f.id!==tf?.id&&f.type!=='url').map(f=>`<div class="field"><div class="field-name">${esc(f.name)}</div><div>${displayValue(r.data?.[f.name],f.type)}</div></div>`).join('')}</article>`}
function displayValue(v,type){if(v==null||v==='')return '<span class="subtle">-</span>';if(type==='url')return `<a class="link" target="_blank" href="${esc(v)}">${esc(v)}</a>`;if(['tag','tag[]','category','category[]','profile','profile[]','character','character[]','folder','folder[]'].includes(type)){const vals=Array.isArray(v)?v:[v];return vals.map(id=>{const p=page();let name=id;let color='';if(type.startsWith('tag')){const x=p.shared.tags.find(x=>x.id===id);name=x?.name||id;color=x?.color||''}else if(type.startsWith('category'))name=p.shared.categories.find(x=>x.id===id)?.name||id;else if(type.startsWith('profile'))name=p.shared.profiles.find(x=>x.id===id)?.data?.[p.tabs.find(t=>t.type==='profile')?.schema?.[0]?.name]||id;else if(type.startsWith('character'))name=p.shared.characters.find(x=>x.id===id)?.data?.[p.tabs.find(t=>t.type==='character')?.schema?.[0]?.name]||id;else if(type.startsWith('folder'))name=p.shared.folders.find(x=>x.id===id)?.name||id;return `<span class="chip dot" ${color?`style="background:${esc(color)}22"`:''}>${color?`<span class="color-dot" style="background:${esc(color)}"></span>`:''}${esc(name)}</span>`}).join('')}if(type==='boolean')return v?'✓':'—';if(type==='image')return `<img src="${esc(v)}" style="max-width:100%;max-height:180px;border-radius:8px">`;return esc(Array.isArray(v)?v.join(', '):String(v))}
function fieldInput(f,value){const p=page();const v=value??'';if(['tag','tag[]'].includes(f.type)){const multi=f.type.endsWith('[]');return `<label>${esc(f.name)}<select id="rf_${f.id}" ${multi?'multiple':''}>${p.shared.tags.map(x=>`<option value="${x.id}" ${multi?(Array.isArray(v)&&v.includes(x.id)?'selected':''):(v===x.id?'selected':'')}>${esc(x.name)}</option>`).join('')}</select></label>`}if(['category','category[]'].includes(f.type)){const multi=f.type.endsWith('[]');return `<label>${esc(f.name)}<select id="rf_${f.id}" ${multi?'multiple':''}>${p.shared.categories.map(x=>`<option value="${x.id}" ${multi?(Array.isArray(v)&&v.includes(x.id)?'selected':''):(v===x.id?'selected':'')}>${esc(x.name)}</option>`).join('')}</select></label>`}if(['profile','profile[]'].includes(f.type)){const multi=f.type.endsWith('[]');return `<label>${esc(f.name)}<select id="rf_${f.id}" ${multi?'multiple':''}>${p.shared.profiles.map(x=>`<option value="${x.id}" ${multi?(Array.isArray(v)&&v.includes(x.id)?'selected':''):(v===x.id?'selected':'')}>${esc(entityName(x,'profile'))}</option>`).join('')}</select></label>`}if(['character','character[]'].includes(f.type)){const multi=f.type.endsWith('[]');return `<label>${esc(f.name)}<select id="rf_${f.id}" ${multi?'multiple':''}>${p.shared.characters.map(x=>`<option value="${x.id}" ${multi?(Array.isArray(v)&&v.includes(x.id)?'selected':''):(v===x.id?'selected':'')}>${esc(entityName(x,'character'))}</option>`).join('')}</select></label>`}if(['folder','folder[]'].includes(f.type)){const multi=f.type.endsWith('[]');return `<label>${esc(f.name)}<select id="rf_${f.id}" ${multi?'multiple':''}>${p.shared.folders.map(x=>`<option value="${x.id}" ${multi?(Array.isArray(v)&&v.includes(x.id)?'selected':''):(v===x.id?'selected':'')}>${esc(x.name)}</option>`).join('')}</select></label>`}if(f.type==='boolean')return `<label class="check"><input id="rf_${f.id}" type="checkbox" ${v?'checked':''}> ${esc(f.name)}</label>`;if(f.type==='color')return `<label>${esc(f.name)}<input id="rf_${f.id}" type="color" value="${esc(v||'#315efb')}"></label>`;if(f.type==='long_text'||f.type==='markdown'||f.type==='json')return `<label>${esc(f.name)}<textarea id="rf_${f.id}">${esc(typeof v==='string'?v:JSON.stringify(v||'',null,2))}</textarea></label>`;if(f.type==='enum')return `<label>${esc(f.name)}<select id="rf_${f.id}"><option value="">선택</option><option value="A" ${v==='A'?'selected':''}>A</option><option value="B" ${v==='B'?'selected':''}>B</option></select></label>`;const inputType=f.type==='number'?'number':f.type==='date'?'date':f.type==='datetime'?'datetime-local':f.type==='rating'?'number':f.type==='url'?'url':f.type==='image'?'url':'text';return `<label>${esc(f.name)}<input id="rf_${f.id}" type="${inputType}" value="${esc(v)}" ${f.type==='rating'?'min="0" max="5" step="0.5"':''}></label>`}
function readField(f){const e=document.getElementById('rf_'+f.id);if(!e)return '';if(f.type.endsWith('[]'))return [...e.selectedOptions].map(o=>o.value);if(['tag','category','profile','character','folder'].includes(f.type))return e.value;if(f.type==='boolean')return e.checked;if(f.type==='json'){try{return JSON.parse(e.value||'null')}catch{return e.value}}return e.value}
function openRecordModal(id){const t=tab(),r=id?t.records.find(x=>x.id===id):{id:uid(),data:{}};modal(id?'Record 편집':'새 Record',`<div class="form">${t.schema.map(f=>fieldInput(f,r.data?.[f.name])).join('')}</div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveRecord('${r.id}',${id?'true':'false'})">저장</button>`)}
async function saveRecord(id,editing){const t=tab(),r=editing?t.records.find(x=>x.id===id):{id,data:{}};for(const f of t.schema)r.data[f.name]=readField(f);if(!editing)t.records.push(r);await saveDB();selected.delete(id);closeModal();renderBody()}
async function deleteRecord(id){if(!confirm('삭제할까요?'))return;const t=tab();t.records=t.records.filter(x=>x.id!==id);selected.delete(id);await saveDB();renderBody()}
function selectAllVisible(){for(const r of getRecords(tab()))selected.add(r.id);renderBody()}
function clearSelection(){selected.clear();renderBody()}
function toggleSelected(id){selected.has(id)?selected.delete(id):selected.add(id);renderBody()}
function newTagHead(){modal('새 태그 머리',`<div class="form"><label>이름<input id="thName"></label><label>색상<input id="thColor" type="color" value="#315efb"></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createTagHead()">추가</button>`)}
async function createTagHead(){const p=page(),name=document.getElementById('thName').value.trim();if(!name)return; p.shared.tagHeads.push({id:uid(),name,color:document.getElementById('thColor').value});await saveDB();closeModal();renderBody()}
function newTag(){const p=page();modal('새 태그',`<div class="form"><label>태그 이름<input id="tgName"></label><label>태그 머리<select id="tgHead"><option value="">없음</option>${p.shared.tagHeads.map(h=>`<option value="${h.id}">${esc(h.name)}</option>`).join('')}</select></label><label>색상<input id="tgColor" type="color" value="#315efb"></label><label>메모<textarea id="tgMemo"></textarea></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="createTag()">추가</button>`)}
async function createTag(){const p=page(),name=document.getElementById('tgName').value.trim();if(!name)return;const head=p.shared.tagHeads.find(h=>h.id===document.getElementById('tgHead').value);p.shared.tags.push({id:uid(),name,headId:head?.id||null,color:document.getElementById('tgColor').value,memo:document.getElementById('tgMemo').value});await saveDB();closeModal();renderBody()}
function tagView(t){const p=page(),heads=p.shared.tagHeads,tags=p.shared.tags.filter(x=>!query||x.name.toLowerCase().includes(query.toLowerCase()));return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newTagHead()">＋ 태그 머리</button><button onclick="newTag()">＋ 태그</button></div><div class="tag-heads">${heads.map(h=>`<div class="tag-head"><div class="tag-head-title"><span><span class="color-dot" style="background:${esc(h.color||'#315efb')}"></span> ${esc(h.name)}</span><span><button class="iconbtn" onclick="editTagHead('${h.id}')">✎</button><button class="iconbtn danger" onclick="deleteTagHead('${h.id}')">×</button></span></div><div>${tags.filter(x=>x.headId===h.id).map(tagChip).join('')||'<span class="subtle">태그 없음</span>'}</div></div>`).join('')}</div><div class="section"><h3>태그 머리 없는 태그</h3><div>${tags.filter(x=>!x.headId).map(tagChip).join('')||'<span class="subtle">없음</span>'}</div></div>`}
function tagChip(x){return `<span class="chip dot" style="background:${esc(x.color||'#315efb')}22"><span class="color-dot" style="background:${esc(x.color||'#315efb')}"></span>${esc(x.name)} <button onclick="editTag('${x.id}')">✎</button></span>`}
function editTagHead(id){const p=page(),h=p.shared.tagHeads.find(x=>x.id===id);modal('태그 머리 편집',`<div class="form"><label>이름<input id="ehn" value="${esc(h.name)}"></label><label>색상<input id="ehc" type="color" value="${esc(h.color||'#315efb')}"></label></div>`,`<button onclick="closeModal()">취소</button><button class="danger" onclick="deleteTagHead('${id}')">삭제</button><button class="primary" onclick="saveTagHead('${id}')">저장</button>`)}
async function saveTagHead(id){const h=page().shared.tagHeads.find(x=>x.id===id);h.name=document.getElementById('ehn').value.trim()||h.name;h.color=document.getElementById('ehc').value;await saveDB();closeModal();renderBody()}
async function deleteTagHead(id){if(!confirm('태그 머리를 삭제할까요? 태그는 유지됩니다.'))return;const p=page();p.shared.tags.forEach(t=>{if(t.headId===id)t.headId=null});p.shared.tagHeads=p.shared.tagHeads.filter(x=>x.id!==id);await saveDB();closeModal();renderBody()}
function editTag(id){const p=page(),x=p.shared.tags.find(x=>x.id===id);modal('태그 편집',`<div class="form"><label>이름<input id="etn" value="${esc(x.name)}"></label><label>태그 머리<select id="eth"><option value="">없음</option>${p.shared.tagHeads.map(h=>`<option value="${h.id}" ${x.headId===h.id?'selected':''}>${esc(h.name)}</option>`).join('')}</select></label><label>색상<input id="etc" type="color" value="${esc(x.color||'#315efb')}"></label><label>메모<textarea id="etm">${esc(x.memo||'')}</textarea></label></div>`,`<button onclick="closeModal()">취소</button><button class="danger" onclick="deleteTag('${id}')">삭제</button><button class="primary" onclick="saveTag('${id}')">저장</button>`)}
async function saveTag(id){const x=page().shared.tags.find(x=>x.id===id);x.name=document.getElementById('etn').value.trim()||x.name;x.headId=document.getElementById('eth').value||null;x.color=document.getElementById('etc').value;x.memo=document.getElementById('etm').value;await saveDB();closeModal();renderBody()}
async function deleteTag(id){if(!confirm('태그를 삭제할까요?'))return;const p=page();p.shared.tags=p.shared.tags.filter(x=>x.id!==id);for(const t of p.tabs)for(const r of t.records)for(const f of t.schema.filter(f=>f.type==='tag'||f.type==='tag[]')){const v=r.data[f.name];if(Array.isArray(v))r.data[f.name]=v.filter(x=>x!==id);else if(v===id)r.data[f.name]=''}await saveDB();closeModal();renderBody()}
function entityName(x,type){const p=page(),tt=p.tabs.find(t=>t.type===type);const f=tt?.schema?.[0];return x.data?.[f?.name]||'이름 없음'}
function entityView(t,type){const p=page(),arr=type==='profile'?p.shared.profiles:p.shared.characters;const q=query.toLowerCase();const a=arr.filter(x=>!q||JSON.stringify(x.data).toLowerCase().includes(q));return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newEntity('${type}')">＋ ${type==='profile'?'프로필':'등장인물'}</button></div><div class="entity-grid">${a.map(x=>`<article class="entity-card"><div class="card-actions"><button onclick="editEntity('${type}','${x.id}')">✎</button><button class="danger" onclick="deleteEntity('${type}','${x.id}')">×</button></div><h3>${esc(entityName(x,type))}</h3>${(p.tabs.find(z=>z.type===type)?.schema||[]).slice(1).map(f=>`<div class="field"><div class="field-name">${esc(f.name)}</div><div>${displayValue(x.data?.[f.name],f.type)}</div></div>`).join('')}</article>`).join('')||'<div class="empty">데이터가 없습니다.</div>'}</div>`}
function newEntity(type){openEntityModal(type,null)}function editEntity(type,id){openEntityModal(type,id)}
function openEntityModal(type,id){const p=page(),t=p.tabs.find(x=>x.type===type);if(!t){toast('먼저 해당 유형의 Tab을 만들어주세요.');return}const arr=type==='profile'?p.shared.profiles:p.shared.characters;const x=id?arr.find(a=>a.id===id):{id:uid(),data:{}};modal(type==='profile'?(id?'프로필 편집':'새 프로필'):(id?'등장인물 편집':'새 등장인물'),`<div class="form">${t.schema.map(f=>fieldInput(f,x.data?.[f.name])).join('')}</div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveEntity('${type}','${x.id}',${!!id})">저장</button>`)}
async function saveEntity(type,id,editing){const p=page(),t=p.tabs.find(x=>x.type===type),arr=type==='profile'?p.shared.profiles:p.shared.characters,x=editing?arr.find(a=>a.id===id):{id,data:{}};for(const f of t.schema)x.data[f.name]=readField(f);if(editing)Object.assign(arr.find(a=>a.id===id),x);else arr.push(x);await saveDB();closeModal();renderBody()}
async function deleteEntity(type,id){if(!confirm('삭제할까요? 연결된 북마크의 참조도 제거됩니다.'))return;const p=page(),arr=type==='profile'?p.shared.profiles:p.shared.characters;const fieldTypes=type==='profile'?['profile','profile[]']:['character','character[]'];for(const t of p.tabs)for(const r of t.records)for(const f of t.schema.filter(f=>fieldTypes.includes(f.type))){const v=r.data[f.name];if(Array.isArray(v))r.data[f.name]=v.filter(x=>x!==id);else if(v===id)r.data[f.name]=''}if(type==='profile')p.shared.profiles=arr.filter(x=>x.id!==id);else p.shared.characters=arr.filter(x=>x.id!==id);await saveDB();renderBody()}
function categoryView(t){const p=page();return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newCategory()">＋ 카테고리</button></div><div class="entity-grid">${p.shared.categories.map(x=>`<article class="entity-card"><div class="card-actions"><button onclick="editCategory('${x.id}')">✎</button><button class="danger" onclick="deleteCategory('${x.id}')">×</button></div><h3>${esc(x.name)}</h3><div class="subtle">${esc(x.description||'')}</div></article>`).join('')||'<div class="empty">카테고리가 없습니다.</div>'}</div>`}
function newCategory(){modal('새 카테고리',`<div class="form"><label>이름<input id="cn"></label><label>설명<textarea id="cd"></textarea></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveCategory()">추가</button>`)}
async function saveCategory(id){const p=page(),x=id?p.shared.categories.find(x=>x.id===id):{id:uid()};x.name=document.getElementById('cn').value.trim();x.description=document.getElementById('cd').value;if(!x.name)return;if(!id)p.shared.categories.push(x);await saveDB();closeModal();renderBody()}
function editCategory(id){const x=page().shared.categories.find(x=>x.id===id);modal('카테고리 편집',`<div class="form"><label>이름<input id="cn" value="${esc(x.name)}"></label><label>설명<textarea id="cd">${esc(x.description||'')}</textarea></label></div>`,`<button onclick="closeModal()">취소</button><button class="danger" onclick="deleteCategory('${id}')">삭제</button><button class="primary" onclick="saveCategory('${id}')">저장</button>`)}
async function deleteCategory(id){if(!confirm('카테고리를 삭제할까요?'))return;page().shared.categories=page().shared.categories.filter(x=>x.id!==id);await saveDB();closeModal();renderBody()}
function folderView(t){const p=page();return `${toolbar(t,false)}<div class="actions" style="margin-bottom:12px"><button class="primary" onclick="newFolder()">＋ 폴더</button></div>${p.shared.folders.map(f=>{const n=p.tabs.filter(t=>t.type==='bookmark').reduce((n,t)=>n+t.records.filter(r=>Object.values(r.data||{}).some(v=>v===f.id||(Array.isArray(v)&&v.includes(f.id)))).length,0);return `<div class="folder-box"><div class="folder-head"><div><b>📁 ${esc(f.name)}</b><div class="subtle">${n}개 Record</div></div><div><button onclick="editFolder('${f.id}')">✎</button><button class="danger" onclick="deleteFolder('${f.id}')">삭제</button></div></div><div class="subtle">${esc(f.description||'')}</div></div>`}).join('')||'<div class="empty">폴더가 없습니다.</div>'}`}
function newFolder(){modal('새 폴더',`<div class="form"><label>폴더 이름<input id="fn"></label><label>설명<textarea id="fd"></textarea></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="saveFolder()">추가</button>`)}
async function saveFolder(id){const p=page(),x=id?p.shared.folders.find(x=>x.id===id):{id:uid()};x.name=document.getElementById('fn').value.trim();x.description=document.getElementById('fd').value;if(!x.name)return;if(!id)p.shared.folders.push(x);await saveDB();closeModal();renderBody()}
function editFolder(id){const x=page().shared.folders.find(x=>x.id===id);modal('폴더 편집',`<div class="form"><label>폴더 이름<input id="fn" value="${esc(x.name)}"></label><label>설명<textarea id="fd">${esc(x.description||'')}</textarea></label></div>`,`<button onclick="closeModal()">취소</button><button class="danger" onclick="deleteFolder('${id}')">삭제</button><button class="primary" onclick="saveFolder('${id}')">저장</button>`)}
async function deleteFolder(id){if(!confirm('폴더를 삭제할까요? 북마크의 다른 데이터는 유지됩니다.'))return;const p=page();p.shared.folders=p.shared.folders.filter(x=>x.id!==id);for(const t of p.tabs)for(const r of t.records)for(const f of t.schema.filter(f=>f.type==='folder'||f.type==='folder[]')){const v=r.data[f.name];if(Array.isArray(v))r.data[f.name]=v.filter(x=>x!==id);else if(v===id)r.data[f.name]=''}await saveDB();renderBody()}
function selectedRecords(){const t=tab();return t.records.filter(r=>selected.has(r.id))}
function bulkTag(){if(!selected.size)return;modal('선택한 Record에 태그',`<div class="form"><label>태그<select id="bulkTag" multiple>${page().shared.tags.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulkTag()">적용</button>`)}
async function applyBulkTag(){const ids=[...document.getElementById('bulkTag').selectedOptions].map(x=>x.value),t=tab(),f=t.schema.find(x=>x.type==='tag[]'||x.type==='tag');if(!f){toast('이 Tab에 태그 Field가 없습니다. Tab 설정에서 태그 Field를 추가하세요.');return}for(const r of selectedRecords()){const old=Array.isArray(r.data[f.name])?r.data[f.name]:r.data[f.name]?[r.data[f.name]]:[];r.data[f.name]=[...new Set([...old,...ids])]}await saveDB();selected.clear();closeModal();renderBody()}
function bulkCharacter(){if(!selected.size)return;modal('선택한 Record에 등장인물',`<div class="form"><label>등장인물<select id="bulkChar" multiple>${page().shared.characters.map(x=>`<option value="${x.id}">${esc(entityName(x,'character'))}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulkCharacter()">적용</button>`)}
async function applyBulkCharacter(){const ids=[...document.getElementById('bulkChar').selectedOptions].map(x=>x.value),t=tab(),f=t.schema.find(x=>x.type==='character[]'||x.type==='character');if(!f){toast('이 Tab에 등장인물 Field가 없습니다.');return}for(const r of selectedRecords()){const old=Array.isArray(r.data[f.name])?r.data[f.name]:r.data[f.name]?[r.data[f.name]]:[];r.data[f.name]=[...new Set([...old,...ids])]}await saveDB();selected.clear();closeModal();renderBody()}
function bulkFolder(){if(!selected.size)return;modal('선택한 Record를 폴더에 넣기',`<div class="form"><label>폴더<select id="bulkFolder">${page().shared.folders.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label></div>`,`<button onclick="closeModal()">취소</button><button class="primary" onclick="applyBulkFolder()">적용</button>`)}
async function applyBulkFolder(){const id=document.getElementById('bulkFolder').value,t=tab(),f=t.schema.find(x=>x.type==='folder'||x.type==='folder[]');if(!f){toast('이 Tab에 폴더 Field가 없습니다.');return}for(const r of selectedRecords())r.data[f.name]=f.type==='folder[]'?[id]:id;await saveDB();selected.clear();closeModal();renderBody()}
async function bulkDelete(){if(!selected.size||!confirm(`${selected.size}개 Record를 삭제할까요?`))return;const t=tab();t.records=t.records.filter(r=>!selected.has(r.id));selected.clear();await saveDB();renderBody()}
function exportDB(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tagmark-v2.02-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importDB(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=async()=>{const f=i.files?.[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x||!Array.isArray(x.pages))throw new Error('신형 DB 백업 형식이 아닙니다.');db=x;normalizeDB();await saveDB();render();toast('가져오기가 완료되었습니다.')}catch(e){toast('가져오기에 실패했습니다: '+e.message)}};i.click()}
async function init(){try{await loadDB();render()}catch(e){console.error(e);document.getElementById('app').innerHTML=`<div style="padding:30px"><h2>신형 로컬 DB를 열 수 없습니다.</h2><p>${esc(e.message||e)}</p></div>`}}
init();
</script></body></html>
