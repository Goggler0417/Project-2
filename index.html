<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bookmark DB Editor</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--line:#e2e5e9;--text:#17191c;--muted:#737981;--accent:#2563eb;--danger:#dc2626;--radius:12px}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{height:100vh;display:flex;flex-direction:column}.top{height:58px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:12px}
.logo{font-weight:700}.top .spacer{flex:1}.top input{width:min(360px,40vw);padding:9px 12px;border:1px solid var(--line);border-radius:9px}
.body{flex:1;min-height:0;display:flex}.sidebar{width:245px;background:var(--panel);border-right:1px solid var(--line);padding:14px;overflow:auto}.content{flex:1;min-width:0;overflow:auto;padding:22px}
.section-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 8px 7px}
.nav{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:8px;text-align:left}.nav:hover,.nav.active{background:#eef3ff}.nav .count{margin-left:auto;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:8px}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn.danger{color:var(--danger)}
h1{margin:0 0 6px;font-size:25px}h2{margin:0 0 12px;font-size:19px}.sub{color:var(--muted);font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-height:145px}.card h3{margin:0 0 6px}.card p{color:var(--muted);font-size:13px;line-height:1.45}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:#eef1f5;border-radius:999px;padding:4px 8px;font-size:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:18px 0}.toolbar .spacer{flex:1}.record-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.record{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.record .url{font-size:12px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.record-actions{display:flex;gap:6px;margin-top:12px}
.empty{padding:50px 20px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:12px}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal{width:min(760px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:20px}.modal-head{display:flex;align-items:center;margin-bottom:16px}.modal-head .spacer{flex:1}.form{display:grid;gap:13px}.field{display:grid;gap:6px}.field label{font-size:13px;font-weight:600}.field input,.field textarea,.field select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}.field textarea{min-height:90px;resize:vertical}.schema-row{display:grid;grid-template-columns:1fr 140px 36px;gap:8px;align-items:center}.schema-row input,.schema-row select{padding:8px;border:1px solid var(--line);border-radius:8px}.footer-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media(max-width:760px){.sidebar{width:190px}.content{padding:16px}.top input{width:180px}}
@media(max-width:560px){.sidebar{display:none}.top input{width:140px}.content{padding:12px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
const KEY="bookmark-editor-v1";
const TYPES=["text","long_text","url","number","boolean","date","datetime","image","file","color","rating","tag","tag[]","category","category[]","profile","profile[]","relation","relation[]","enum","duration","markdown","json"];

const seed={
  version:1,
  pages:[
    {id:"pixiv",name:"Pixiv",icon:"🎨",description:"Illustration / artist database",schema:[
      {id:"title",name:"Title",type:"text"},{id:"url",name:"URL",type:"url"},
      {id:"artist",name:"Artist",type:"profile"},{id:"series",name:"Series",type:"category"},
      {id:"tags",name:"Tags",type:"tag[]"},{id:"rating",name:"Rating",type:"rating"}
    ],records:[],categories:[],tags:[],profiles:[]},
    {id:"youtube",name:"YouTube",icon:"▶️",description:"Video / channel database",schema:[
      {id:"title",name:"Title",type:"text"},{id:"url",name:"URL",type:"url"},
      {id:"channel",name:"Channel",type:"profile"},{id:"playlist",name:"Playlist",type:"category"},
      {id:"duration",name:"Duration",type:"duration"},{id:"uploadDate",name:"Upload Date",type:"date"}
    ],records:[],categories:[],tags:[],profiles:[]},
    {id:"manga",name:"Manga",icon:"📚",description:"Independent manga database",schema:[
      {id:"title",name:"Title",type:"text"},{id:"url",name:"URL",type:"url"},
      {id:"author",name:"Author",type:"profile"},{id:"genres",name:"Genres",type:"tag[]"}
    ],records:[],categories:[],tags:[],profiles:[]}
  ]
};
let db=load(), current=null, query="";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||seed}catch(e){return seed}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
  document.getElementById("app").innerHTML=`
  <header class="top"><div class="logo">🔖 Bookmark DB</div><input id="search" placeholder="Search current page…" value="${esc(query)}"><div class="spacer"></div><button class="btn" onclick="exportDB()">Export JSON</button><button class="btn primary" onclick="newPage()">+ Page</button></header>
  <div class="body"><aside class="sidebar">
    <div class="section-title">Main</div><button class="nav ${current===null?'active':''}" onclick="selectPage(null)">🏠 Main Page</button>
    <div class="section-title">Pages</div>
    ${db.pages.map(p=>`<button class="nav ${current===p.id?'active':''}" onclick="selectPage('${p.id}')">${esc(p.icon||"📁")} ${esc(p.name)} <span class="count">${p.records.length}</span></button>`).join("")}
  </aside><main class="content" id="content"></main></div>`;
  document.getElementById("search").oninput=e=>{query=e.target.value;renderContent()};
  renderContent();
}
function renderContent(){
 const c=document.getElementById("content"); if(!c)return;
 if(current===null){c.innerHTML=`<h1>Main Page</h1><div class="sub">Each top-level page owns an independent schema and data space.</div>
 <div class="toolbar"><div class="spacer"></div><button class="btn primary" onclick="newPage()">Create Site / Category Page</button></div>
 <div class="cards">${db.pages.map(p=>`<div class="card"><h3>${esc(p.icon||"📁")} ${esc(p.name)}</h3><p>${esc(p.description||"")}</p><div class="chips"><span class="chip">${p.records.length} records</span><span class="chip">${p.schema.length} fields</span></div><div class="record-actions"><button class="btn" onclick="selectPage('${p.id}')">Open</button><button class="btn" onclick="editPage('${p.id}')">Configure</button></div></div>`).join("")||'<div class="empty">No pages yet.</div>'}</div>`;return}
 const p=db.pages.find(x=>x.id===current); if(!p){current=null;return renderContent()}
 const records=p.records.filter(r=>JSON.stringify(r).toLowerCase().includes(query.toLowerCase()));
 c.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><div><h1>${esc(p.icon||"📁")} ${esc(p.name)}</h1><div class="sub">${esc(p.description||"Independent database space")}</div></div><div class="spacer"></div><button class="btn" onclick="editPage('${p.id}')">Page Schema / UI</button></div>
 <div class="toolbar"><button class="btn primary" onclick="newRecord('${p.id}')">+ Record</button><button class="btn" onclick="manageList('${p.id}','categories')">Categories (${p.categories.length})</button><button class="btn" onclick="manageList('${p.id}','tags')">Tags (${p.tags.length})</button><button class="btn" onclick="manageList('${p.id}','profiles')">Profiles (${p.profiles.length})</button><div class="spacer"></div><span class="sub">${records.length} / ${p.records.length} records</span></div>
 <div class="record-grid">${records.map(r=>recordHTML(p,r)).join("")||'<div class="empty">No records match the current search.</div>'}</div>`;
}
function recordHTML(p,r){
 const titleField=p.schema.find(f=>f.id==="title")||p.schema[0]; const title=titleField?(r[titleField.id]||"Untitled"):"Untitled";
 const fields=p.schema.filter(f=>f.id!==(titleField&&titleField.id)).slice(0,5);
 return `<article class="record"><h3>${esc(title)}</h3>${fields.map(f=>`<div style="margin-top:7px"><b style="font-size:12px">${esc(f.name)}</b><div class="sub">${esc(Array.isArray(r[f.id])?r[f.id].join(", "):r[f.id]??"")}</div></div>`).join("")}<div class="record-actions"><button class="btn" onclick="editRecord('${p.id}','${r.id}')">Edit</button><button class="btn danger" onclick="deleteRecord('${p.id}','${r.id}')">Delete</button></div></article>`;
}
function selectPage(id){current=id;query="";render()}
function newPage(){openPageModal()}
function editPage(id){openPageModal(db.pages.find(p=>p.id===id))}
function openPageModal(p){
 const editing=!!p;
 modal(`<div class="modal-head"><h2>${editing?"Configure Page":"New Site / Category Page"}</h2><div class="spacer"></div><button class="btn" onclick="closeModal()">×</button></div>
 <div class="form"><div class="field"><label>Name</label><input id="pname" value="${esc(p?.name||"")}"></div>
 <div class="field"><label>Icon</label><input id="picon" value="${esc(p?.icon||"📁")}"></div>
 <div class="field"><label>Description</label><textarea id="pdesc">${esc(p?.description||"")}</textarea></div>
 <h3>Data Schema</h3><div id="schemaRows">${(p?.schema||[]).map(schemaRow).join("")}</div>
 <button class="btn" onclick="addSchemaRow()">+ Add field</button>
 <div class="footer-actions"><button class="btn" onclick="closeModal()">Cancel</button>${editing?`<button class="btn danger" onclick="deletePage('${p.id}')">Delete Page</button>`:""}<button class="btn primary" onclick="savePage('${p?.id||""}')">Save</button></div></div>`);
}
function schemaRow(f={id:"",name:"",type:"text"}){return `<div class="schema-row"><input class="sname" placeholder="Field name" value="${esc(f.name)}"><select class="stype">${TYPES.map(t=>`<option ${t===f.type?"selected":""}>${t}</option>`).join("")}</select><button class="btn danger" onclick="this.parentElement.remove()">×</button></div>`}
function addSchemaRow(){document.getElementById("schemaRows").insertAdjacentHTML("beforeend",schemaRow())}
function savePage(id){
 const rows=[...document.querySelectorAll(".schema-row")];
 const schema=rows.map((row,i)=>({id:(row.querySelector(".sname").value.trim()||"field_"+i).toLowerCase().replace(/[^a-z0-9_가-힣-]/g,"_"),name:row.querySelector(".sname").value.trim()||"Field "+(i+1),type:row.querySelector(".stype").value}));
 if(!schema.length)return alert("Add at least one field.");
 if(id){const p=db.pages.find(x=>x.id===id);p.name=document.getElementById("pname").value.trim()||p.name;p.icon=document.getElementById("picon").value;p.description=document.getElementById("pdesc").value;p.schema=schema}
 else {const p={id:"page_"+Date.now(),name:document.getElementById("pname").value.trim()||"New Page",icon:document.getElementById("picon").value,description:document.getElementById("pdesc").value,schema,records:[],categories:[],tags:[],profiles:[]};db.pages.push(p);current=p.id}
 save();closeModal();render()
}
function deletePage(id){if(confirm("Delete this entire independent page and all of its records?")){db.pages=db.pages.filter(p=>p.id!==id);current=null;save();closeModal();render()}}
function newRecord(pid){const p=db.pages.find(x=>x.id===pid);openRecordModal(p)}
function editRecord(pid,rid){const p=db.pages.find(x=>x.id===pid),r=p.records.find(x=>x.id===rid);openRecordModal(p,r)}
function openRecordModal(p,r){
 const editing=!!r;
 modal(`<div class="modal-head"><h2>${editing?"Edit Record":"New Record"}</h2><div class="spacer"></div><button class="btn" onclick="closeModal()">×</button></div><div class="form">${p.schema.map(f=>`<div class="field"><label>${esc(f.name)} <span class="sub">(${f.type})</span></label>${inputFor(f,r?.[f.id])}</div>`).join("")}<div class="footer-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveRecord('${p.id}','${r?.id||""}')">Save</button></div></div>`);
}
function inputFor(f,v){
 v=Array.isArray(v)?v.join(", "):v??"";
 if(f.type==="long_text"||f.type==="markdown"||f.type==="json")return `<textarea data-field="${esc(f.id)}">${esc(v)}</textarea>`;
 if(f.type==="boolean")return `<select data-field="${esc(f.id)}"><option value="">—</option><option ${v===true||v==="true"?"selected":""} value="true">true</option><option ${v===false||v==="false"?"selected":""} value="false">false</option></select>`;
 if(["number","rating"].includes(f.type))return `<input type="number" data-field="${esc(f.id)}" value="${esc(v)}">`;
 if(f.type==="date")return `<input type="date" data-field="${esc(f.id)}" value="${esc(v)}">`;
 if(f.type==="datetime")return `<input type="datetime-local" data-field="${esc(f.id)}" value="${esc(v)}">`;
 if(f.type.endsWith("[]")||["tag","category","profile","relation"].includes(f.type))return `<input data-field="${esc(f.id)}" value="${esc(v)}" placeholder="comma-separated values">`;
 return `<input data-field="${esc(f.id)}" value="${esc(v)}">`;
}
function saveRecord(pid,rid){
 const p=db.pages.find(x=>x.id===pid),data={};document.querySelectorAll("[data-field]").forEach(el=>{let v=el.value;if(p.schema.find(f=>f.id===el.dataset.field)?.type==="number"||p.schema.find(f=>f.id===el.dataset.field)?.type==="rating")v=v===""?"":Number(v);else if(p.schema.find(f=>f.id===el.dataset.field)?.type==="boolean")v=v===""?"":v==="true";else if(p.schema.find(f=>f.id===el.dataset.field)?.type.endsWith("[]"))v=v.split(",").map(x=>x.trim()).filter(Boolean);data[el.dataset.field]=v});
 if(rid)Object.assign(p.records.find(r=>r.id===rid),data);else p.records.push({id:"rec_"+Date.now(),...data});
 save();closeModal();renderContent()
}
function deleteRecord(pid,rid){if(confirm("Delete this record?")){const p=db.pages.find(x=>x.id===pid);p.records=p.records.filter(r=>r.id!==rid);save();renderContent()}}
function manageList(pid,key){const p=db.pages.find(x=>x.id===pid);const label=key[0].toUpperCase()+key.slice(1);modal(`<div class="modal-head"><h2>${label}</h2><div class="spacer"></div><button class="btn" onclick="closeModal()">×</button></div><div class="form"><input id="listNew" placeholder="Add ${key.slice(0,-1)}"><button class="btn primary" onclick="addList('${pid}','${key}')">Add</button><div>${p[key].map((x,i)=>`<div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)"><span>${esc(x.name||x)}</span><div class="spacer"></div><button class="btn danger" onclick="removeList('${pid}','${key}',${i})">×</button></div>`).join("")||'<div class="sub">Empty</div>'}</div></div>`)}
function addList(pid,key){const p=db.pages.find(x=>x.id===pid),v=document.getElementById("listNew").value.trim();if(v){p[key].push(key==="profiles"?{id:"p_"+Date.now(),name:v}:v);save();manageList(pid,key);renderContent()}}
function removeList(pid,key,i){const p=db.pages.find(x=>x.id===pid);p[key].splice(i,1);save();manageList(pid,key);renderContent()}
function modal(inner){let x=document.getElementById("modal");if(!x){x=document.createElement("div");x.id="modal";x.className="modal-back";document.body.appendChild(x)}x.innerHTML=`<div class="modal">${inner}</div>`}
function closeModal(){document.getElementById("modal")?.remove()}
function exportDB(){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="bookmark-db.json";a.click();URL.revokeObjectURL(a.href)}
render();
</script>
</body>
</html>
